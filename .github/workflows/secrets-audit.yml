# ---------------------------------------------------------------------------
# Full-history secrets audit — GitHub #145
#
# Wires scripts/security/run_secrets.ps1 (gitleaks + trufflehog across the
# WHOLE git history, not just the current tree) into a dispatchable lane.
# Before this workflow existed it was invoked by nothing: `git grep
# 'scripts/security' -- .github/` found exactly one hit, a comment in
# windows-fuzz.yml stating that a DIFFERENT script (run_fuzz.ps1) is never
# reached. A scan that exists, is documented, and nothing runs provides the
# appearance of coverage with none of the substance — see #145's own framing.
#
# `scripts/security/check_regressions.ps1` is deliberately NOT here: GitHub
# #145 named it alongside run_secrets.ps1, but it is already wired, as CTest
# `security_regression_check` (tests/security/CMakeLists.txt, LABELS
# "security"), which windows-validation.yml's "Run ctest -L security" step
# already runs. Re-wiring an already-wired script here would be duplicate
# coverage, not new coverage — see docs/audit/backlog-p82/phase-13/notes.md
# for the verification.
#
# NO `schedule:` TRIGGER — see dependency-audit.yml's header for the full
# reasoning (self-hosted runner is not a service; an unattended scheduled run
# queues and reports `cancelled`, alerting nobody; and it is the owner's
# standing instruction that this project have no recurring scheduled items).
# Both gitleaks.exe and trufflehog.exe are already present at tools/bin/ on
# this machine (verified locally), so this lane needs no extra install step.
# ---------------------------------------------------------------------------

name: Secrets Audit (full history)

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: >-
          Set to any non-empty value to overwrite tests/security/secrets/baseline.json
          with the findings from THIS run, after triaging them in
          tests/security/secrets/triage.md. Leave empty for a normal audit run.
        required: false
        default: ""

concurrency:
  group: secrets-audit
  cancel-in-progress: false

jobs:
  secrets-audit:
    name: secrets-audit
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    timeout-minutes: 60

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # fetch-depth: 0 is LOAD-BEARING here, unlike most steps in this
          # repo's other workflows: run_secrets.ps1's whole point is walking
          # the FULL git log for blobs a shallow clone would not have.
          fetch-depth: 0
          clean: false

      - name: Run full-history secrets scan (run_secrets.ps1)
        id: run_secrets
        shell: pwsh
        run: |
          $updateBaseline = "${{ inputs.update_baseline }}" -ne ""
          if ($updateBaseline) {
            pwsh -File scripts/security/run_secrets.ps1 -UpdateBaseline
          } else {
            pwsh -File scripts/security/run_secrets.ps1
          }
          $rc = $LASTEXITCODE
          Write-Host "run_secrets.ps1 exit code: $rc"
          if ($rc -ne 0) {
            Write-Error "Secrets audit FAILED (exit $rc) -- see tests/security/reports/secrets/summary.md above. A new finding outside the baseline must be triaged in tests/security/secrets/triage.md before -UpdateBaseline."
            exit $rc
          }

      - name: Upload secrets audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pdfe-secrets-audit-${{ github.sha }}
          path: |
            tests/security/reports/secrets/findings.json
            tests/security/reports/secrets/summary.md
            tests/security/reports/secrets/gitleaks.json
            tests/security/reports/secrets/trufflehog.json
          if-no-files-found: warn
          retention-days: 90
