        # MOVED TO THE PER-PUSH LANE (GitHub #184). This lint lived only in
        # governance.yml, which is workflow_dispatch-only — so a commit adding
        # an ungated pdf_open_document could merge, and the census would not
        # object until somebody dispatched governance by hand. The whole point
        # of #92 is to catch the NEW site on the commit that introduces it.
        #
        # It is pure Python over tracked src/ files: no build, no compile
        # database, no runner. There was never a reason for it to be in a
        # heavyweight lane. It stays wired in governance.yml too — the two
        # routes are cheap and a lint that runs twice costs nothing.
        #
        # --self-test FIRST, and it is not decoration: it pins that prose is
        # not credited as a guard, that the stream form is excluded, that a
        # gated-by-caller directive is re-verified against the real caller set
        # rather than trusted, and — the case a mutation actually caught — that
        # a guard in a DIFFERENT function of the calling file does not count.
        #
        # The third invocation is the CLASS-level test (DCA 0081). The
        # in-script --self-test grew its cases one instance at a time, which is
        # how the caller-PLACEMENT axis stayed blind: a mutation adding an
        # ungated caller inside the DEFINING FILE reported PASS, because
