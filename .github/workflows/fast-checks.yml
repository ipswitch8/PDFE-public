        # 2026-10-18 history rewrite are STILL SERVED by SHA, and that 28 of them
        # still expose the identity that rewrite removed. The SHAs are not
        # secret: every Actions run records the head_sha it ran against.
        #
        # The conclusion -- stay private until GitHub confirms collection -- was
        # written in three documents and enforced by nothing. The claim-check
        # gate failed the phase for precisely that: highest consequence in the
        # pipeline, irreversible when violated, and no branch rule, workflow or
        # check would have noticed a flip to public.
