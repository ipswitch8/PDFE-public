        # Neither was a procedural failure: each was complete with respect to
        # the needle set it loaded. The INVENTORY was incomplete, and nothing
        # checked that. Two fresh-repo migrations and four history rewrites were
        # each sound for the surface they targeted and each was followed by the
        # discovery of a surface, or a needle, they had not covered -- so the
        # ratchet has to be on COVERAGE, not on procedure.
        #
        # Also verifies load_all_needles() actually adds the host needle and
        # fails closed on a missing/empty/plaintext baseline, so this does not
