      - name: The push/PR trigger topology is what the headers claim (GitHub #187)
        # #187 IS, AT BOTTOM, ONE SENTENCE THAT WENT FALSE WITH NOTHING WATCHING.
        # windows-validation.yml's header said it "gates push/PR to master" for
        # two months after the triggers were removed, while ~8 gate scripts
        # reachable only from that file ran nightly at best.
        #
        # Phase 1 corrected that header to say the opposite — and the claim-check
        # gate pointed out the correction had no mechanism either. Nothing under
        # tools/gate/ parsed any workflow's `on:` block;
        # check_fast_checks_citations.py says so in its own words ("Nothing here
        # reads triggers"). So re-adding push: to a dispatch-only workflow, or
        # removing it from THIS file, would have falsified the new sentence
        # exactly as it falsified the old one.
        #
        # Writing a truer sentence is not a fix. This step is the fix: it asserts
        # the topology on the commit that would break it. It also fails if
        # windows-validation.yml's header stops naming the checker, so the claim
        # cannot drift away from its enforcement.
        #
        # Note this step is self-referential in the useful direction — removing
        # push:/pull_request: from fast-checks.yml is [missing-auto-trigger], a
        # DIFFERENT and louder failure than a heavyweight lane gaining them.
        #
        # --self-test FIRST. That is not ceremony: earlier in this same phase a
        # check was promoted into this lane on "exit 0, offline, fast" with no
        # negative case of its own, and it turned out to pass the very tampering
        # it claimed to catch. This one had its self-test written before it was
        # wired in — 30 checks, both failure directions, every fail-closed path,
        # and the YAML 1.1 trap where a bare `on:` key parses as the boolean True
        # (read it as the string "on" and every workflow looks trigger-less,
        # which would pass vacuously on the exact question this answers).
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/check_workflow_triggers.py --self-test
          python tools/gate/check_workflow_triggers.py

      - name: Guard reachability — a guard no automatic workflow runs is not a guard
        if: ${{ !cancelled() }}
        # Standing control for the OTHER HALF of test-gap class C-BELOW, "every
        # test enters below the defect" — docs/audit/test-gap-classes.md §3.
        # GitHub #255.
        #
        # The engine-wiring step above covers the half where PRODUCT CODE is
        # unreachable from src/main.cpp. It walks C++ classes under src/, so it
        # structurally cannot see the half that has actually kept recurring:
        # the CONTROL ITSELF being unreachable. #145 found two security scripts
        # invoked by no workflow; #187 found seven more; #201 found one still
        # orphaned AFTER #145 was supposed to have fixed it.
        #
        # WHY THE POPULATION IS NOT check_*.py. Four of #187's seven —
        # fz_try_raii_scan.py, page_load_guard_scan.py, parity_filter.py,
        # scrub_artifacts.py — are not named check_*. A prefix-scoped control
        # would have caught 3 of 7 in the very defect it exists to prevent.
        # Scoping a population by a naming convention rather than by the
        # property is C-ENUM, so this globs every tools/gate/*.py.
        #
        # WHY "NAMED IN A WORKFLOW" IS NOT ENOUGH. #187's seven WERE named — in
        # windows-validation.yml, which is workflow_dispatch-only, so they ran
        # on neither push nor locally. Automatic means push/pull_request/
        # pull_request_target, and that tuple is IMPORTED from
        # check_workflow_triggers.py rather than restated (DCA 0052).
        #
        # guard_reachability_baseline.json is a RATCHET: a newly unreachable
        # guard fails, and a baselined one that becomes REACHED must be removed
        # or this fails too.
        #
        # Deliberately NO entry count here. An earlier version of this comment
        # gave a tally and named the single issue behind it; by the end of the
        # same pipeline it was wrong about the number AND about which issues
        # were involved, so a reader judging "how much is parked" would have
        # undercounted the admitted gaps and never seen #258. Nothing checks a
        # comment against the file it describes, so the tally lives in exactly
        # one place: the guard prints it on every run, and the file is the
        # record. Read them, not this.
        #
        # The taxonomy is ENFORCED rather than documented, so a live gap cannot
        # be parked under an invented label. The kinds are listed here — and
        # only here — because `test_the_workflow_comment_names_exactly_the_kinds
        # _the_code_enforces` compares this list against BASELINE_KINDS in both
        # directions. A copy is safe exactly when something checks it; the
        # count deliberately is NOT restated, because nothing checks a count:
        #   one-shot-phase-verifier  archival; machine-checked one pipeline
        #                            phase once and is kept as evidence.
        #   admitted-gap             a REAL orphan, parked, and REQUIRED to
        #                            carry a GitHub issue number.
        #   deliberately-local-only  its job is to run outside CI, so being
        #                            unreached from here is correct.
        #   reached-via-ctest        reached through a CMake add_test, which
        #                            needs a configured build tree and so
        #                            cannot be a step here. MUST name the
        #                            target, and the guard confirms that
        #                            target exists.
        #
        # The admitted gaps are what this guard found: GitHub #256, and #258 —
        # three of #187's own seven, still reachable only from dispatch-only
        # windows-validation.yml because their per-push copies would have no
        # artifacts to read. #187 was closed by adding their COMPANION TESTS to
        # the batch above, which tests each checker's judgement without ever
        # running its sweep.
        #
        # --self-test first, seventeen cases. A dispatch-only wiring, a shell
        # comment, a docstring mention and a literally-false `if:` must all read
        # UNREACHED; a bare import stem and a pytest companion must read
        # REACHED; an unparseable workflow must be an ERROR rather than a pass;
        # and the ratchet must reject a healed entry, a deleted entry, a kind
        # outside the taxonomy, an admitted gap with no issue, and a
        # reached-via-ctest entry whose target is unnamed or undeclared.
        run: |
          python tools/gate/check_guard_reachability.py --self-test
          python tools/gate/check_guard_reachability.py --repo-root .

      - name: Security-regime dispositions match the tree (GitHub #201)
        # #201: the security regime produces no evidence — run_sast.ps1 is
        # invoked by nothing, pdfe_security_nightly by no workflow, the two
        # lanes #145 added have never run, and six baselines are frozen. Most
        # of those are DELIBERATE (runtime, tooling, and the standing
        # no-scheduled-items instruction), and the ones that are not still have
        # to be visible. Either way the failure mode is identical: a reader
        # concludes from docs/security-testing.md that something runs.
        #
        # So the disposition of every scripts/security/*.ps1 is a table in that
        # document, and this step compares the table against the tree. It fails
        # in BOTH directions — a row claiming a lane that does not exist, and a
        # row saying NONE for something that has since been wired — because a
        # table that can only be wrong in one direction stops being read.
        # Discovery, not a frozen list: a dispatcher added with no row fails
        # here rather than joining the set of things nobody runs.
        #
        # Pure Python, offline, no scanner is invoked, ~0.1 s — it inspects
        # workflow text, tests/security/CMakeLists.txt and a markdown table.
        # That is what makes it safe for the automatic lane, which matters
        # because the whole defect class is "only reachable from a lane nobody
        # dispatches".
        #
        # --self-test FIRST: it drives all eight branches including the one
        # that bit the checker itself — a comment-only mention of a script in
        # a workflow header (secrets-audit.yml says check_regressions.ps1 is
        # deliberately NOT wired there) must not count as an invoker.
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/check_security_regime.py --self-test
          python tools/gate/check_security_regime.py --check
          python tools/gate/run_security_regression_check.py --self-test

      - name: A vcpkg overlay re-pin cannot land without its verification report (GitHub #187)
        # WHY THIS IS HERE AND NOT IN windows-validation.yml.
        #
        # Before 2026-09-13 verify_vcpkg_overlays.py was invoked by NOTHING —
        # no workflow, no CMake test, no other script. Its only mention
        # anywhere in the tree was a prose comment. It re-pins the SHA-512 of
        # the mujs and gumbo overlay port sources, which is how PDFE's MuPDF
        # dependency chain is built, so "nobody runs it" is a supply-chain hole
        # rather than dead weight.
        #
        # WHAT --check ACTUALLY DOES, stated precisely because the first version
        # of this step got it wrong. It reconciles the SHA-512 in each overlay
        # portfile against the value recorded for that port in
        # docs/security/vcpkg-overlay-source-verification.md. So a re-pin cannot
        # land unless the verification report is re-derived in the same change —
        # which is the property the report exists to provide.
        #
        # IT DOES NOT re-download the archives or re-derive the hashes. That is
        # the ONLINE half, and it stays on-demand (`--out`): a per-push step
        # reaching two third-party hosts turns their downtime into a red master.
        # So this is an offline reconciliation of two committed files, and the
        # tool's own output says so on success rather than leaving the reader to
        # assume more.
        #
        # WHY THE WORDING IS LOAD-BEARING HERE. As first written, this step
        # claimed to "confirm the pins still match the committed verification
        # report" while `--check` only regex-matched a 128-hex SHA512 line. It
        # caught a BROKEN pin and not a TAMPERED one — and tampering is the
        # threat. The phase-1 security-audit gate proved it by substitution:
        # `SHA512 deadbeef` failed correctly, but a well-formed wrong value
        # (`aaaa…a`, i.e. a malicious re-pin to attacker-controlled bytes)
        # printed OK and exited 0. The MECHANISM was fixed rather than the
        # sentence softened; both cases are now pinned by --self-test.
        #
        # --self-test FIRST, and it is not decoration: it drives every failure
        # branch (pin-malformed, pin-mismatch, port-not-in-report,
        # report-missing/unparseable/inconsistent) plus the positive case, and
        # includes the decoy — re-pinning to a DIFFERENT well-formed hash that
        # appears elsewhere in the same report section must still fail.
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/verify_vcpkg_overlays.py --self-test
          python tools/gate/verify_vcpkg_overlays.py --check

      - name: Cross-platform parity selection is non-empty and complete (GitHub #187)
        # parity_filter.py is the SINGLE generator that windows-, linux- and
        # macos-validation all call to obtain the C-10 core-parity gtest_filter.
        # All three are workflow_dispatch-only, so until now a parity_suite.txt
        # that had been truncated — or emptied — would not have been noticed
        # until someone dispatched a lane by hand, and then only as "the parity
        # run was suspiciously quick".
        #
        # The generator needs no build and no test results: it reads a tracked
        # text file and prints a filter. So the CHECK belongs here even though
        # the CONSUMERS cannot. Both directions are asserted — a filter must be
        # produced, and its pattern count must equal the number of non-comment
        # lines in the source list, so a silently-dropped suite fails.
        #
        # The verification lives in the tool as `--check`, not as a shell
        # pipeline here, deliberately: run_fast_checks_locally.py mirrors CI by
        # scanning this file for plain command lines, and its own test fails
        # when a referenced gate script is not discoverable that way. A check
        # buried in `$(...)` would be enforced on push and invisible to the
        # local mirror — the same "looks covered, is not" shape this phase is
        # about. (Caught by that test, not by review.)
        if: ${{ !cancelled() }}
        run: python tools/gate/parity_filter.py --check

      - name: Artifact path-scrubber and CI-readiness checker self-tests (GitHub #187)
        # Both scripts are referenced only from the dispatch-only
        # windows-validation lane, and both are pure Python with an offline
        # self-test. The REAL invocations legitimately stay there —
        # scrub_artifacts.py operates on render-junit.xml/render-suite.log
        # after that job has produced them, and check_ci_readiness.py's
        # `readiness`/`steps` subcommands query the GitHub API about a specific
        # run and its self-hosted runner. Neither input exists here.
        #
        # What CAN run here is each tool's own mechanism. A scrubber whose
        # substitution has regressed removes nothing and reports success; a
        # readiness checker whose "could not perform the check" branch has
        # regressed reports READY. Catching that on the commit that breaks it
        # is the whole point.
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/scrub_artifacts.py --self-test
          python tools/gate/check_ci_readiness.py self-test

      - name: The gitignored-corpus silent set cannot grow (GitHub #189)
        # test_PDFs/ is 332 MB of third-party documents with exactly 1 of 64
        # files tracked, so the oracles resolving it GTEST_SKIP on every clean
        # checkout — which is every CI run, since actions/checkout does
        # `git clean -ffdx`. A skip counts as GREEN in the summary line, in the
        # JUnit XML, and to every gate that reads either.
        #
        # Committing the corpus is not the answer (size AND licensing), and
        # converting the two remaining sites to hard failures would redden every
        # run for an input CI will never have — which teaches people to ignore
        # red. So the class is FROZEN instead: a new corpus-gated skip fails
        # here, on the commit that adds it, and a baseline entry that outlives
        # its site fails too so the list cannot go stale.
        #
        # The complementary RUN-TIME half lives in the gtest harness
        # (tests/scripts/run_gtest), which now names every oracle that did not
        # execute, next to the pass count, on every run.
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/check_external_corpus_skips.py --self-test
          python tools/gate/check_external_corpus_skips.py --repo-root .

      - name: A skip reason cannot claim an objectName src/ defines (GitHub #209)
        # Third recorded instance of one class: a UI test skips — which reports
        # GREEN — on a reason asserting a product feature is absent, while src/
        # has defined it for months. #178 (two stale reasons in
        # test_canvas_coords_p2.py), #198 (a stale pdfCanvas UIA path reported
        # as "canvas absent"), #209 (five *_phase_post.py files, >=7 cases,
        # including `pytest.skip("invisibleCheck not in this build")` four
        # months after the widget was renamed to invisibleCheckBox).
        #
        # The premise is recorded INSIDE the test, where nothing re-checks it.
        # This is the thing that re-checks it: every skip reason under
        # tests/ui_automation is matched against src/'s setObjectName literals,
        # including renamed forms, f-string reasons built from parametrize
        # values, and reasons bound to a local first — the three shapes that
        # let #209 through a naive scan.
        #
        # --selftest-exclusion runs first because this guard's own source and
        # self-test contain the exact decoy strings it hunts; it proves the
        # exclusion is LOAD BEARING (the decoys are caught when it is bypassed)
        # before proving it is effective, so "green on tools/gate" is not a
        # zero-against-zero. lint_unc_gate and two others were reddened by that
        # self-match trap.
        if: ${{ !cancelled() }}
        run: |
          python -m pytest -q tools/gate/test_check_skip_reason_objectnames.py
          python tools/gate/check_skip_reason_objectnames.py --selftest-exclusion
          python tools/gate/check_skip_reason_objectnames.py

      - name: "Render JUnit artifact guard: own mechanism (GitHub #141)"
        # The REAL check needs render-junit.xml, which only the render job
        # produces, so it correctly stays in windows-validation.yml. Its
        # MECHANISM does not: a guard that has lost the ability to notice an
        # empty or partial artifact reports PASS on the very artifact #141 is
        # about, and would do so silently until somebody dispatched the
        # heavyweight lane. The self-test covers empty, missing, partial and
        # vacuous-expectation cases plus the root-element backfill, in both
        # directions, on synthetic XML.
        if: ${{ !cancelled() }}
        run: python tools/gate/check_render_junit.py --self-test

      - name: "fz_try/RAII scan: 'could not check' is not 'clean' (GitHub #187)"
        # THE SCAN ITSELF CANNOT RUN HERE — it needs a clang-cl compile
        # database that only a configured Windows build produces, so the real
        # sweep correctly stays in windows-validation.yml. But the defect #187
        # names is not in the analysis; it is in what the tool does when it
        # reaches NOTHING. It used to print `translation units : 0 / hazards :
        # 0` and exit 0, which every caller that inspects only the exit code
        # reads as a clean tree. That decision is pure Python over a synthetic
        # database and a temp directory, so it runs on every push.
        #
        # libclang is installed only because fz_try_raii_scan.py imports
        # clang.cindex at module scope and — deliberately — raises rather than
        # degrading if it is absent. The wheel is pure-Python and no clang
        # binary is invoked by these tests.
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --disable-pip-version-check -q libclang
          python -m pytest -q tools/gate/test_fz_try_raii_scan_coverage.py

      # GitHub #250/#218. Offline guards over the committed OCR-layer fixtures
      # and their generator's Tesseract discovery. Runs in THIS job because
      # pymupdf/fonttools are installed here and not in installer-dry-run --
      # the #260 lesson: a step whose job lacks its dependency passes locally
      # and dies on CI with ModuleNotFoundError.
      - name: OCR fixture integrity + tesseract discovery (#250/#218)
        if: ${{ !cancelled() }}
        run: python -m pytest -q tests/test_ocr_fixture_integrity.py

      - name: Gate self-tests + matrix pass-semantics (R-24/R-26/R-28/R-32/R-37)
        if: ${{ !cancelled() }}
        run: >
          python -m pytest -q
          tools/gate/test_check_perf_floor.py
          tools/gate/test_mutation_kill_floor.py
          tools/gate/test_mutation_manifest_sweep.py
          tools/gate/test_check_dca.py
          tools/gate/test_check_dca_presence.py
          tools/gate/test_check_engine_wiring.py
          tools/gate/test_check_page_pointer_rebind.py
          tools/gate/test_check_guard_reachability.py
          tools/gate/test_cenum_controls_are_distinct.py
          tools/gate/test_duplicate_definition_mirror_agreement.py
          tools/gate/test_duplicate_definition_ratchet.py
          tools/gate/test_stress_baseline_is_not_run_writable.py
          tools/gate/test_check_coverage_floor.py
          tools/gate/test_check_flaky_quarantine.py
          tools/gate/test_check_junit_xml.py
          tools/gate/test_check_rtm_live_ui_citations.py
          tools/gate/test_check_reachability_skip_shape.py
          tools/gate/test_f35_tranche_controls.py
          tools/gate/test_check_asan_cadence.py
          tools/gate/test_check_magnitude_guard.py
          tools/gate/test_check_runner_queue_overlap.py
          tools/gate/test_check_f38c_risk_acceptance.py
          tools/gate/test_check_fast_checks_citations.py
          tools/gate/test_check_f45_ci_only_markers.py
          tools/gate/test_check_third_party_notices.py
          tools/gate/test_tessdata_integrity.py
          tools/gate/test_check_label_drift.py
          tools/gate/test_rebuild_assert.py
          tools/gate/test_check_tracked_path_hygiene.py
          tools/gate/test_check_scrub_regressions.py
          tools/gate/test_check_tracker_hygiene.py
          tools/gate/test_redact_tracker_text.py
          tools/gate/test_migrate_tracker.py
          tools/gate/test_check_release_asset_hygiene.py
          tools/gate/test_check_judgement_prose.py
          tools/gate/test_check_record_vs_diff.py
          tools/gate/test_check_workflow_expressions.py
          tools/gate/test_check_pwsh_step_locals.py
          tools/gate/test_check_test_pipe_naming.py
          tools/gate/test_check_staged_runtime_closure.py
          tools/gate/test_check_fz_try_throw_free.py
          tools/gate/test_run_fast_checks_locally.py
          tools/gate/test_win87_src_is_clean.py
          tools/gate/test_publish_shape_completeness.py
          tools/gate/test_check_runner_pin_rules.py
          tools/gate/test_check_cited_evidence.py
          tools/gate/test_check_tracking_banners.py
          tests/scripts/test_run_gtest_healed_ledger.py
          tools/gate/test_check_crl_chain_fixture.py
          tools/gate/test_check_test_key_markers.py
          tools/gate/test_secrets_baseline_arithmetic.py
          tools/gate/test_check_governance_liveness.py
          tools/gate/test_runner_watchdog_heartbeat.py
          tools/gate/test_desktop_outage_reclassification.py
          tools/gate/test_desktop_outage_hook_end_to_end.py
          tools/gate/test_capture_observability.py
          tools/gate/test_gen_sbom_reproducibility.py
          tests/ui_automation/matrix/test_runtime_pass_semantics.py
          tests/ui_automation/test_aggregation_precedence.py
          tests/scripts/test_check_matrix_health.py
          # tests/scripts/test_run_gtest_shard_merge.py MOVED to its own step
          # below -- see the reasoning there. It is still on this lane.
          tests/scripts/test_matrix_shard_merge.py
          # Phase-3 observability work (#276, #278, #206). All three are pure
          # Python over synthetic inputs -- no app, no C++ toolchain, no live
          # session -- so they belong on the push lane. Listing them here is the
          # point: #258 records three of #187's seven gate scripts that run on
          # neither push nor locally because only their COMPANION TEST was ever
          # wired, and phase-1 of this pipeline repeated it with a guard that
          # existed in no merge-blocking lane at all.
          tools/gate/test_check_suite_totals.py
          tools/gate/test_emit_gate_verdict_history.py
          tests/scripts/test_run_ui_suite_shard_merge.py
          # Needs no app and no live session (synthetic images, tmp baseline
          # dir), so it belongs here as well as in the UI sweep that collects
          # tests/visual/test_*.py. Two surfaces on purpose: the sweep is hours
          # away, and this is the control that stops the canvas page-crop
          # silently blinding the visual oracle.
          tests/visual/test_canvas_crop_semantics.py
          # Its sibling, and it has to be on THIS lane for the same reason.
          # A pure AST parse -- no app, no session -- asserting every
          # _capture_canvas oracle passes crop=. Added here after claim-check
          # pointed out that writing the guard is not the same as wiring it:
          # it was present only in windows-validation.yml, which is
          # workflow_dispatch-only, so an eleventh uncropped capture site --
          # precisely the defect class the guard exists to close, and precisely
          # the mistake that already happened once at 5-of-10 -- would have
          # passed every automatically-triggered check and merged clean.
          tests/visual/test_canvas_crop_coverage.py

      # SPLIT OUT OF THE BATCH ABOVE, and the reason is a measurement rather
      # than tidiness.
      #
      # That batch is one `pytest` invocation over 54 files, and
      # run_fast_checks_locally.py caps any single command at 900 s --
      # DEFAULT_TIMEOUT_S, whose own comment calls the cap "also a smoke
      # alarm", on the grounds that a CI-mirrored guard running a quarter of an
      # hour locally is broken. The batch measured 891 s during p96 phase-5: a
      # 1% margin. By phase-6 it crossed the line and reported TIMEOUT on two
      # consecutive runs, which reads as a failing guard rather than as a
      # budget problem.
      #
      # test_run_gtest_shard_merge.py is the dominant member at ~353 s
      # (measured 317.97 s and 353.43 s on this box) -- over a third of the
      # whole budget on its own, because it spawns real runner processes per
      # case. Giving it its own invocation takes the batch to roughly 550 s and
      # gives this suite its own 900 s, so neither is near the alarm.
      #
      # NOTHING LEAVES THE PUSH LANE. This is deliberately not the easier fix
      # of demoting it to the slow tier: that is exactly #258's defect -- a
      # guard wired where nothing automatic runs it -- and this pipeline has
      # spent two phases undoing instances of it. The split preserves coverage
      # and only changes which command owns the clock.
      #
      # Note the job-level budget is a SEPARATE question: fast-checks has
      # `timeout-minutes: 15`, i.e. 900 s for every step combined, on a
      # ubuntu-latest runner rather than this 4-processor Windows box. The two
      # caps happen to share a number and are not the same constraint.
      - name: Gate self-tests — the shard-merge equivalence suite (own clock)
        if: ${{ !cancelled() }}
        run: python -m pytest -q tests/scripts/test_run_gtest_shard_merge.py

  # ---------------------------------------------------------------------------
  # A SECOND, WINDOWS job. Deliberately separate rather than a step in
  # fast-checks: Install-PdfeRunner.ps1 provisions a Windows runner and calls
  # WindowsIdentity::GetCurrent(), which throws "not supported on this platform"
  # on ubuntu BEFORE the requirement loop is reached. Wiring this harness into
  # the ubuntu job did exactly that, and every mutation still exited non-zero --
  # so it reported 6/6 mutations killed on a platform where not one line of the
  # code under test ran. Six fake kills; only the control case noticed.
  #
  # windows-latest is GitHub-hosted, so this still runs on EVERY push, unlike
  # the self-hosted Windows lanes which are all workflow_dispatch-only. It costs
  # about a minute and needs no build.
  installer-dry-run:
    name: runner installer resolves every requirement (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pytest
        if: ${{ !cancelled() }}
        # This job had never needed it: Test-InstallerDryRun.py is plain stdlib
        # and runs as a script. The two pytest steps below were added without
        # it, so both failed with "No module named pytest" -- green locally,
        # red here, which is the whole reason NO GATE EXECUTES CI is worth
        # remembering.
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Dry run + mutations
        if: ${{ !cancelled() }}
        shell: bash
        # There is no way to test a runner-provisioning script end to end
        # without provisioning a machine. Its -WhatIf path is the substitute,
        # and it used to be a poor one: ShouldProcess was evaluated BEFORE the
        # per-kind switch, so every branch was skipped. It proved the loop
        # iterated. One of eleven requirements was ever executed by any test,
        # and a missing url, an unknown kind or a malformed portable_fallback
        # were indistinguishable from correct entries.
        #
        # The branches now run and resolve their arguments with only the
        # effectful calls gated, so a dry run reaches all 11 and fails on a
        # malformed one. Six mutations of runner-requirements.json must each
        # redden it -- AND must produce the specific message that mutation was
        # meant to provoke, because "exited non-zero" is satisfied just as well
        # by an unrelated crash. A guard no mutation can redden is decoration;
        # one that cannot say WHY it reddened is barely better.
        run: |
          python tools/runner-deployment/Test-InstallerDryRun.py

      - name: Page-load guard AST scanner — self-test (GitHub #176)
        if: ${{ !cancelled() }}
        shell: bash
        # WHY HERE AND NOT ONLY IN windows-validation.yml.
        #
        # The full src/ scan lives in windows-validation.yml next to the
        # fz_try/RAII scan it shares infrastructure with, because it needs the
        # asan preset's compile_commands.json. That is correct for the SCAN.
        #
        # But windows-validation.yml is workflow_dispatch-ONLY (see its own
        # header: every self-hosted lane lost its triggers on 2026-08-13). A
        # guard whose only registration is in a lane nobody dispatches is the
        # dead-guard pattern this project has already recorded twice -- four
        # linters registered but never selected, because CI's only ctest call
        # was `-L security`.
        #
        # The scanner's SELF-TEST has no such dependency: every fixture
        # forward-declares its own fz_context/fz_document/fz_page stand-ins, so
        # it needs libclang and nothing else -- no compile database, no MuPDF
        # headers, no build tree. So the mechanism (declaration-vs-call, macro
        # expansion, function-pointer aliasing, unparseable-file handling) is
        # guarded on EVERY PUSH here, and the real-tree count stays in the
        # dispatch-only lane where its inputs live.
        #
        # This job is windows-latest and GitHub-hosted, which is what makes
        # "every push" true.
        run: |
          python -m pip install --disable-pip-version-check -q libclang
          python tools/gate/test_page_load_guard_scan.py

      - name: Watchdog desktop-pause regression tests
        if: ${{ !cancelled() }}
        shell: bash
        # Deliberately in THIS job and not the ubuntu one. The tests launch
        # runner_watchdog.ps1, so they carry a skipif for non-Windows -- listed
        # among the ubuntu gate self-tests they would report as skipped, and a
        # skip that nobody reads is indistinguishable from a pass.
        #
        # They cover the branch that decides whether to STOP A RUNNING
        # LISTENER, which shipped with no automated coverage at all: the
        # "16/16 watchdog tests" cited alongside it are the heartbeat
        # self-test, which never calls Test-InteractiveDesktop or
        # Test-JobInFlight. Three mutations were required to redden them
        # (dropped `continue` in the pause branch, pause branch disabled,
        # fail-safe catch inverted); the first one SURVIVED the initial
        # version, because at MaxIterations=1 the loop broke before reaching
        # the mutated line -- the test passed while exercising nothing.
        run: |
          python -m pytest -q tools/gate/test_runner_watchdog_desktop_pause.py

      - name: Wizard scripts parse and run their -WhatIf path
        if: ${{ !cancelled() }}
        shell: bash
        # Deploy-, Register- and Start-PdfeRunner.ps1 are what the README tells
        # an operator to run, and until now NOTHING executed them -- not a test,
        # not a job. Two defect classes had already shipped through that hole:
        # 8 Join-Path calls on drive-qualified param defaults (CI red, twice,
        # unnoticed), and a BOM-less sibling that would not parse under PS 5.1
        # at all. Parsing happens from a FILE under powershell.exe specifically,
        # because that is the host with the ANSI-codepage behaviour and the one
        # a fresh Windows box actually has.
        run: |
          python -m pytest -q tools/gate/test_runner_wizard_scripts.py

      - name: Every tracked .ps1 survives the PS 5.1 codepage guess (GitHub #130)
        if: ${{ !cancelled() }}
        shell: bash
        # The step above parses the THREE wizard scripts. This one covers the
        # CLASS, across every tracked .ps1 -- which is what #130 is actually
        # about, since the wizard fix (90ae891a) left nothing preventing the
        # next occurrence.
        #
        # The rule: a .ps1 fails if it contains a non-ASCII byte AND has no
        # UTF-8 BOM. Windows PowerShell 5.1 assumes the machine's ANSI codepage
        # for a BOM-less file; PowerShell 7 defaults to UTF-8. So a file with
        # typographic punctuation parses perfectly wherever these scripts get
        # exercised (PS7) and misbehaves on Server 2019, where `powershell.exe`
        # IS 5.1 and is what an operator types.
        #
        # MEASURED 2026-09-06, and worth stating precisely because it is not
        # what the issue assumed: of the 8 tracked files that violated the rule,
        # ZERO actually failed to PARSE under a real 5.1. What did happen is
        # that their non-ASCII characters decoded WRONG -- verified against
        # 5.1.17763.7553 on codepage Windows-1252, where the round-trip of the
        # non-ASCII characters was False without the BOM and True with it.
        # So this guard prevents silent VALUE corruption, and prevents a parse
        # failure only latently: whether a mis-decode breaks the parse depends
        # on which bytes land where, which is luck. The BOM removes the luck.
        #
        # --self-test first, so the guard is not decoration: it covers the em
        # dash that caused the original failure, curly quotes, an arrow, a
        # latin-1 high byte, and the three cases that must stay GREEN (pure
        # ASCII, non-ASCII WITH a BOM, empty). A guard that reddens on correct
        # code is worse than none.
        run: |
          python tools/gate/check_ps1_encoding.py --self-test
          python tools/gate/check_ps1_encoding.py

      - name: Trust-source claims — no comment may name a store PDFE does not read
        if: ${{ !cancelled() }}
        # GitHub #212 recorded that PDFE does NOT consult the Windows
        # certificate store. #233 is the SECOND time the phrase had to be
        # chased out of the tree, and it asked for this guard by name.
        #
        # The chase kept failing the same way. The flag was renamed
        # useSystemStore -> useOpenSslDefaultPaths but the prose was not,
        # because a rename tool follows identifiers. A hand audit for the
        # literal "system store" then walked past "system TRUST store" -- a
        # string this product actually shipped, and the dangerous direction:
        # it told the user the OS had vouched for a certificate the OS was
        # never asked about.
        #
        # The rule is NOT "ban the phrase". Correct uses must survive, above
        # all tests/test_cert_store_trust_policy.cpp, which opens the ROOT
        # store with CertOpenSystemStoreW precisely to prove the product
        # ignores what it finds. Driving the phrase to zero would delete the
        # evidence that the decision holds. So a mention passes if its own
        # comment block also names the real mechanism, states the negative, or
        # cites #212 -- and the file-level exemption is EARNED by actually
        # calling the Win32 API, not granted by filename.
        #
        # --self-test first, and it asserts BOTH directions plus the earned
        # exemption: the identical prose must pass in a file that opens the
        # store and fail in one that does not.
        run: |
          python tools/gate/check_trust_source_claims.py --self-test
          python tools/gate/check_trust_source_claims.py --repo-root .

      - name: Engine wiring — no class the tests exercise may be unreachable from src/
        if: ${{ !cancelled() }}
        # Standing control for test-gap class C-BELOW ("every test enters below
        # the defect") — docs/audit/test-gap-classes.md §3. Seven DCA records,
        # weight 54, FIVE of which reached users, and until this step there was
        # no checker in tools/gate/ addressing it at all.
        #
        # The blindness: the seam the tests use sits beneath the layer holding
        # the bug, so a feature that is correct and UNREACHABLE looks identical
        # to one that works. DCA 0058 — seven unit tests proved a refusal that
        # was linked into nothing. DCA 0056 — every oracle called followLinkAt
        # directly while the click route was dead for every user.
        #
        # The sweep that produced this found EIGHTEEN such classes (GitHub
        # #253), including the whole export subsystem bar PlainTextExporter,
        # the font-substitution ENGINE class, RedactionVerifier, and a LinkTool
        # that is the only one of eleven annotation tools with no production
        # caller.
        #
        # It first answered TEN, and was wrong twice in the same direction:
        # it read a class name inside a // comment as a call site, and counted
        # a reference from a file that is itself unreachable. Reachability is
        # therefore a TRANSITIVE CLOSURE from src/main.cpp over CODE
        # references, comments and literals stripped first by the lexer in
        # check_win87_publish_shapes.py (reused, not copied — a rule
        # implemented twice with one copy fixed is DCA 0052).
        #
        # engine_wiring_baseline.json is a RATCHET: a NEW unreachable class
        # fails, and a baselined class that becomes REACHABLE must be removed
        # or this also fails. A list that only grows would be the DCA 0023
        # shape — a control reporting "class closed" about its own list.
        #
        # --self-test first, and it asserts FOUR directions: it must flag a
        # class nothing names, must NOT flag one main() reaches, must STILL
        # flag one named only inside a comment, and must STILL flag a closed
        # island of dead code referencing dead code. The last two are the
        # failures above, promoted from "a reviewer noticed" to "a test
        # enforces".
        run: |
          python tools/gate/check_engine_wiring.py --self-test
          python tools/gate/check_engine_wiring.py --repo-root .

      - name: Native event filters — the install CALL in code, not in a comment
        if: ${{ !cancelled() }}
        # p95 phase-11, claim-check FINDING 1. check_engine_wiring above walks
        # reachability over CLASS NAMES, so deleting only
        # `app.installNativeEventFilter(&powerEventFilter);` and leaving the
        # `static ... powerEventFilter;` declaration in place satisfies it --
        # while power events silently stop reaching users and the docs keep
        # saying "installed at src/main.cpp:208-209". The 17 power-event tests
        # cannot catch it either: they construct the filter directly and never
        # use the application's install path.
        #
        # It reads CODE, not raw text: the input goes through
        # strip_comments_and_literals, because v1 of this guard regexed the file
        # and a commented-out call satisfied it. That matters here more than
        # most places -- the step ABOVE records that when WIN-87 was actually
        # closed, a plain grep returned five hits and every one was a COMMENT
        # describing the defect just removed.
        #
        # --self-test asserts ELEVEN directions, in three families: the call
        # DELETED (the case the name walk misses, plus both-lines-deleted); the
        # call DISABLED without deletion (// comment, /* */ comment, and
        # deleted-but-named-in-a-why-not-comment -- all three passed an earlier
        # version that regexed raw text); and the completeness reverse direction
        # for a filter class with no table row, in each of four declaration
        # shapes (static, non-static, heap, inline `new`) because keying it on
        # the `static` keyword let the last three through.
        #
        # One direction asserts GREEN: a call inside `#if 0`. Pinned as a known
        # residual rather than left to pass quietly, so that if it ever reddens
        # the self-test fails and the limit gets revisited deliberately.
        #
        # So: pinned against deletion and comment-disabling; NOT against
        # exclusion needing preprocessing or control-flow analysis.
        run: |
          python tools/gate/check_native_event_filter_installed.py --self-test
          python tools/gate/check_native_event_filter_installed.py --repo-root .

      - name: MuPDF bump recheck — a version move must force the fuzz harness to be re-run
        if: ${{ !cancelled() }}
        # GitHub #139 step 2. `tests/docs/known_issues.md`'s
        # PDFE-SEC-MUPDF-RECURSION-DOS entry states its own resolution path as
        # "on a MuPDF bump, re-run `fuzz_document_open` to confirm" — and until
        # this step existed, nothing read that sentence. No checklist item, no
        # workflow step, no pin. A bump could silently fix the recursion DoS,
        # silently fail to, or silently change its shape, and nobody would learn
        # which.
        #
        # THE SUBTLETY, and the reason this is not a one-line grep for a version:
        # `vcpkg.json` declares a FLOOR (`"version>=": "1.26.10#1"`), not a
        # version. The triplet here actually has 1.26.10#4 installed. Those two
        # numbers move independently, through two different doors:
        #
        #   DOOR 1 — someone raises `version>=`.      Visible in the stanza.
        #   DOOR 2 — someone bumps `builtin-baseline`. The libmupdf stanza does
        #            not change by one character, yet the resolved version can
        #            move by several port revisions or a whole release.
        #
        # Door 2 is the LIKELY one: baseline bumps are routine hygiene and touch
        # one SHA. A guard keyed only on the stanza would have reported OK across
        # exactly the change most likely to happen. So both are pinned.
        #
        # This over-triggers by construction: a baseline bump that leaves
        # libmupdf untouched still reddens. Deliberate — resolving the baseline
        # to a concrete version needs a configured vcpkg and a network, neither
        # of which a fast check has. The remedy message says so, so the cost is
        # visible and the record gets updated deliberately rather than reflexively.
        #
        # --self-test asserts SEVENTEEN directions. Three are GREEN (the live
        # tree, an unrelated dependency added, an unrelated field reworded)
        # because a guard that only ever reddens is as useless as one that never
        # does — and the specificity directions are what stop this from being
        # "hash vcpkg.json", which would redden on every dependency change.
        # The rest are RED, in three families: the two bump doors (and both at
        # once); the record being untrustworthy (key missing, key blank, not
        # JSON, empty object); and the MANIFEST'S SHAPE changing under the guard
        # (stanza removed, demoted to a bare string, `version>=` dropped,
        # baseline removed, not JSON). That last family is the one that matters
        # most: an extractor returning None on an unrecognised shape would
        # compare None == None and PASS, which is how a pin like this dies
        # quietly. A missing record file fails closed too — verified separately,
        # since the self-test supplies record text directly and cannot reach it.
        #
        # NOT covered, and not pretended to be: #139's step 1, reporting the
        # reproducer to Artifex/MuPDF upstream. That is a human action outside
        # any repository and stays open in the issue.
        run: |
          python tools/gate/check_mupdf_bump_recheck.py --self-test
          python tools/gate/check_mupdf_bump_recheck.py --repo-root .

      - name: Page-pointer rebind — a class caching a Page* must say what happens when it dangles
        if: ${{ !cancelled() }}
        # Standing control for test-gap class C-ENUM, "completeness asserted
        # from a hand-made enumeration" — docs/audit/test-gap-classes.md §1.
        # 14 records, weight 75, the corpus's highest, and its five existing
        # controls are each an enumeration over ONE shape, which is the class's
        # own failure mode one level up.
        #
        # THE CONTRACT. Command::rebindPage (src/core/Command.h) is virtual
        # with an EMPTY default body, and SaveWithRebind.h calls it on every
        # command after a full-rewrite save. A command that caches a Page* and
        # does not override it keeps a pointer to a Page the save replaced —
        # the GitHub #234/#235/#236 shape. Eighteen classes honour that today,
        # all by discipline; nothing enforced it before this step.
        #
        # WHY IT IS A NEW GUARD AND NOT A WIDER check_tool_cached_page.py.
        # That guard's population is "classes deriving from AnnotationTool",
        # which is right for ITS defect and structurally cannot see this one:
        # the classes at risk here are Commands in five other families. The
        # remedy C-ENUM needs is not another shape in a list — it is a
        # population DERIVED from the property. This walks the tree for every
        # class declaring a raw Page* member, so a new command family is in
        # scope automatically.
        #
        # An override that EXISTS but has an empty body is treated as a
        # failure, not compliance: it reproduces the base class's silent no-op
        # exactly. That case was found by this guard's own mutation run.
        run: |
          python tools/gate/check_page_pointer_rebind.py --self-test
          python tools/gate/check_page_pointer_rebind.py --repo-root .

      - name: A tool must act on the page it was told about (GitHub #269)
        if: ${{ !cancelled() }}
        # THE THIRD control over a cached Page*, and a new PROPERTY rather than
        # a widening of either existing one.
        #
        #   check_tool_cached_page.py     -- LIFETIME: release it when the
        #                                    document closes. #269's pointer is
        #                                    alive throughout.
        #   check_page_pointer_rebind.py  -- IDENTITY ACROSS A SAVE: a
        #                                    full-rewrite save replaces the
        #                                    Page. #269's mismatch exists from
        #                                    the first click.
        #   this one                      -- IDENTITY AGAINST THE EVENT: the
        #                                    page a handler acts on must be the
        #                                    page it was told about.
        #
        # GitHub #269, measured 2026-09-30: StickyNoteTool creates on its cached
        # page_ and reports the clicked pageIndex, so a click past the bound
        # page places the note on the wrong page AND makes MainWindow resolve
        # the reported index against the other page -- "Annotation index out of
        # range", thrown across a Qt event handler, process dead. That is the
        # same throw and the same fatality as #234/#235/#236, through a fourth
        # door.
        #
        # FIXED, at the dispatch site, in the same change that added this
        # step: PdfCanvas::bindToolToPage() binds the tool to the page the event
        # names before dispatching, so the twelve handlers in ten tools that
        # write through a cached page_ while reporting pageIndex are correct
        # WITHOUT any of them changing.
        #
        # So this guard asserts the property where it is enforced, and there is
        # no baseline. An earlier version of it carried a twelve-entry ratchet
        # listing those handlers as defects to reconcile individually; with the
        # reconciliation at the dispatch site such a list would assert a defect
        # that is fixed, which is the "a list describes its own history rather
        # than the tree" shape this project keeps paying for. The three things
        # checked are: every gesture-starting dispatch binds first,
        # bindToolToPage actually calls setPage, and the owned page is released
        # AFTER the tool is told (the GitHub #235 ordering).
        run: |
          python tools/gate/check_tool_acts_on_the_clicked_page.py --self-test
          python tools/gate/check_tool_acts_on_the_clicked_page.py --repo-root .

      - name: Package account-name scanner — self-test only (GitHub #199 / #191)
        if: ${{ !cancelled() }}
        shell: bash
        # SELF-TEST ONLY, and that is the honest scope here: the real scan needs
        # an extracted installer payload, and NO job in this workflow produces
        # one. Note that specifically, because this job is called
        # `installer-dry-run` and that name invites the opposite conclusion --
        # it is a Windows-hosted static-guard job, and the "dry run" is
        # tools/gate's own dry-run/mutation checks, not a packaging step. There
        # is no installer here to scan.
        #
        # The real payload scan runs in windows-validation.yml after the cpack
        # step. What fast-checks can assert is that the scanner's own matcher
        # still works, which is where it would silently rot:
        #
        #   * UTF-16LE. MSVC's assert() expands to _wassert(L"" __FILE__, ...),
        #     so a large share of real hits are WIDE strings. An ASCII-only
        #     pass under-reported one binary by a third.
        #   * Forward slashes, which CMake-injected -D definitions emit.
        #   * That redact() does not leave the account name in its own output --
        #     a leak scanner that prints what it finds becomes the next
        #     producer, and this one is run in CI where the log is retained.
        #
        # All matching is done in Python on purpose: `grep -iF` aborts in this
        # environment (exit 134) and `grep -P` is dead in the hooks' locale, and
        # inside an `if` an abort reads as "no match" -- a silent false negative
        # in exactly the kind of check that must never have one.
        #
        # The scrub's self-test is here for the same reason and with one extra
        # case worth naming: it asserts the UTF-16LE path is rewritten. MSVC's
        # assert() puts __FILE__ in a WIDE string, so an ASCII-only scrub would
        # report success having changed nothing -- the precise false-green this
        # whole issue is about. It also asserts the shared matcher finds nothing
        # after a scrub, so "scrubbed" is judged by the same code that decides
        # "is this a leak", and that a non-PE blob is not mistaken for a signed
        # one (the signature check is what stops it patching a signed image).
        run: |
          python tools/gate/check_package_account_name.py --self-test
          python tools/gate/scrub_package_account_name.py --self-test

      - name: Pipeline issue-update audit — self-test only
        if: ${{ !cancelled() }}
        # SELF-TEST ONLY, deliberately. The full audit queries GitHub for every
        # issue a pipeline touched, which needs an authenticated `gh` and a
        # pipeline that has finished -- neither is a property of a push. What
        # CAN run on every push is the judgement logic, and that is the part
        # with something to get wrong.
        #
        # It exists because a completed, fully-gated pipeline still left four
        # issues in an inconsistent state: a CLOSED issue whose fix was known
        # not to take effect and carried no cross-reference, an OPEN issue a
        # phase had touched and told nothing, an OPEN issue whose latest
        # comment opened with "Fixed", and two new issues with no labels. No
        # gate can catch those -- karen and validator verify the WORK, and the
        # work was done. This checks the paper trail.
        #
        # The self-test proves each check both FIRES and stays QUIET, including
        # the markdown-bold opener (`**Done.**`) that a naive first-word match
        # would miss.
        run: python tools/gate/audit_pipeline_issue_updates.py --self-test
