        # pub-readiness had to DELETE 283 leaking logs from the previous
        # repository, so this is a measured surface. Scans a bounded window
        # (the 25 most recent runs) rather than the unbounded full history:
        # pushes are frequent relative to runs, so every log sits inside the
        # window across many consecutive pushes. Unreadable/expired logs are
        # counted and named, and an all-unreadable window FAILS rather than
        # passing clean. The run executing this step is itself in the window
        # and always unreadable (its log does not exist yet) -- expected, and
        # why the all-unreadable refusal uses the whole window, not one run.
        # Self-tests: check_tracker_hygiene.py --self-test,
        #             tools/gate/test_check_tracker_hygiene.py
        run: python tools/gate/check_tracker_hygiene.py --logs 25

      # NOTE the quoted name: an unquoted '#' starts a YAML comment, so every
      # other step in this file loses its issue number in the CI UI -- they all
      # render as "... (GitHub". Not fixed wholesale here; this one is right.
      - name: "account name inside BINARY files added by this push (GitHub #256)"
        if: ${{ !cancelled() }}
        # The step above is by construction blind to binaries: its TEXT_EXT set
        # stops at the extension, so .pdf, .exe, .pdb and .exp are skipped
        # before a byte is read. So "the account-name detector says clean" has
        # never been a statement about any binary in this repository -- and two
        # recorded incidents were exactly that, a .pdb path embedded by the
        # linker and gtest XML captured under docs/.
        #
        # scan_binary_path_hygiene.py is the only scanner that reads a non-text
        # file, and until now nothing executed it: all four references to it in
        # the repo were prose. It depended on a human remembering.
        #
        # SCOPED TO THE DIFF, DELIBERATELY. The script's own header rejects a
        # whole-tree sweep on every push -- "decoding 300 MB of PDFs on every
        # push would be absurd" -- and that reasoning is sound. The moment that
        # matters is when a binary is ABOUT TO BE TRACKED, which is exactly the
        # set below. A push adding no binaries scans nothing and costs nothing.
        #
        # The exit code is checked: `set -e` is on and the python call is the
        # last command, so a hit fails the step rather than printing into a
        # green log.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -Eq '^0+$'; then
            echo "no reviewable base ref ($BASE); scanning nothing."
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base $BASE not present in history; scanning nothing."
            exit 0
          fi
          # Added or modified files only; deletions cannot leak.
          git diff --name-only --diff-filter=AM "$BASE" "$HEAD" > changed.txt
          # Everything check_tracked_path_hygiene.py does NOT read. Kept as an
          # exclusion rather than a list of binary extensions: a new binary
          # format nobody thought of is then scanned by default, which is the
          # safe direction. The authoritative text set lives in that script and
          # is imported by this one, so the two cannot disagree.
          python - <<'PY' > binaries.txt
          import io, os, sys, importlib.util
          # Explicit LF. This job runs on ubuntu-latest, where it already is --
          # but the identical block under a Windows Python emits CRLF, xargs
          # then hands the scanner a path with a trailing carriage return, and
          # every file reports "Invalid argument". Measured while verifying this
          # step locally, where it made a working guard look inert.
          sys.stdout.reconfigure(newline="\n")
          # A second, NUL-delimited copy. The human-readable list is what gets
          # echoed into the log; this one is what the scanner is actually given,
          # because NUL is the only byte a filename cannot contain.
          nul = io.open("binaries.nul", "wb")
          spec = importlib.util.spec_from_file_location(
              "_ctph", os.path.join("tools", "gate", "check_tracked_path_hygiene.py"))
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          text_ext = {e.lower() for e in m.TEXT_EXT}
          for line in io.open("changed.txt", encoding="utf-8"):
              p = line.strip()
              if not p or not os.path.exists(p):
                  continue
              if os.path.splitext(p)[1].lower() in text_ext:
                  continue
              sys.stdout.write(p + "\n")
              nul.write((p + "\0").encode("utf-8"))
          nul.close()
          PY
          if [ ! -s binaries.txt ]; then
            echo "this push adds or modifies no non-text file; nothing to scan."
            exit 0
          fi
          echo "scanning $(wc -l < binaries.txt) non-text file(s):"
          cat binaries.txt
          # Read the NUL-delimited copy into an array. The first cut passed the
          # list as unquoted `$(cat binaries.txt)` (shellcheck SC2046), so a
          # changed filename containing a space or a glob character would
          # word-split or pathname-expand before reaching argparse. The phase-4
          # security-audit gate traced that through: the resulting nonexistent
          # path raises OSError, the scanner returns 2, and `set -euo pipefail`
          # fails the step -- so it failed CLOSED, breaking loudly rather than
          # silently skipping a file that should have been scanned. Not a
          # bypass, but not something to leave in a leak detector either.
          BINARIES=()
          while IFS= read -r -d '' p; do BINARIES+=("$p"); done < binaries.nul
          # Invoked on ONE line beginning with `python`, deliberately. The
          # local mirror (run_fast_checks_locally) reproduces this workflow by
          # parsing invocation SHAPES, and an xargs-driven form is invisible to
          # it: its self-test caught exactly that here and reported this script
          # as "referenced by the workflow but not discovered", which is the
          # silent under-coverage that tool exists to prevent.
          #
          # NOTE for anyone editing this comment: that same self-test treats any
          # literal gate-script path in the workflow TEXT as a reference, so
          # naming one here -- even in prose -- invents a phantom invocation and
          # reddens it. Mention scripts by bare name, not by path.
          #
          # The $GITHUB_WORKSPACE reference is not decoration: it pins the list
          # to the workspace root, and it is what tells the local mirror this
          # command needs run context, so it is reported as not-runnable-locally
          # rather than run without a diff.
          python tools/gate/scan_binary_path_hygiene.py "${BINARIES[@]}"  # list built under $GITHUB_WORKSPACE

      - name: accessibleName is spoken text, not the objectName (GitHub #185)
        if: ${{ !cancelled() }}
