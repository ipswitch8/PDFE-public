        # screen reader -- "ComplianceDialog" where a sighted user read "PDF
        # Standards Compliance", "batchProgressBar" for a progress bar. The
        # accessible name OVERRIDES the window title in the announcement, so a
        # good title was being suppressed by a bad accessible name one line
        # later.
        #
        # It was not carelessness: the project's automation guidance asks for
        # stable identifiers on widgets, and these sites satisfied it with the
        # wrong property -- several under a source comment asserting Qt's UIA
        # bridge reads AutomationId from accessibleName. It does not, and the
        # live-UI suite has always proved otherwise by locating widgets whose
        # two properties differ. A misdiagnosis that plausible will recur, and
        # the shape is mechanically detectable, so it is checked.
        #
        # Self-tests (10 cases, including four that must NOT fire):
        #   python tools/gate/check_accessible_name_not_identifier.py --self-test
        run: python tools/gate/check_accessible_name_not_identifier.py --repo-root .

