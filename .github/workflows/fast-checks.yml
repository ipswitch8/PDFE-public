# ---------------------------------------------------------------------------
# Fast Checks (per-commit / per-PR gate)   — remediation Phase 5
#
# The problem this closes (R-25): as of 2026-07-20 EVERY PDFE workflow is
# schedule/dispatch-only, so NOTHING blocks a bad commit at merge time. The full
# C++ validation is deliberately kept off per-commit to spare the single
# self-hosted runner — so this lane is a FAST, pure-Python gate that runs on a
# GitHub-hosted ubuntu runner (no self-hosted contention, no C++ toolchain) on
# every push and PR to master. It fails the build when a standing gate is
# violated:
#
#   * R-30 / GAP-A15  — a deliberately-RED JUnit sentinel MUST be rejected by
#                       tools/gate/check_junit_xml.py (the false-green defense
#                       is load-bearing, not decorative).
#   * R-24            — the mutation manifest dry-run: all 16 real mutant
#                       find-strings still present exactly once (a stale mutant
#                       catalog fails).
#   * R-26 / R-31     — DCA loop: every DCA record conforms AND a defect-fix
#                       range that adds no DCA record fails (auto base ref — no
#                       honor-system / manual dispatch).
#   * R-37            — flaky-quarantine registry parses and holds no expired
#                       entry (a quarantine cannot live forever).
#   * R-28            — matrix runtime pass-semantics + health unit tests (a
#                       committed-green cell cannot be rebuilt from a SKIP/no-run).
#   * gate self-tests — tools/gate/test_*.py all green.
#
# The heavy build-based gates remain their own workflows (windows-validation,
# mutation-kill, sanitizer, fuzz) on schedule/dispatch.
# ---------------------------------------------------------------------------

name: Fast Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # DCA-presence needs the full range base..head

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # pikepdf is needed by the GitHub #210 form-fixture generators and their
      # verifier. It is a real dependency of those two steps, not an optional
      # extra: without it they raise ModuleNotFoundError, and the tempting fix
      # -- skipping when the import fails -- would turn a reproducibility guard
      # into one that passes hardest exactly when it cannot check anything.
      # pymupdf + fonttools were added for tests/test_ocr_fixture_integrity.py,
      # which reads the committed OCR fixtures' embedded fonts. Same reasoning
      # as the paragraph above: that suite must FAIL when it cannot inspect a
      # font, never skip, so the dependency belongs here rather than behind an
      # importorskip that would go quiet precisely when it stopped checking.
      - name: Install check deps
        run: python -m pip install --quiet pytest pyyaml pikepdf numpy pymupdf fonttools

      - name: Validate all workflow YAML parses
        if: ${{ !cancelled() }}
        run: |
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{f}: {exc}")
          if bad:
              print("YAML parse failures:\n" + "\n".join(bad)); sys.exit(1)
          print("all workflow YAML parses")
        shell: python

      - name: Workflow expressions — a context must be available where it is used
        if: ${{ !cancelled() }}
        # df57fb7c put `matrix.shard` in `jobs.ui-e2e.if`, where the `matrix`
        # context does not exist. That did not fail a job -- it made
        # windows-validation.yml an INVALID WORKFLOW FILE: undispatchable, with
        # a failed run named after the file path on every push (38182505254).
        # PyYAML parsed it, the braces balanced, and the 104-check local
        # aggregate passed, so nothing local objected. actionlint would cover
        # this but is not installed on the runner, so the rules are implemented
        # directly. The self-test includes the real historical file as a
        # discrimination control.
        #
        # IT LIVES IN THIS JOB, DELIBERATELY. It first landed in
        # `installer-dry-run`, which installs only pytest, so both invocations
        # died on `PyYAML is required` (run 38198830707) -- a dependency
        # failure wearing the costume of a real finding. It belongs immediately
        # after the YAML-parse step above: same subject matter, and the only
        # job whose `Install check deps` provides pyyaml. Moving it elsewhere
        # reintroduces that failure.
        run: |
          python tools/gate/check_workflow_expressions.py --self-test
          python tools/gate/check_workflow_expressions.py --repo-root .

      - name: GAP-A15 — RED JUnit sentinel MUST be rejected (R-30)
        if: ${{ !cancelled() }}
        run: |
          set +e
          python tools/gate/check_junit_xml.py tools/gate/fixtures/sentinel_red.xml
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::GAP-A15 REGRESSION: check_junit_xml.py PASSED a red sentinel report."
            exit 1
          fi
          echo "OK: red sentinel correctly rejected (exit $rc)."
          python tools/gate/check_junit_xml.py tools/gate/fixtures/sentinel_green.xml
          echo "OK: green sentinel correctly accepted."

      - name: WIN-87 — the publish class stays closed, and the sweep can go red
        if: ${{ !cancelled() }}
        run: |
          # ORDER MATTERS. The self-test runs FIRST: a sweep nobody has proved
          # can fail is decoration, and its PASS would mean nothing. The
          # phase-5 karen gate failed this phase for documenting a self-test
          # that had only ever been run by hand, so it is wired here.
          python tools/gate/check_win87_publish_shapes.py --self-test
          python tools/gate/check_win87_publish_shapes.py --root src

      - name: Coverage-floor gate can still go red (GitHub #258)
        if: ${{ !cancelled() }}
        run: |
          # The REAL invocation is windows-validation.yml:1673, which needs the
          # Cobertura XML from OpenCppCoverage. That made this the one of #258's
          # three scripts with no push-lane presence except a companion test that
          # calls check() directly — proving the predicate, not the process.
          #
          # The self-test synthesises the report shapes and drives all three exit
          # codes (0 / 1 / 2) through main(), so the gate's failure paths are
          # exercised on every push without a build or a coverage run. It asserts
          # nothing about whether coverage is actually adequate.
          python tools/gate/check_coverage_floor.py --self-test

      - name: WIN-87 — and the shape LIST itself is complete (GitHub #254)
        if: ${{ !cancelled() }}
        run: |
          # The sweep above can only find shapes somebody typed into SHAPES, so
          # its PASS means "the listed spellings are absent", not "no publish
          # call is unguarded". That is the C-ENUM gap #254 tracks.
          #
          # This measures the list against a reference surface of file-publishing
          # APIs and fails when the tree uses one no shape covers. It found a
          # real site on its first run: LogHandler rotated the log with
          # QFile::remove + QFile::rename, a spelling the sweep did not know.
          python tools/gate/check_publish_shape_completeness.py --root src

      - name: No substantial test helper is defined twice (GitHub #275)
        if: ${{ !cancelled() }}
        run: |
          # ORDER MATTERS, same as the WIN-87 sweep above: the self-test runs
          # FIRST, because a guard nobody has proved can fail is decoration.
          #
          # DirectoryAttacker — a ~155-line Win32 attacker backing 20 TOCTTOU
          # tests — was defined twice, and the gtest guard for exactly that
          # (OracleStandard.SharedHarnessHelpersHaveExactlyOneDefinition) could
          # not see it: its matcher needed `<name>(` plus one of four return-type
          # prefixes, and `struct X {` has neither. Its population was also a
          # hand-written list of three names.
          #
          # This derives the population instead: every identifier defined at
          # column 0 in more than one committable file under tests/, with an
          # adjudication baseline for the deliberate exceptions. Flagged unless
          # adjudicated, rather than covered if someone remembered.
          python tools/gate/check_duplicate_test_definitions.py --self-test
          python tools/gate/check_duplicate_test_definitions.py

      - name: No pwsh step reads a variable another step assigned (GitHub #280)
        if: ${{ !cancelled() }}
        run: |
          # ORDER MATTERS, as above: --self-test first, because a guard nobody
          # has proved can fail is decoration.
          #
          # Every GitHub Actions `run:` block is a SEPARATE shell process, so a
          # variable assigned in an earlier step is $null in the next one.
          # windows-validation.yml's param-id reconciliation step read $outDir
          # and $testExe that way. `Join-Path $null` throws a mandatory-parameter
          # binding error, so the step died on its FIRST line on every run it
          # ever made — and its two reconciliation layers, built to catch
          # PDF-79 (seventeen parameterised cases that did not exist while the
          # suite reported green for months), had never once executed. The step
          # is deliberately conditioned on gtest having RUN rather than
          # SUCCEEDED so it can adjudicate a red run; it never adjudicated
          # anything.
          #
          # The exclusion set is DERIVED by asking the shell itself
          # (`Get-Variable`) which automatic variables exist, rather than from a
          # typed list — a typed list is the C-ENUM defect #275 and #254 were
          # spent removing, and fails the same way. The short residue of
          # scope-conditional names ($_, $LASTEXITCODE, $matches, ...) is
          # justified per entry: Get-Variable runs in a fresh global scope, so
          # those are correctly absent from its answer.
          python tools/gate/check_pwsh_step_locals.py --self-test
          python tools/gate/check_pwsh_step_locals.py

      - name: Every hidden test pipe must be reachable by the focus guard (#303)
        if: ${{ !cancelled() }}
        # GitHub #303: UIA's ValuePattern::SetValue FOCUSES the control it
        # writes to, and Qt::NoFocus does not prevent that -- it governs focus
        # from clicks and TAB, not from an accessibility client asserting it
        # directly. So a keystroke a test sends after a pipe write addresses a
        # hidden QLineEdit instead of the widget under test. That produced
        # #295's headline "1010 Ctrl+Z hotkeys removed 0 of 1000 annotations",
        # and #295 turned out to ALSO be a real product defect -- a harness
        # artefact hiding a real bug behind a fake one.
        #
        # TestPipeFocusGuard hands focus back, and identifies a pipe by NAME.
        # This guard is what makes that name-based rule safe: it enumerates
        # pipes by their STRUCTURAL shape (QLineEdit + Qt::NoFocus + a zero
        # size), which is independent of what they are called, and fails if any
        # of them is named such that the C++ guard cannot see it. Searching for
        # the name would match its own fixture and prove nothing.
        #
        # On its first run it measured 108 structural pipes across three files,
        # against the issue's estimate of "~25 pairs originating at
        # MainWindow.cpp:673" -- a line that had already drifted. The census is
        # re-derived every run rather than quoted.
        run: |
          python tools/gate/check_test_pipe_naming.py --self-test
          python tools/gate/check_test_pipe_naming.py --repo-root .

      - name: No C++ throw inside an fz_try block (#287)
        if: ${{ !cancelled() }}
        # GitHub #287's standing control for the CLASS, not for the one case.
        #
        # fz_try pushes a MuPDF error frame and fz_catch pops it. MuPDF's error
        # handling is setjmp/longjmp, so a C++ exception thrown inside the
        # fz_try block unwinds straight past fz_catch and the frame is NEVER
        # popped. fitz does not complain at the leak site -- it complains when
        # the context is dropped or when a thread holding a cloned context
        # exits:
        #
        #   Assertion failed: ctx->error.top == ctx->error.stack_base,
        #       file source/fitz/context.c, line 218
        #
        # and that ABORTS the process. #287 was reported as an intermittent
        # race in TileRendererTest.CancelPage; that test was merely the one
        # standing nearby, because TileRenderer owns a private QThreadPool and
        # a worker thread exiting is exactly when the check runs. The aborted
        # shard wrote no XML, so all 408 tests assigned to it were recorded as
        # errors. Two prior reproduction attempts came back clean because they
        # were hunting a race in the renderer; there was no race.
        #
        # #287's fix made the two SHARED primitives leak-proof
        # (MuPdfContext::execute and ::executeReturn capture an escaping
        # exception, let fz_catch pop the frame, then rethrow). That is 3 of
        # the 148 braced fz_try/fz_always bodies this guard measures across 37
        # files. The other 145 are raw blocks, most nested inside an execute()
        # lambda, and each pushes its own frame -- so the fix makes the symptom
        # rarer without making it impossible, and leaves behind a rule
        # ("do not throw in here") that every future edit must remember.
        # This replaces that convention with a mechanism.
        #
        # It reports 0 findings today -- the #118 fz_try/RAII burn-down holds.
        # A clean sweep is evidence about the sweep, so the guard refuses to
        # pass if it matches zero blocks, and its companion test injects a
        # throw into every real fz_try body in five tracked files and requires
        # all of them to be caught at the right line. Those same files contain
        # 139 legitimate throws OUTSIDE fz_try bodies, which is what shows the
        # zero is about location rather than about failing to match `throw`.
        run: |
          python tools/gate/check_fz_try_throw_free.py --self-test
          python tools/gate/check_fz_try_throw_free.py

      - name: A stress scenario over its perf budget must fail something (#238)
        if: ${{ !cancelled() }}
        # GitHub #238 reported test_stress_1000_annotation_undo_redo at 277.8 s
        # against a 300 s budget -- 92.6% -- and warned that "one more slowdown
        # of any size breaches it".
        #
        # Re-measured on an idle machine 2026-10-15: 600.581 s against the same
        # 300 s budget, i.e. 200.2% of budget. The test reported PASS.
        #
        # It passed because nothing compared the two numbers. tests/test_ui_stress.py
        # writes budget_s and wall_clock_s_avg into its measurement JSON and
        # never asserts on them; the only reader of budget_s anywhere in the
        # tree is tests/scripts/remediation_summary.py, which builds an
        # over_budget_scenarios list into a summary dict that nothing consumes
        # to fail a build. So the budget was reporting-only and a scenario at
        # twice its budget was green. #238's warning understated it: the breach
        # had already landed and no mechanism noticed.
        #
        # A budget nothing enforces is not a budget -- the same shape as #238's
        # own remark that "a baseline file that a test run can overwrite is not
        # a baseline".
        #
        # Only the JUDGEMENT half runs here. The measurement half needs a live
        # 10-minute UI stress run, which this workflow has no build and no
        # desktop for; a budget check with no measurement to read would be
        # structurally unable to fail, which is worse than not running. The
        # self-test covers the direction that matters (an unlisted scenario
        # over budget must FAIL) plus the ratchet behaviour: a known breach may
        # stay, may not GROW, and must be delisted once it comes good.
        run: |
          python tools/gate/check_stress_perf_budgets.py --self-test

      - name: A test-binary invocation must CAPTURE its exit code (#288)
        if: ${{ !cancelled() }}
        # GitHub #288's SEVENTH site, and the standing control for its class.
        #
        # Three steps in windows-validation.yml invoked a test binary and never
        # read its exit code: the next external command overwrites
        # $LASTEXITCODE, so by the time anything tested it, the binary's own
        # code was gone. Test-Path proves the ARTIFACT arrived; it cannot prove
        # the PROCESS survived writing it, so a teardown crash left a complete,
        # valid, green artifact and passed the gate.
        #
        # This exists rather than another careful read because #288 was
        # reported fixed three times and was not -- each enumeration correct and
        # scoped one level too narrowly (the sharded path; then sites that
        # DISCARD rc; then verdict sites in THIS PROCESS). The seventh site was
        # in another language in another file. On its first run against the tree
        # this guard found an EIGHTH that no human and no gate had spotted: a
        # crashed `--gtest_list_tests` leaves a TRUNCATED list, which makes the
        # reconciliation downstream weaker and therefore greener.
        run: |
          python tools/gate/check_test_exe_exit_captured.py --self-test
          python tools/gate/check_test_exe_exit_captured.py

      - name: Mutation manifest dry-run — 16 real mutants intact (R-24)
        if: ${{ !cancelled() }}
        run: python tools/gate/mutation_kill.py --manifest tools/gate/mutants.json --dry-run

      - name: DCA loop — every record conforms and names real tests (R-26)
        if: ${{ !cancelled() }}
        run: python tools/gate/check_dca.py --repo-root .

      - name: DCA presence — a defect-fix range must add a DCA record (R-26/R-31)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # First push of a branch / forced update reports an all-zero or absent
          # base; there is no reviewable range, so skip (nothing to enforce yet).
          if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -Eq '^0+$'; then
            echo "no reviewable base ref ($BASE); skipping DCA-presence."
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base $BASE not present in history; skipping DCA-presence."
            exit 0
          fi
          echo "DCA-presence over $BASE..$HEAD"
          python tools/gate/check_dca_presence.py --base "$BASE" --head "$HEAD"

      - name: Flaky-quarantine registry valid + unexpired (R-37)
        if: ${{ !cancelled() }}
        run: python tools/gate/check_flaky_quarantine.py --registry tools/gate/flaky_quarantine.json

      # The known-weak cap sat breached at 52 entries against a cap of 20
      # because the closeout gate that enforces it was wired to NOTHING -- it
      # appeared only in documentation and in its own source, so it had never
      # once run. The full closeout summary is slow (~40 s; it shells out to
      # three methodology lints) and now runs in governance.yml. This is the
      # cheap half -- pure file I/O, milliseconds -- and it is on the automatic
      # lane deliberately, because governance.yml is dispatch-only and a
      # dispatch-only gate is exactly how the breach went unnoticed.
      # Self-test first so the guard is not decoration: it pins each of its
      # three gates in both directions.
      # Full write-up: docs/audit/p86-followups/phase-6/.
      - name: Known-weak cap holds and its prose matches the assert (p86 phase-6)
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/check_known_weak_cap.py --self-test
          python tools/gate/check_known_weak_cap.py --repo-root .

      # GitHub #192 ratchet. The three UiStructureBugs icon tests only redden
      # when Qt6Svg[d].dll is genuinely ABSENT from the output directory, so a
      # leftover DLL satisfies them -- which is exactly how #192 hid for months.
      # windows-validation.yml is the only lane that runs those tests, it is
      # schedule-only, and it sets clean: false, preserving that masking
      # condition. So this reads the CMake SOURCE, never build/, and runs here
      # on the automatic lane where a revert would actually be introduced.
      # Found by the phase-1 claim-check gate of p87-open-issues, which failed
      # the phase for having no build-tree-independent check.
      # GitHub #208 ratchet. rtm-coverage.md's "## Counts" block and the matrix
      # above it in the same file drifted for ~14 months -- the block said ~72
      # rows with 1 UNCOVERED while the matrix said 77 with 0 -- because nothing
      # compared them. Phase-5 of p87-open-issues re-derived the block by
      # running a parser ONCE, which corrected the numbers and guarded nothing;
      # the phase-5 claim-check gate failed the phase for listing a
      # "programmatic check" as a standing control when none had been persisted.
      # This is that control. Self-test first, because its specific way of being
      # wrong -- classifying in the wrong order, so HAPPY-PATH-ONLY and
      # UNCOVERED both read as COVERED -- produces a plausible-looking number.
      - name: RTM Counts block still matches its own matrix (#208)
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/check_rtm_counts.py --self-test
          python tools/gate/check_rtm_counts.py --repo-root .

      - name: Qt6Svg module DLL is still staged for both targets (#192)
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/test_check_qt6svg_deploy.py
          python tools/gate/check_qt6svg_deploy.py

      # #211. The full reconciliation needs a merged JUnit XML and the test
      # binary, so it belongs in the lane that RUNS the suite -- see
      # windows-validation.yml. What CAN run on every push is the pair below:
      # the checker's own both-directions self-test, and an audit of the real
      # expectations file (every named suite is still instantiated under
      # tests/, every artefact corpus is still above its floor). Those are the
      # two ways this control rots into a no-op without anyone noticing.
      - name: Parameterised-suite reconciler is honest, and its config has not rotted (#211)
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/check_param_suite_reconciliation.py --self-test
          python tools/gate/check_param_suite_reconciliation.py --offline-audit

      # #206. Only the SELF-TEST runs here. The audit itself reads
      # `.claude/pipelines/`, which `.gitignore:173` excludes -- it is operator
      # machine state, not repository content, so it does not exist on a CI
      # runner. Wiring the audit here would give a check that always finds an
      # empty tree and always passes, which is the "registered but never
      # selected" shape this repo has been bitten by more than once. The
      # self-test DOES run, and it is the part that can rot: it pins that a
      # FAIL is counted as a FAIL, that a verdict-less evidence sidecar is not
      # mistaken for a malformed verdict, that an odd verdict reddens, and that
      # an under-reporting ledger is detected without false-positiving on an
      # agreeing one. Run the audit itself by hand:
      #     python tools/gate/audit_gate_artifacts.py [--strict]
      - name: Gate-artifact auditor can tell a FAIL from a PASS (#206)
        if: ${{ !cancelled() }}
        run: python tools/gate/audit_gate_artifacts.py --self-test

      - name: RTM cites every reachability-converted live-UI file (F29)
        if: ${{ !cancelled() }}
        run: python tools/gate/check_rtm_live_ui_citations.py --recursive

      - name: No new reachability-skip statement shapes (WIN-45 ratchet, F29)
        if: ${{ !cancelled() }}
        run: >
          python tools/gate/check_reachability_skip_shape.py
          --paths tests
          --baseline tools/gate/reachability_skip_baseline.json

      # GitHub #236. AnnotationTool owns the cached Page* and releases it in a
      # NON-VIRTUAL onDocumentClosing(), so no tool can forget -- ten of twelve
      # did, and two fatal crashes (#234, #235) came out of it.
      #
      # The compiler will not warn if a subclass re-declares `page_`: it simply
      # SHADOWS the base member, setPage() writes one copy, onDocumentClosing()
      # clears the other, and the defect is back in a file that looks exactly
      # like the correct ones. That is what this catches.
      - name: Only AnnotationTool owns the cached Page* (GitHub #236)
        if: ${{ !cancelled() }}
        run: |
          python tools/gate/check_tool_cached_page.py --self-test
          python tools/gate/check_tool_cached_page.py --repo-root .

      # GitHub #237. The LIVE half of this check runs in windows-validation.yml,
      # where the dumps are produced -- it cannot run here, because a
      # GitHub-hosted push build has no PDFE and no crash dump directory, so it
      # would pass unconditionally and be a step structurally unable to fail.
      #
      # Its judgement half runs here, as --self-test, so the decision logic
      # (which dumps belong to which run, via the epoch marker) is guarded on
      # every push rather than only on a lane that is dispatch-only.
      - name: Crash-dump gate logic is sound (GitHub #237, self-test only)
        if: ${{ !cancelled() }}
        run: python tools/gate/check_crash_dumps.py --self-test

      - name: ASan lane's detection window stays bounded (F30)
        if: ${{ !cancelled() }}
        # Expands windows-sanitizer.yml's cron into real firing datetimes and
        # measures the largest consecutive gap, so the comment block above the
        # cron cannot drift away from the cron itself. Also exits 2 on a YAML
        # parse error, which makes it a second, targeted syntactic guard on
        # that file beyond the whole-directory parse check above.
        run: >
          python tools/gate/check_asan_cadence.py
          --workflow .github/workflows/windows-sanitizer.yml
          --max-gap-days 3

      - name: No unreviewed magnitude guard in tests (PERF-02 ratchet, F37)
        if: ${{ !cancelled() }}
        # F27 found two tests whose only comparative assertion sat inside a
        # timing threshold permanently false on this hardware -- green while
        # measuring nothing. The sweep that found them was prose; this is that
        # sweep, mechanised. Shape, not phrasing: the two instances had
        # different comments, so a grep would have caught neither. Scans only
        # `tests` on purpose -- tools/gate/fixtures holds planted control
        # guards that would otherwise contaminate the count.
        run: >
          python tools/gate/check_magnitude_guard.py
          --paths tests
          --baseline tools/gate/magnitude_guard_baseline.json

      - name: Shared-runner queue exposure stays within the accepted bound (F38)
        if: ${{ !cancelled() }}
        # Re-derives the worst-case queue overlap on the single-capacity
        # `pdfe-windows` host from the LIVE cron + timeout-minutes values in
        # all five lane workflows, so the arithmetic written into
        # governance.yml and mutation-kill.yml cannot drift away from the
        # crons it describes. F38 verified that `timeout-minutes` does NOT run
        # while a job is queued (run 30959077894 queued 23h59m under a 90-min
        # timeout without firing it), so this gates queue LATENESS and the
        # runner's daily subscription -- not the timeout the old comments
        # wrongly believed was at risk.
        run: >
          python tools/gate/check_runner_queue_overlap.py
          --target governance
          --max-queue-minutes 60
          --max-daily-subscription-minutes 1600

      - name: F38-c capacity decision still matches the live schedule (F45)
        if: ${{ !cancelled() }}
        # F38-c is closed to a DECIDED state, not an implemented fix: the
        # options are on record and the remedy (capacity) is the user's
        # hardware decision. That shape rots in one specific way -- somebody
        # changes a cron, a `timeout-minutes` or the lane set, the daily
        # subscription moves, and the recommendation document still reads as a
        # current decision about a configuration that no longer exists. The
        # step above only notices the subscription RISING PAST 1600; this one
        # notices it MOVING AT ALL, by re-deriving it with the same parser and
        # comparing it against the figures recorded in the document's
        # frontmatter. Self-tests: tools/gate/test_check_f38c_risk_acceptance.py
        # (named in the Gate self-tests step below).
        run: python tools/gate/check_f38c_risk_acceptance.py --repo-root .

      - name: No step-skip masking + citations resolve (F43)
        if: ${{ !cancelled() }}
        # Run 31242065496: step 8 (DCA loop) `failure`, steps 9-16 all
        # `skipped`. GitHub applies an implicit success() to a step with no
        # `if:`, so ONE red step silently disabled EIGHT standing controls --
        # and the self-hosted runner had been dead since ~2026-07-25, so
        # nobody saw it. Every check step below/above now carries
        # `if: ${{ !cancelled() }}`; this step is the ratchet that keeps them
        # that way, and additionally forbids `continue-on-error` in either
        # lane, because a guard that also SWALLOWED the failure would be worse
        # than the masking it replaced (cf. R-32, GAP-A15).
        #
        # It also gates the documentation debt the fix creates: inserting
        # `if:` lines shifts every line number, and the tree carried 109
        # `fast-checks.yml:NNN` / `governance.yml:NNN` citations. Dated records
        # keep theirs; LIVE documents must cite the step by NAME.
        run: python tools/gate/check_fast_checks_citations.py

      - name: Packaging configures PDFE_TESTING=OFF (GitHub #182)
        if: ${{ !cancelled() }}
        # GitHub #55 gated the test-only introspection seams (PDFE_TEST_PIPES:
        # activate any tool by objectName, read back a dialog's child
        # inventory) behind PDFE_TESTING so a shipped binary would not carry a
        # control channel. #182 found the mitigation had never once applied:
        # the option defaults ON and NO build path passed it OFF -- not a
        # preset, not a workflow, not the signing script that produced the
        # signed v0.2.0 installer. The only occurrence in the off position was
        # a COMMENT, and the installer was packaged straight out of
        # build/vs2022, the tree pdfe_tests.exe is configured for.
        #
        # The fix is a second configure tree (windows-vs2022-package); this
        # step is the reason it stays fixed. The drift is invisible -- a
        # PDFE_TESTING=ON installer installs, launches and passes every test --
        # so nothing but a standing check notices a new packaging site, a
        # `-BuildDir build/vs2022`, or a preset rename that makes the other
        # gates vacuous. The preset name and tree are DERIVED from
        # CMakePresets.json for exactly that last reason.
        #
        # --self-test first, against the real tree: it asserts the clean tree
        # is clean and then re-introduces ten concrete ways #182 comes back,
        # requiring each to be caught by the gate that owns it. A mutation
        # caught by the wrong gate is not a kill.
        run: |
          python tools/gate/check_packaging_testing_flag.py --self-test
          python tools/gate/check_packaging_testing_flag.py --repo-root .

      - name: Build reuse cannot silently skip a control (phase-77)
        if: ${{ !cancelled() }}
        # windows-validation can now restore a previously published build
        # instead of building. That creates exactly one way to lose coverage
        # silently, and it is the F44/F46 masking class: a step guarded on
        # `steps.build_debug.outcome == 'success'` SKIPS when the build was
        # skipped -- which is what a successful restore does. A shard reusing a
        # build would then run none of the gtest / parity / coverage / security
        # / render controls and still report green.
        #
        # This asserts every producer guard also accepts a restore, that the
        # build steps gate on the restore FAILING, that the publish step does
        # not republish a restored copy, and that the restore refuses a commit
        # mismatch. Self-tested (--self-test) so it is not decoration.
        #
        # The round-trip test is the BEHAVIOURAL half: it extracts the publish
        # and restore `run:` blocks straight out of windows-validation.yml and
        # executes them against a synthetic build tree, so what is tested is the
        # shipped script rather than a re-implementation. It covers the refusal
        # cases specifically — no marker, wrong commit, incomplete store, and
        # nothing published — because those are what stop a reused build from
        # being trusted when it should not be.
        run: |
          python tools/gate/check_build_reuse_guards.py --self-test
          python tools/gate/check_build_reuse_guards.py
          python tools/gate/test_build_reuse_roundtrip.py
          python tools/gate/check_chained_jobs.py --self-test
          python tools/gate/check_chained_jobs.py
          # The CROSS-MACHINE half, which the two above deliberately do not
          # cover: check_chained_jobs only asserts that a follow-on job does not
          # DELETE a build tree its own machine produced. With 2-4 runners a
          # test job can land on a machine that never built at all, where there
          # is nothing to preserve. This asserts every consuming job restores
          # automatically, that the restore cannot become opt-in or vacuous, and
          # that the download stays cross-RUN -- without `run-id`,
          # download-artifact@v4 searches the current run only and the whole
          # path is INERT while every name and path still matches.
          python tools/gate/check_ensure_build_tree.py --self-test
          python tools/gate/check_ensure_build_tree.py
          # And the one failure mode none of the above can see: a `runs-on`
          # naming a label NO registered runner carries. GitHub does not error
          # on that -- the job queues, then reports `cancelled`, a status
          # indistinguishable from a deliberate cancellation and one that alerts
          # nobody. Adding role labels multiplies the ways to introduce it.
          # Checked against a committed capture of the runners API so this runs
          # offline; refresh with --refresh, never relax it.
          # ORDER MATTERS, and it is the opposite of the obvious one.
          #
          # check_label_drift runs FIRST because it is the check that still works
          # when no runner is registered. check_runner_label_coverage below fails
          # closed on an empty inventory -- correctly -- and `run:` blocks abort
          # on the first non-zero exit, so putting the drift check after it meant
          # the drift check NEVER EXECUTED in CI for as long as the fleet was
          # empty. Measured, not theorised: run 33022976080 shows `[runner-labels]
          # FAILED` and no `[label-drift]` line in that step at all.
          #
          # That is this repo's recurring failure shape -- a control that cannot
          # run is not a control -- and it would have been at its most useless
          # precisely while the fleet was empty, which is exactly the window the
          # drift check exists to cover.
          python tools/gate/check_label_drift.py --self-test
          python tools/gate/check_label_drift.py
          python tools/gate/check_runner_label_coverage.py --self-test
          python tools/gate/check_runner_label_coverage.py
          # The SAME defect class from the other end. The check above asks "can
          # the fleet that EXISTS serve this job" and needs a runner inventory to
          # answer -- so on an empty fleet it can only fail closed, and it cannot
          # tell you whether the machine you are ABOUT to provision would work.
          # check_label_drift asks that second question: it compares every
          # self-hosted `runs-on` against the labels our own deployment path
          # registers, needs no inventory, and is therefore green or red on an
          # empty fleet exactly as on a full one.
          #
          # It exists because that question went unasked and the answer was no:
          # only windows-validation's `build` and `release` carry `pdfe-builder`,
          # and the package registered runners without it, so every machine it
          # provisioned silently could not build. GitHub does not error on an
          # unsatisfiable `runs-on` -- the job queues, then reports `cancelled`.
          # (Invoked ABOVE, before the coverage check, for the ordering reason
          # given there -- not here, where it would never be reached.)
          # Crash dumps are 25-50 MB each and were riding inside the 14-day logs
          # artifact, which is how ~987 MB of them exhausted the account's
          # artifact quota and started FAILING the report job's upload on every
          # run. This asserts they upload separately, at a shorter retention,
          # excluded from the logs artifact (splitting without excluding stores
          # them TWICE), capped per run with truncation announced, and that the
          # build store holding the PDB they need is exempt from pruning -- a
          # dump whose PDB was pruned is an address, not a diagnosis.
          python tools/gate/check_crashdump_artifact.py --self-test
          python tools/gate/check_crashdump_artifact.py

      - name: Runner-deploy bootstrap fetches the CURRENT package (pin + manifest)
        if: ${{ !cancelled() }}
        shell: bash
        # Bootstrap-PdfeRunner.ps1 is the one file copied by hand to a new
        # machine; it fetches the rest of tools/runner-deployment/ at a PINNED
        # commit from a hand-maintained file list. Both have gone stale in
        # practice, and neither failure is visible on the machine that made it:
        # the pin sat six commits behind the scripts it fetches, and the file
        # list missed a harness entirely. A machine provisioned from either
        # reports a completely successful bootstrap while being wrong.
        #
        # The script does have a runtime drift check, but that is a WARNING on
        # the NEW machine -- by which point the operator is already provisioning
        # with an incomplete package. This makes it an error here, at commit
        # time, on the machine that can still fix it.
        run: |
          python tools/gate/check_runner_deploy_pin.py --self-test
          python tools/gate/check_runner_deploy_pin.py

      - name: CI-only test failures stay triaged (F45)
        if: ${{ !cancelled() }}
        # Four genuine, reproduced-across-two-CI-runs failures were invisible to
        # every local 16-shard run for six weeks, because the two INPUTS they
        # hard-assert on were gitignored and therefore present only on the
        # machine that produced them. Phase-46 committed both inputs. This gate
        # keeps the triage attached to the tests (a green test carries no memory
        # of having been red) AND re-checks the fix's mechanism: if either
        # re-include is reverted, `git ls-files` stops listing the input and
        # this step fails with the reason, instead of the tests failing in CI a
        # month later with a bare "file is missing".
        run: python tools/gate/check_f45_ci_only_markers.py

      - name: Committed third-party material stays attributed (F46)
        if: ${{ !cancelled() }}
        # `test_PDFs/crazyones-pdfa.pdf` was committed in phase-46 with NO repo
        # record of its origin. It is byte-identical to `021-pdfa/
        # crazyones-pdfa.pdf` from py-pdf/sample-files, which is CC-BY-SA-4.0 --
        # a licence that REQUIRES attribution -- and at that point the repo had
        # no attribution mechanism at all (only LICENSE, AGPL-3.0). This gate
        # binds THIRD-PARTY-NOTICES.md to the artifact by SHA-256, so the
        # attribution cannot silently drift away from the file it describes:
        # replacing the fixture, or deleting the entry, fails here. Same
        # anti-rot shape as the F38-c risk-acceptance check above.
        # Self-tests: tools/gate/test_check_third_party_notices.py
        run: python tools/gate/check_third_party_notices.py

      - name: The vcpkg binary-cache store set is the reviewed one (GitHub #177)
        if: ${{ !cancelled() }}
        # #177's first half: "VCPKG_BINARY_SOURCES integrity is unasserted".
        #
        # BE PRECISE ABOUT WHAT THIS BUYS. It asserts the binary cache's
        # CONFIGURATION, not the authenticity of anything inside it. Nothing
        # here hashes a cached package or compares one against a from-source
        # build, so a poisoned entry in an APPROVED store still passes. That
        # residual stays an accepted risk with its reasoning recorded in
        # docs/security/supply-chain-scope-decision.md; this narrows that
        # record, it does not overturn it.
        #
        # What it does catch are the two one-line edits that widen the trust
        # boundary without touching a store at all: adding a network-backed
        # provider (nuget/http/azblob/s3/gcs) to the chain, and dropping the
        # leading `clear` so vcpkg's implicit user-wide default archive cache
        # silently rejoins it. Both are invisible in review unless someone is
        # diffing an env string; this fires on the commit that makes the change.
        #
        # Runs here rather than in the dispatch-only lane because it is pure
        # Python and offline — the p85 phase-1 disposition for exactly this
        # shape of script.
        # Self-tests: `--self-test` below (18 cases, incl. one negative case per
        # rule and the scanned-nothing / empty-dir / unparseable fail-closed
        # paths). Run FIRST so a checker that can no longer say NO fails here
        # rather than passing vacuously over the real tree.
        run: |
          python tools/gate/check_vcpkg_binary_sources.py --self-test
          python tools/gate/check_vcpkg_binary_sources.py

      - name: The vcpkg package-contents manifest is intact (GitHub #177)
        if: ${{ !cancelled() }}
        # The REAL contents verification needs an installed tree, so it lives in
        # windows-validation.yml right after configure. This push-lane step is
        # the cheap half: prove the manifest that check depends on still exists,
        # still parses, still names the deterministic triplet, and is not empty.
        #
        # WHY THAT IS WORTH A STEP. An emptied or deleted manifest does not make
        # the build lane fail -- it makes it verify nothing, or skip. This
        # project has hit that exact shape repeatedly: a guard that exits 0
        # having checked nothing. Here it would be silent, because the lane that
        # would notice is dispatch-only and might not run for weeks.
        #
        # Self-test runs too: it needs no repo state and proves the normaliser
        # still distinguishes SPDX's per-document fields from real content.
        # Self-tests: --self-test below (12 cases, incl. one negative per rule and
        # the zero-files vacuous-pass case). Run FIRST so a checker that can no
        # longer say NO fails here rather than passing over the real manifest.
        run: |
          python tools/gate/vcpkg_cache_manifest.py --self-test
          python tools/gate/vcpkg_cache_manifest.py --check-manifest

      - name: Every cited evidence capture is actually tracked (F36)
        if: ${{ !cancelled() }}
        # `.gitignore` carried a blanket `*.xml` for months, so evidence written
        # under docs/ was silently excluded. The failure mode is the quiet one:
        # `git add` on an ignored file EXITS 0 and stages NOTHING, with no
        # warning, so the commit looks complete and the citation pointing at the
        # file resolves to nothing months later. F36 lost eight captures exactly
        # that way, and it recurred in 3778b3b because a per-directory negation
        # needs someone to remember it for every new audit directory.
        #
        # This asks the only question that matters: does anything in the tree
        # CITE a file the tree does not CONTAIN? Uncited leftovers are reported
        # but never fail -- untidy is not the same as broken, and a check that
        # reds on both teaches people to ignore it.
        run: python tools/gate/check_cited_evidence.py --fail-on-untracked-cited

      - name: Every work-list document says which tracker is canonical
        if: ${{ !cancelled() }}
        # Until 2026-09-02 this repo had NO declared source of truth for defects
        # and ~25 documents that each read like one: a 458-row gap-register, a
        # 392-row status-register, ~52 phase-NN-dispositions, a second doc tree
        # under tests/docs/. Eleven id namespaces, ~1,100 ids, and five GitHub
        # cross-references in the whole tree. docs/TRACKING.md declared GitHub
        # Issues canonical for open work and every competing document was banded.
        #
        # Banding was a one-time act; drift is continuous. Without this check the
        # next tracker doc arrives unlabelled and the ambiguity grows back --
        # which is how it got there the first time.
        #
        # Scored, not guessed, and deliberately loose: single-investigation
        # records are discounted 3x and anything under the threshold is ignored,
        # because a guard that reds on correct documents is worse than none.
        # Escape hatch is in-file and must carry a reason.
        # Self-tests: tools/gate/test_check_tracking_banners.py
        run: python tools/gate/check_tracking_banners.py --repo-root .

      - name: No host-rooted paths or account names in tracked files (F73/F48)
        if: ${{ !cancelled() }}
        # F73 closed the PRODUCER -- what the UI runner writes. It could not
        # close this, because a raw `--gtest_output=xml` capture copied into
        # docs/ by hand never passes through that producer. That is exactly how
        # 50 files carrying the account name landed in 3778b3b, on a repository
        # that had been history-scrubbed and renamed to remove precisely this.
        #
        # The tree is the thing that ships, so the tree is what this checks.
        run: python tools/gate/check_tracked_path_hygiene.py

      - name: A judgement record must not contradict its own classification
        if: ${{ !cancelled() }}
        # phase-5 of the repo-migration pipeline keeps a per-file judgement
        # record: for each file naming the repository, did it need a change?
        # The claim-check gate failed that phase TWICE over one record -- once
        # because a row's CLASSIFICATION disagreed with the diff, and once
        # because a correctly-classified row's PROSE still said the file had
        # been "left alone" after the narrative record had already corrected
        # that claim. A false sentence in the document that is supposed to be
        # authoritative.
        #
        # It failed a THIRD time because the first fix lived in a throwaway
        # job directory while being described as a standing control. That is
        # why this step exists: a checker nothing runs is not a control, and
        # this repository has made that mistake twice (phase-4's rename
        # preflight was untracked for the same reason).
        #
        # The checker is a negation-of-change wording heuristic and says so in
        # its own docstring. It is the SECOND line of defence; the primary one
        # compares classifications against git status and is not
        # wording-dependent.
        run: python tools/gate/check_judgement_prose.py

      - name: A judgement record must agree with the diff, both directions
        if: ${{ !cancelled() }}
        # The PRIMARY control for the judgement record, and the one that reads
        # no prose: every `**CHANGE**` row must be in the diff, and every
        # modified file must have a `**CHANGE**` row.
        #
        # This logic spent most of phase-5 as a shell script in a Claude job's
        # temp directory while three documents AND check_judgement_prose.py's
        # own docstring described it as "the primary control". The claim-check
        # gate failed the phase on its fifth pass for exactly that: it searched
        # the tracked tree, found nothing, and located the implementation in
        # scratch space.
        #
        # That was the THIRD time in one pipeline that an untracked script was
        # credited as a standing mechanism -- and the third was committed inside
        # the claim being used to justify the second one's known weakness.
        # Diagnosing a defect shape twice is no protection against repeating
        # it, which is why the checker's test asserts it is tracked AND that
        # this step exists.
        run: python tools/gate/check_record_vs_diff.py

      - name: Scrubbed identifiers must not come back (GitHub #200)
        if: ${{ !cancelled() }}
        # pub-readiness removed an operator's personal name, a company domain
        # and three customer-derived names from this repository. The
        # claim-check gate then failed that work for the right reason: the
        # scrub had no standing control. check_tracked_path_hygiene.py polices
        # the build ACCOUNT name and home paths and nothing else, so any of
        # those strings returning in a later commit would go unnoticed. A
        # one-time sweep is not a mechanism.
        #
        # The needles are stored as SHA-256, never in plaintext, because a
        # guard that names what it forbids reintroduces it -- this repo has
        # done exactly that twice (the hygiene checker printed the account name
        # into a CI log; hostname_baseline.json used to need a self-exemption
        # because it held its own needle in the clear -- no longer true since
        # 2026-10-24, when that needle was hashed and HOSTNAME_SELF_EXEMPT was
        # deleted). Hashing means the needle file is safe to publish and still
        # matches when the real string returns.
        #
        # Its first real run found 192 occurrences of a separator variant the
        # scrub had missed, and an earlier version of the checker scanned 245
        # files instead of 3,490 while reporting OK -- so the self-test now
        # pins the population as well as the matching.
        # Self-tests: check_scrub_regressions.py --self-test
        run: python tools/gate/check_scrub_regressions.py

      - name: "A scrub scanner must load the WHOLE needle inventory (GitHub #200)"
        if: ${{ !cancelled() }}
        # The needle inventory is SPLIT across two files -- scrub_needles.json
        # (8 needles) and hostname_baseline.json (the build host) -- and nothing
        # made a consumer load both. Measured 2026-10-24, two did not, and both
        # reported success over text that named the build host:
        #
        #   * scan_tracker_text.py printed "OK: no scrubbed identifier found"
        #     across 324 live tracker items. Re-run with the full inventory:
