name: Hetzner Self-Hosted Sanitizer Run

# This workflow targets a self-hosted runner provisioned on Hetzner.
# It complements the GitHub-hosted sanitizer.yml by allowing longer
# fuzzing campaigns (no GitHub minute limits) and reproducible builds.
#
# Prerequisites:
#   1. Hetzner Cloud server (CX31 or larger recommended for ASan)
#   2. Ubuntu 22.04+ with: clang-15, ninja-build, vcpkg, Qt6 dev libs
#   3. GitHub Actions self-hosted runner registered with labels:
#      [self-hosted, linux, hetzner, sanitizer]
#
# See tests/docs/hetzner_runner_setup.md for full provisioning steps.

on:
  # DISPATCH-ONLY BY DESIGN — do NOT add a schedule trigger.
  #
  # The Hetzner runner is EPHEMERAL: it is provisioned on demand
  # (tests/scripts/hetzner_ephemeral_runner.ps1), used for one run,
  # and ALWAYS destroyed afterward (`hcloud server delete`) — see the
  # feedback_hetzner_ephemeral project rule. A `schedule:` trigger
  # would fire on a timer with no runner online (the job would queue
  # forever), OR, if paired with auto-provisioning, would spin up a
  # billed VM unattended on a cron — directly violating the
  # "ephemeral only, always destroy" rule and risking an orphaned,
  # billed server if teardown fails.
  #
  # Correct usage: a human (or the orchestrator) provisions the
  # ephemeral runner, dispatches THIS workflow manually, collects the
  # extended-fuzz artifacts, then destroys the server. The longer
  # 2h/harness campaign here complements the push-triggered
  # windows-fuzz.yml short campaign.
  #
  # RE-CONFIRMED 2026-08-01 by meta-audit follow-up F5 (gap SEC-109): this
  # dispatch-only decision was re-examined and STANDS unchanged. It is not
  # the blanket "all PDFE CI is dispatch-only as of 2026-07-20" rationale —
  # it is a specific, sound reason (ephemeral billed runner) that a timer
  # trigger would actively violate. Note also that the Linux port this lane
  # serves is blocked by deferred tracker #42.
  #
  # See GAP-C4 in tests/docs/gap_checklist.md,
  # tests/docs/security_workflows.md, and
  # docs/audit/meta-audit-2026-07/followup/phase-5-dispositions.md for the
  # decision record.
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-harness fuzz duration (seconds)'
        required: false
        default: '7200'

jobs:
  extended-fuzz:
    runs-on: [self-hosted, linux, hetzner, sanitizer]
    timeout-minutes: 1440  # 24 hours
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      # Hermetic mujs override for the codeberg 1.3.8 tarball hash drift
      # (see tools/vcpkg-overlays/mujs/portfile.cmake). Ephemeral runners
      # have a cold binary cache and rebuild mujs from source, hitting the
      # drifted download; this overlay repins to the current (byte-identical
      # source) bytes. Windows lane unaffected.
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/tools/vcpkg-overlays

    strategy:
      fail-fast: false
      # Sequential so job 1 populates the vcpkg cache for jobs 2-7
      max-parallel: 1
      matrix:
        harness:
          - fuzz_document_open
          - fuzz_page_render
          - fuzz_text_extract
          - fuzz_annotation_walk
          - fuzz_form_parse
          - fuzz_embedded_files
          - fuzz_encryption_dict

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Use pre-installed vcpkg
        # vcpkg is pre-cloned at /home/actions/vcpkg by the
        # hetzner_ephemeral_runner.ps1 provisioning script.
        # Avoiding lukka/run-vcpkg@v11 because it fails to load
        # action.yml on this runner version (2.334.0).
        run: |
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          echo "$HOME/vcpkg" >> $GITHUB_PATH

      - name: Configure ASan+UBSan+libFuzzer
        env:
          CC: clang-15
          CXX: clang++-15
          CFLAGS: '-fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer -g -O1'
          CXXFLAGS: '-fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer -g -O1'
        run: |
          cmake -B build-fuzz -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DPDFE_ENABLE_FUZZING=ON \
            -DPDFE_FUZZ_BACKEND=libfuzzer

      - name: Build harness
        run: cmake --build build-fuzz --target ${{ matrix.harness }}

      - name: Extended fuzz campaign
        env:
          DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '7200' }}
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1:detect_stack_use_after_return=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          mkdir -p corpus/${{ matrix.harness }}
          mkdir -p artifacts/${{ matrix.harness }}
          if [ -d "tests/security/fuzz/seeds/${{ matrix.harness }}" ]; then
            cp tests/security/fuzz/seeds/${{ matrix.harness }}/* corpus/${{ matrix.harness }}/ 2>/dev/null || true
          fi
          ./build-fuzz/bin/${{ matrix.harness }} \
            corpus/${{ matrix.harness }} \
            -max_total_time=$DURATION_SECONDS \
            -timeout=120 \
            -rss_limit_mb=8192 \
            -artifact_prefix=artifacts/${{ matrix.harness }}/ \
            || true

      - name: Coverage minimize corpus
        run: |
          mkdir -p minimized/${{ matrix.harness }}
          ./build-fuzz/bin/${{ matrix.harness }} \
            -merge=1 \
            minimized/${{ matrix.harness }}/ \
            corpus/${{ matrix.harness }}/ || true

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: hetzner-fuzz-${{ matrix.harness }}-findings
          path: artifacts/${{ matrix.harness }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload minimized corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: hetzner-fuzz-${{ matrix.harness }}-minimized
          path: minimized/${{ matrix.harness }}/
          retention-days: 30
