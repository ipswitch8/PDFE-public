# ---------------------------------------------------------------------------
# Mutation Kill-Rate (test-quality gate)
#
# Register M-e / remediation Phase 1 (job exists) + Phase 5 (floor gates).
#
# Runs the targeted C++ mutation harness (tools/gate/mutation_kill.py) against
# the seed manifest (tools/gate/mutants.json). Each mutant inverts a real
# behavior in one source file; a test that STILL PASSES against the mutated
# code is a false-green oracle (a surviving mutant). This is the standing
# defense against the exact failure the audit found pervasively: tests that
# assert non-throwing / recompute-the-formula rather than catching the bug.
#
# TRIGGER — DISPATCH ONLY. There is no schedule.
#
# GitHub #230. This header used to declare a weekly cadence alongside dispatch
# (citing meta-audit follow-up F5), and the `on:` block below still opened by
# naming a Saturday 20:00 UTC slot immediately above the line saying the
# schedule had been removed. Both described a cadence that stopped existing on
# 2026-08-13. The removal was recorded in one place and contradicted in two
# others, so the file asserted its own opposite.
#
# The old wording is deliberately NOT quoted verbatim here.
# check_workflow_triggers.py matches "<CADENCE> SCHEDULE ... +" by shape and
# cannot tell a quoted retraction from a live declaration — its own note on
# windows-fuzz.yml says so. Reproducing the phrase would have forced another
# disposition entry; paraphrasing lets that list ratchet DOWN instead, which is
# the direction it is designed to move.
#
# The F5 / SEC-27 REASONING BELOW STILL STANDS and is kept for that reason: a
# mutation kill-rate floor that fires only when a human remembers to click is
# not a floor. That argument is why this lane would be scheduled if anything
# ever were. What changed is that nothing is — see the three independently
# sufficient reasons in the `on:` block.
#
# [HISTORICAL] The weekly cadence, as of meta-audit follow-up F5 (gap SEC-27,
# which merges A1-10, A1-17, A3-24, A3-39 and A3-42 — five separate audit
# items all saying the same thing):
#
# It WAS dispatch-only "consistent with all PDFE CI as of 2026-07-20". The
# consequence: the mutation kill-rate floor — this project's only empirical
# defense against false-green oracles, and the control that the harness-audit
# remediation was built around — fired only when a human remembered to click.
# A floor that runs on recall is not a floor.
#
# Why WEEKLY and not nightly: the cost objection is real and unchanged. A full
# pass rebuilds pdfe_tests once per mutant on the single self-hosted runner,
# which is why this cannot join the nightly band. Weekly is the cadence the
# runner can absorb; the manifest DRY-RUN (cheap, no toolchain) already runs on
# every push and PR via fast-checks.yml (:92). [CORRECTED, #230: this sentence
# continued "and again daily via governance.yml (:125, schedule-only — it has
# NO push trigger)". governance.yml is `workflow_dispatch` ONLY — verified by
# parsing its `on:` block — so it does not run daily and is not schedule-only.
# The per-commit half of this argument survives, because fast-checks.yml
# genuinely is push/PR-triggered and is the only workflow that is. The daily
# half does not.] So a stale mutant catalog is caught per-commit, and the
# expensive real kill run happens only when dispatched.
# (Attribution corrected 2026-08-06, F30: this line previously said the dry-run
# ran "on every push via fast-checks.yml AND governance.yml", which credits
# governance with a push trigger it does not have.)
#
# SLOT: Saturday 20:00 UTC. Deliberately outside every other lane's window on
# the shared pdfe-windows host:
#   windows-fuzz.yml       '30 3 * * *'  daily 03:30, timeout 600 -> to 13:30
#   windows-validation.yml '20 4 * * *'  daily 04:20 (queues behind fuzz)
#   governance.yml         '0 2 * * *'   daily 02:00, timeout 90 (moved from
#                                        22:00 by F38 — see below)
#   windows-sanitizer.yml  '0 18 * * 0,2,4'  Sun/Tue/Thu 18:00, timeout 360
#                                        (was weekly Sundays; tightened by F30)
# This job's timeout is 240 min, so a 20:00 Saturday start finishes by 00:00
# Sunday at worst — clear of the daily 03:30 band, and clear of the sanitizer
# lane, which fires Sun/Tue/Thu and never on Saturday. F30 chose {0,2,4} over
# {0,3,6} for exactly that reason: Saturday is left free for THIS job.
#
# RESOLVED 2026-08-07 (F38). This comment previously ended with an open hazard:
# that governance's 22:00 start could queue 120 min behind THIS job's Saturday
# tail (20:00 + 240 = 00:00) and exhaust its own 90-minute timeout before
# starting. Two things were wrong with it, and F38 established both.
#
# 1. THE PREMISE IT RESTED ON IS NOW VERIFIED — and it kills the hazard.
#    The paragraph flagged as UNVERIFIED the claim that `timeout-minutes`
#    starts when a job begins EXECUTING, not when it is queued. It is true:
#    GitHub's documentation says so, and this repo's run 30959077894
#    (`governance`, 2026-08-04) sat QUEUED for 23 h 59 m under a 90-minute
#    timeout, never executed a step, and never timed out — it ended
#    `cancelled`. A queued job cannot exhaust its timeout, so "120 > 90" was
#    comparing two quantities that never meet. The real limit on a queued run
#    is GitHub's separate ~24-hour queue cancellation.
#
# 2. THE OVERLAP WAS REMOVED ANYWAY, because lateness is still real.
#    F38 moved governance to 02:00, which is AFTER this job's worst-case
#    Saturday tail rather than 120 minutes inside it:
#
#        this job's worst case : Sat 20:00 + 240 min = Sun 00:00 UTC
#        governance start      : Sun 02:00
#        queue overlap         : NONE (governance starts 120 min after the
#                                      tail ends, not 120 min before)
#
#    The identical correction applies to windows-sanitizer.yml's Sun/Tue/Thu
#    tail (18:00 + 360 = 00:00), which had the same exposure.
#
# governance.yml's header is the authoritative statement of the finding, the
# residual risk and the accepted bounds. The arithmetic in BOTH files is now
# re-derived mechanically from the live crons and timeouts by
# tools/gate/check_runner_queue_overlap.py (wired at fast-checks.yml), so if
# anyone moves a slot or lengthens a timeout back into an overlap, a check
# fails instead of a comment quietly going stale — which is precisely what
# happened to this paragraph twice.
#
# DECISION RECORD: docs/audit/meta-audit-2026-07/followup/phase-5-dispositions.md
#
# `floor` gates the job in Phase 5 (default 1.0 = every seeded mutant must be
# killed). `dry_run=true` only validates the manifest (fast, no toolchain).
# A SCHEDULED run supplies no inputs, so both are defaulted at the point of
# use below (`inputs.floor || '1.0'`, `inputs.dry_run || 'false'`) — without
# those fallbacks the scheduled run would pass `--floor ""` and a scheduled
# mutation gate would fail for a reason unrelated to test quality.
# ---------------------------------------------------------------------------

name: Mutation Kill-Rate

# vcpkg env — MUST match windows-validation.yml. Without these the job used the
# VS-bundled vcpkg (via ilammy/msvc-dev-cmd's exported VCPKG_ROOT) with NO binary
# or asset cache, so `cmake --preset windows-vs2022` rebuilt every dependency from
# source and Configure failed (run 30429999604). The bincache restores pre-built
# ports by ABI hash (hermetic — no source download, immune to upstream tarball
# drift), and the asset cache serves known-good source archives locally. This is
# the SAME mechanism that makes windows-validation.yml green on the same runner;
# VCPKG_ROOT is deliberately NOT pinned (that lane doesn't either — the cache, not
# the vcpkg root, is what makes it work).
env:
  VCPKG_FEATURE_FLAGS: manifests,binarycaching
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_BINARY_SOURCES: 'clear;files,C:\vcpkg-bincache,readwrite;x-gha,readwrite'
  X_VCPKG_ASSET_SOURCES: 'clear;x-azurl,file:///C:/vcpkg-assets,,readwrite'

on:
  # [HISTORICAL, #230] This block used to open by declaring "Weekly —
  # Saturdays 20:00 UTC (F5 / SEC-27)" on the line directly above the removal
  # notice, which made the two adjacent lines contradict each other. The slot
  # rationale in the header remains useful input for any future scheduling
  # decision; it is not a description of what runs.
  #
  # NO SCHEDULED TRIGGER — REMOVED 2026-08-13, DELIBERATELY, DO NOT RESTORE.
  #
  # Every workflow in this repository is now MANUAL (`workflow_dispatch`) only.
  # Three separate reasons, each independently sufficient:
  #
  #   1. THE RUNNER IS NOT A SERVICE. The self-hosted Windows runner is started
  #      by hand (`run.cmd`) and dies silently. An unserviced scheduled run
  #      QUEUES and is then reported `cancelled` — a status that alerts nobody
  #      and is indistinguishable from a deliberate cancellation. The
  #      audit-of-audits records this lane as having no green in eight runs for
  #      exactly that reason.
  #   2. A SCHEDULED RUN WEDGES CONCURRENT LOCAL WORK. PDFE's single-instance
  #      mutex is MACHINE-GLOBAL, so a scheduled job's UI E2E / render steps
  #      hold it for hours and red `ShellAndInstanceLaunchTest` in every
  #      concurrent local suite run on the same host — a false red that has been
  #      misread as a product regression in three separate phases.
  #   3. IT IS THE OWNER'S STANDING INSTRUCTION: there are to be no recurring
  #      scheduled items on this project.
  #
  # Run it deliberately instead: `gh workflow run <this file>`, after checking
  # the runner is actually online. A manual run that a human is watching is
  # worth more than a nightly one nobody reads.
  workflow_dispatch:
    inputs:
      floor:
        description: "Minimum acceptable kill-rate (0..1). 1.0 = every seeded mutant must be killed."
        required: false
        default: "1.0"
      dry_run:
        description: "true = validate the manifest only (no build/test)."
        required: false
        default: "false"

concurrency:
  # Keyed on event_name as well as ref (F5): now that a weekly schedule
  # exists, ref alone would let the Saturday cron cancel a human's
  # in-progress investigation dispatch (or vice versa).
  group: mutation-kill-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  mutation-kill:
    name: mutation-kill
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up MSVC environment
        if: ${{ inputs.dry_run != 'true' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      # msvc-dev-cmd exports VCPKG_ROOT pointing at the VS-bundled vcpkg, whose
      # ports tree is incomplete (vcpkg-cmake / vcpkg-cmake-config "do not exist")
      # so Configure fails before any cache restore. run-vcpkg provisions a full
      # vcpkg in the workspace at the project's pinned baseline and re-exports
      # VCPKG_ROOT (overriding msvc-dev-cmd) — identical to windows-validation.yml.
      # Pair with the bincache env above so ports restore pre-built by ABI hash.
      - name: Set up vcpkg (manifest mode)
        if: ${{ inputs.dry_run != 'true' }}
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: 15e5f3820f0370f1ba7150853762cec0688cd396

      - name: Configure (needed for incremental per-mutant rebuilds)
        if: ${{ inputs.dry_run != 'true' }}
        shell: pwsh
        run: cmake --preset windows-vs2022

      - name: Run mutation harness
        shell: pwsh
        run: |
          # Defaults applied at point of use so a SCHEDULED run (which supplies
          # no inputs) still gets floor=1.0 / dry_run=false — see the header.
          $args = @('tools/gate/mutation_kill.py',
                    '--manifest', 'tools/gate/mutants.json',
                    '--floor', "${{ inputs.floor || '1.0' }}",
                    '--json-out', 'mutation-report.json')
          if ("${{ inputs.dry_run || 'false' }}" -eq "true") { $args += '--dry-run' }
          python @args
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Error "Mutation kill-rate below floor (surviving mutant = false-green oracle). See mutation-report.json."
            exit 1
          }
          Write-Host "Mutation kill-rate at or above floor."

      - name: Publish mutation summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path mutation-report.json) {
            $r = Get-Content mutation-report.json -Raw | ConvertFrom-Json
            "## Mutation kill-rate" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- killed $($r.killed)/$($r.total)  kill-rate=$($r.kill_rate)  floor=$($r.floor)" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutation-report
          path: mutation-report.json
          if-no-files-found: ignore
          retention-days: 14
