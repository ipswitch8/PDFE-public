# ---------------------------------------------------------------------------
# Governance gate (standing controls)
#
# Pipeline e5b9c231 Phase 5. Enforces the standing controls this phase installed
# so they are gates, not documentation:
#
#   * DCA loop (criterion 4)      — every escaped-defect record under
#     docs/audit/dca/ conforms to the template AND names tests that exist.
#   * Matrix pass-semantics (1)   — the runtime "ran-and-asserted-this-run"
#     transform behaves (unit tests).
#   * Matrix health H4 (2)        — green->skip / green->no-run degradations are
#     flagged (unit tests). Optionally runs the live matrix-health gate over a
#     provided runtime sweep CSV with --require-ran (full-sweep mode).
#   * Mutation floor (3)          — the kill-rate floor is a gate (unit tests) +
#     a manifest dry-run. The full build-based kill run is the separate
#     mutation-kill.yml workflow.
#
# TRIGGER — AUTOMATIC as of meta-audit follow-up F5 (gaps SEC-28 + SEC-31).
# This was `workflow_dispatch`-only "consistent with all PDFE CI as of
# 2026-07-20". That blanket rationale did not survive scrutiny for THIS
# workflow: the 2026-07-20 removal was about not monopolising the single
# self-hosted runner with multi-hour C++ builds, and governance has no C++
# toolchain, no build, and a 5-minute pure-Python runtime. So the standing
# controls it enforces — the DCA loop, the mutation manifest, the matrix
# ran-and-asserted semantics (`--require-ran`; as of meta-audit follow-up F17 /
# gap A1-81 the full-sweep lane in windows-validation.yml passes it too) — were
# gates that fired only when a human remembered them. See
# docs/audit/meta-audit-2026-07/followup/phase-5-dispositions.md.
#
# DOUBLE DUTY — RUNNER LIVENESS (SEC-31), AS REBUILT BY F44.
#
# This job deliberately stays on the self-hosted `pdfe-windows` host even
# though its steps would run anywhere: a daily scheduled job that is cheap and
# MUST start is the "scheduled liveness/queue check" SEC-31 asks for. That half
# still holds. This job is the PROBE.
#
# What it is NOT, and never was, is the ALARM. Every version of this header
# from F5 to F38 asserted that an unserviced run "times out RED, which is the
# alert", and that `timeout-minutes` was raised 20 -> 90 to serve it. **That is
# false and is measured false** — see "WHAT F38 MEASURED" below. A queued run
# does not consume `timeout-minutes`; it is `cancelled`, and `cancelled` is not
# a failure and notifies nobody.
#
# THE ACTUAL DETECTION MECHANISM (meta-audit follow-up F44, backlog rows F38-b
# and F46), so nobody has to re-derive it from this file again:
#
#   * `tools/gate/check_governance_liveness.py` classifies this workflow's run
#     history and reports OK only when a run of THIS lane concluded `success`
#     inside a stated freshness window (default 48 h = one tolerated missed
#     night plus the ~70 min of scheduled-dispatch lateness measured on this
#     repo). Everything else — no runs, never-succeeded, queued-then-cancelled,
#     a success gone stale — is ALARM. Unparseable input is a hard error. No
#     input reads as healthy on absent data.
#
#   * It is invoked by `.github/workflows/ci-liveness.yml`, daily, on a
#     GitHub-hosted `ubuntu-latest` runner. **Off-host, deliberately: a probe
#     hosted on the machine it monitors cannot report that machine being
#     down**, which is precisely why the outage of 2026-07-25..2026-08-07 was
#     invisible. Do not "simplify" that lane onto the self-hosted runner; a
#     self-test asserts it is not there.
#
#   * The crash/logout half is `tools/ops/runner_watchdog.ps1` (a heartbeat on
#     every iteration, so a quiet watchdog and a dead one are no longer the
#     same observable) plus the autostart recommendation in
#     `tools/ops/register_runner_service.ps1`. Registering that on the live
#     host is a USER action and is deliberately NOT done by any audit phase.
#
#   * Dispositions:
#     docs/audit/meta-audit-2026-07/followup/phase-44-dispositions.md
#
# `timeout-minutes: 90` is retained, but for the reason F38 established, not
# the one F5 wrote: it is a normal execution ceiling. It is NOT, and cannot be,
# an alerting mechanism.
#
# ===========================================================================
# WHAT F38 MEASURED (2026-08-07) — the load-bearing facts, with evidence
# ===========================================================================
# Every version of this header since F5 has carried an arithmetic hazard
# ("a 22:00 start can queue 120 min behind a tail, which exceeds this job's
# 90-min timeout") resting on a premise both this file and mutation-kill.yml
# explicitly flagged as UNVERIFIED. F38 verified it before acting.
#
# 1. `timeout-minutes` does NOT run while a job is QUEUED. Confirmed by
#    GitHub's documentation (the timeout governs execution; a job that finds
#    no matching online runner stays queued and is cancelled after ~24 h in
#    queue under a separate limit) AND, decisively, by this repository's own
#    run records:
#
#        run 30959077894 — `governance`, scheduled 2026-08-04T23:10:16Z,
#        queued 23 h 59 m, `timeout-minutes: 90`, conclusion `cancelled`,
#        steps: []  — it never executed a single step, and the 90-minute
#        timeout never fired after 1439 minutes of waiting.
#
#    **Therefore the 120-vs-90 hazard as written DOES NOT EXIST.** A queued
#    run of this job cannot exhaust its own timeout. Raising `timeout-minutes`
#    would have fixed nothing, so F38 deliberately left it at 90.
#
# 2. What IS real is LATENESS, and the ~1440-minute queue-cancellation cliff
#    is the only limit that can actually kill a queued run.
#
# 3. THE LIVENESS SIGNAL IS BROKEN, and this is the more serious finding.
#    The design above assumes an unserviced run "times out RED". It does not:
#    it sits queued and is then cancelled — either by the 24-hour queue limit
#    or, sooner, by the next day's run under this file's own
#    `cancel-in-progress: true`. `cancelled` is not a failure and alerts
#    nobody. Confirmed: `gh run list --workflow=governance.yml
#    --status=success` returns EMPTY — this job has never once succeeded, and
#    never once alerted, since F5 scheduled it. At the time of writing the
#    runner `pdfe-runner-01` is registered but `offline`, and every scheduled
#    lane on the host has been queuing and being cancelled at ~24 h since
#    2026-07-31. Rebuilding the alarm was OUT OF F38's SCOPE and was filed as
#    backlog row F38-b; it is recorded here so nobody re-derives the false
#    reassurance from the paragraph above.
#
#    **F44 (2026-08-08) rebuilt it.** The alarm is now
#    `tools/gate/check_governance_liveness.py`, hosted OFF this runner in
#    `.github/workflows/ci-liveness.yml`, and it asserts positive evidence
#    (a recent genuine `success`) rather than the absence of a failure. Its
#    ALARM verdict is proven against the four real records above, captured
#    verbatim as `tools/gate/fixtures/`
#    `governance-runs-real-queued-cancelled-2026-08-06.json` — run
#    30959077894 included. See the DOUBLE DUTY section above.
#
# ===========================================================================
# SLOT: daily 02:00 UTC (MOVED from 22:00 by F38)
# ===========================================================================
# Worst-case occupancy of the shared host, from live cron + timeout values:
#   windows-fuzz.yml       '30 3 * * *'      timeout 600 -> 03:30-13:30
#   windows-validation.yml '20 4 * * *'      timeout 720 -> 04:20-16:20
#   windows-sanitizer.yml  '0 18 * * 0,2,4'  timeout 360 -> 18:00-00:00
#   mutation-kill.yml      '0 20 * * 6'      timeout 240 -> 20:00-00:00
#
# At 22:00 this job sat 120 minutes inside the tail of windows-sanitizer on
# Sun/Tue/Thu AND of mutation-kill on Saturday. At 02:00 BOTH of those tails
# have already ended (00:00), and the daily band does not begin until 03:30:
#
#     vs windows-sanitizer : 18:00 + 360 = 00:00; 02:00 is 120 min AFTER  -> 0
#     vs mutation-kill     : 20:00 + 240 = 00:00; 02:00 is 120 min AFTER  -> 0
#     vs windows-fuzz      : starts 03:30, i.e. AFTER this job             -> 0
#     vs windows-validation: 04:20-16:20, ends 9 h 40 m before             -> 0
#     worst-case pairwise queue delay: 120 min -> 0 min
#
# This job's own 90-minute timeout runs 02:00-03:30, ending exactly as the
# fuzz lane's slot opens, so it does not push the daily band either.
#
# ENFORCED, not merely written down: tools/gate/check_runner_queue_overlap.py
# re-derives all of the above from the live crons and timeouts in all five
# workflow files and fails if the delay exceeds the accepted bound. The
# committed pre-F38 snapshot tools/gate/fixtures/governance-2200-prefix.yml
# FAILS it at 120 min, so the check is demonstrably discriminating.
#
# ===========================================================================
# RISK ACCEPTANCE (F38) — with a stated maximum acceptable exposure
# ===========================================================================
# Accepted, deliberately and with these bounds:
#
#   * MAX PAIRWISE QUEUE DELAY: 60 minutes. The live configuration achieves
#     0, so this is a ratchet with an hour of headroom, not a bound drawn
#     around whatever happens to be true. Gated.
#
#   * MAX DAILY WORST-CASE SUBSCRIPTION: 1600 minutes. The live value is
#     ~1599 minutes of work offered per 1440-minute day — **111%**. At
#     `timeout-minutes` ceilings this single-capacity runner CANNOT serve its
#     own schedule, so the serial-queue cascade diverges and no slot change
#     can fix it; only capacity can. This is accepted rather than endorsed,
#     because timeouts are ceilings and not expected durations. Gated so it
#     cannot drift further without a decision. Filed as backlog row F38-c.
#
#   * SCHEDULING JITTER, stated because it is measured and unbounded by us:
#     GitHub's scheduled dispatch is late under load — observed at ~70 min on
#     this repo (cron 22:00, run created 23:09-23:11 on four consecutive
#     nights). A 02:00 nominal start can therefore land near 03:10, which
#     still precedes the 03:30 fuzz slot but with less margin than the
#     arithmetic above suggests. Accepted: the consequence is a late
#     governance run or a short queue, never a lost control.
#
# Not accepted, and NOT closed by F38: the broken liveness alarm (item 3
# above, backlog row F38-b).
#
# CORRECTION HISTORY. F30 (2026-08-06) fixed two staleness defects here — the
# heavy band was given as 03:30-13:30 from the fuzz timeout alone when
# windows-validation.yml:100's 720 extends it to 16:20, and the sanitizer tail
# was described as Sunday-only after F30 moved it to Sun/Tue/Thu. F38 then
# found that the paragraph F30 left behind still asserted a hazard whose own
# stated premise had never been checked, and that the reassurance offered in
# its place ("it times out RED") was false. The pattern is the recurring one:
# a claim whose evidence could not establish it, surviving inside its own
# correction.
#
# F44 (2026-08-08) then found the SAME false claim a fourth time, restated on
# the `timeout-minutes:` key itself ("the timeout must be long enough that a
# normal queue is not an alert but an offline/saturated runner is") — one place
# over from the header F38 had just corrected, and therefore untouched by that
# correction. Fixed at the key. This is the third consecutive phase in which a
# corrected claim was found asserted again a few lines away; sweep the file
# against itself, not just the paragraph you came to fix.
# ---------------------------------------------------------------------------

name: Governance

on:
  # Daily 02:00 UTC — see the TRIGGER + RUNNER LIVENESS notes above (F5,
  # SEC-28 + SEC-31) and the SLOT + RISK ACCEPTANCE section for why F38 moved
  # this off 22:00. Dispatch is retained for on-demand and for the two
  # optional inputs, which a scheduled run leaves empty (both steps that
  # consume them are `if:`-guarded on non-empty, so the nightly runs the
  # unconditional standing controls only).
  # NO SCHEDULED TRIGGER — REMOVED 2026-08-13, DELIBERATELY, DO NOT RESTORE.
  #
  # Every workflow in this repository is now MANUAL (`workflow_dispatch`) only.
  # Three separate reasons, each independently sufficient:
  #
  #   1. THE RUNNER IS NOT A SERVICE. The self-hosted Windows runner is started
  #      by hand (`run.cmd`) and dies silently. An unserviced scheduled run
  #      QUEUES and is then reported `cancelled` — a status that alerts nobody
  #      and is indistinguishable from a deliberate cancellation. The
  #      audit-of-audits records this lane as having no green in eight runs for
  #      exactly that reason.
  #   2. A SCHEDULED RUN WEDGES CONCURRENT LOCAL WORK. PDFE's single-instance
  #      mutex is MACHINE-GLOBAL, so a scheduled job's UI E2E / render steps
  #      hold it for hours and red `ShellAndInstanceLaunchTest` in every
  #      concurrent local suite run on the same host — a false red that has been
  #      misread as a product regression in three separate phases.
  #   3. IT IS THE OWNER'S STANDING INSTRUCTION: there are to be no recurring
  #      scheduled items on this project.
  #
  # Run it deliberately instead: `gh workflow run <this file>`, after checking
  # the runner is actually online. A manual run that a human is watching is
  # worth more than a nightly one nobody reads.
  workflow_dispatch:
    inputs:
      runtime_csv:
        description: "Optional path to a UI-sweep runtime CSV to gate with --require-ran (full-sweep matrix health)."
        required: false
        default: ""
      dca_base:
        description: "Base ref for the DCA-presence check (a defect-fix range without a DCA record fails). Empty = skip."
        required: false
        default: ""

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    # 90, not 20. F5 / SEC-31 raised it on the belief that "a normal queue is
    # not an alert but an offline/saturated runner is" — the SAME false claim
    # the header used to carry, restated one place over, which is how it
    # survived F38's correction of the header. It is NOT an alerting knob: a
    # queued job does not consume `timeout-minutes` at all (F38, run
    # 30959077894: 1439 queued minutes, no timeout). It is kept at 90 purely
    # as this lane's execution ceiling. The alarm is
    # `.github/workflows/ci-liveness.yml` (F44) — see the header.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: DCA loop — every record conforms and names real tests (criterion 4)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python tools/gate/check_dca.py --repo-root .

      - name: DCA presence — a defect-fix range must add a DCA record (criterion 4)
        if: ${{ !cancelled() && (inputs.dca_base != '') }}
        shell: pwsh
        run: python tools/gate/check_dca_presence.py --base "${{ inputs.dca_base }}" --head HEAD

      - name: Mutation manifest dry-run — find-strings still present (criterion 3)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python tools/gate/mutation_kill.py --manifest tools/gate/mutants.json --dry-run

      - name: UNC gate census — every path-taking pdf_open_document is guarded (GitHub #92)
        if: ${{ !cancelled() }}
        shell: pwsh
        # PDFE refuses UNC / network-scheme inputs before handing a path to
        # MuPDF, because opening a document from an attacker-controlled network
        # location turns a parser bug into a remotely-triggered one. That
        # refusal is implemented SITE BY SITE, and until now nothing enforced
        # the pairing: a new engine, or a new open in an existing one, would
        # join the product ungated while every existing test stayed green
        # because they cover the engines that DO have the guard.
        #
        # Same class as the fz_try/RAII sweep (phase-68) — a convention that
        # holds today with nothing stopping the next call site breaking it.
        #
        # --self-test first so the lint is not decoration: it covers a guarded
        # site passing, an unguarded site failing, and — the one that matters —
        # a COMMENT mentioning the guard NOT counting as the guard. Several real
        # sites discuss the refusal in prose right next to the call, so a
        # naive matcher would credit the prose and mask a genuinely ungated
        # open. It also asserts the stream form is excluded (no path to gate)
        # and fails closed if it finds zero sites at all, which would mean the
        # census had gone inert.
        run: |
          python tests/scripts/lint_unc_gate.py --self-test
          python tests/scripts/lint_unc_gate.py --root .

      - name: Standing-control unit tests (criteria 1, 2, 3, 4)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: >
          python -m pytest
          tests/ui_automation/matrix/test_runtime_pass_semantics.py
          tests/ui_automation/test_aggregation_precedence.py
          tests/scripts/test_check_matrix_health.py
          tools/gate/test_mutation_kill_floor.py
          tools/gate/test_mutation_manifest_sweep.py
          tools/gate/test_check_dca.py
          tools/gate/test_check_dca_presence.py
          -q

      # tests/docs/test_strategy.md has described `remediation_summary.py
      # --strict` as the closeout gate for many pipelines, but until
      # p86-followups phase-6 NO workflow and NO CMake add_test invoked it. A
      # sweep found it only in docs and in its own source. It had been failing
      # the whole time: the known-weak registry stood at 52 entries against a
      # cap of 20. This step makes the full closeout gate real. It is ~40 s
      # because it shells out to three methodology lints, which is why the
      # cheap cap-only half runs per-push in fast-checks.yml instead of this.
      - name: Remediation closeout summary — --strict must exit 0 (p86 phase-6)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python tests/scripts/remediation_summary.py --strict

      - name: Live matrix-health gate (full sweep, --require-ran) — optional
        if: ${{ !cancelled() && (inputs.runtime_csv != '') }}
        shell: pwsh
        run: >
          python tests/scripts/check_matrix_health.py --repo-root .
          --runtime-csv "${{ inputs.runtime_csv }}" --require-ran
