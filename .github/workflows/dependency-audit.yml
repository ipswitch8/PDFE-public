# ---------------------------------------------------------------------------
# Dependency / SBOM audit — SEC-32 (#50) / SEC-75 (#63)
#
# Wires scripts/security/run_deps.ps1 into a dispatchable lane. Before this
# workflow existed, `run_deps.ps1` was invoked by NOTHING in CI (confirmed by
# `git grep 'scripts/security' -- .github/` finding only a comment in
# windows-fuzz.yml stating the neighbouring run_fuzz.ps1 path is never
# reached — see GitHub #145). A script that exists, is documented, and is
# reachable by nobody is the same defect shape as docs/audit/dca/0037 (a fuzz
# entry point compiled and never linked): present, unreferenced, misleading.
#
# NO `schedule:` TRIGGER — DELIBERATE, NOT A PARTIAL IMPLEMENTATION OF #50/#63.
#
# Every workflow in this repository carries the same header block (see
# windows-validation.yml, windows-fuzz.yml, windows-sanitizer.yml,
# mutation-kill.yml, macos-validation.yml, governance.yml, ci-liveness.yml —
# seven files, byte-identical reasoning) explaining why: the self-hosted
# runner is not a service and dies silently, so an unattended scheduled run
# queues, is never picked up, and is reported `cancelled` — a status that
# alerts nobody and that the audit-of-audits already recorded happening to a
# different lane for eight consecutive runs. It is also, independently, the
# owner's standing instruction that this project have NO recurring scheduled
# items.
#
# #50 and #63 both ask for a `schedule:` cron literally. Satisfying that
# literally would violate a stated, repeated, project-wide policy for the sake
# of one row — the same shape of mistake #48 warns against (satisfying a
# criterion's letter by breaking something the criterion did not anticipate).
# The dispatchable job below satisfies the substantive ask — "a workflow
# invoking run_deps.ps1 against vcpkg.json, emitting an SBOM, asserting a
# non-zero exit fails the job" (#63's own acceptance wording) — without the
# cron. See docs/audit/backlog-p82/phase-13/notes.md for the full decision
# record, which also covers a real bug this phase found and fixed in
# run_deps.ps1 itself (it was querying the wrong vcpkg installation and would
# have failed on its first real run).
# ---------------------------------------------------------------------------

name: Dependency Audit (SBOM + CVE)

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: >-
          Set to any non-empty value to overwrite tests/security/deps/baseline.json
          with the CVE IDs (CVSS >= 7.0) found by THIS run, after triaging them in
          tests/security/deps/triage.md. Leave empty for a normal audit run.
        required: false
        default: ""
      vcpkg_root:
        description: >-
          Override the vcpkg checkout used to resolve `vcpkg.exe`. Defaults to
          the VCPKG_ROOT exported by lukka/run-vcpkg below (the same variable
          windows-fuzz.yml already relies on for the same purpose).
        required: false
        default: ""

concurrency:
  # Shares nothing with windows-validation / windows-sanitizer / windows-fuzz
  # / mutation-kill's build steps -- this job never invokes cmake/cl.exe -- but
  # it does share the single self-hosted runner, so it still queues behind
  # whichever of those is running rather than colliding with it.
  group: dependency-audit
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          # clean:false, same reasoning as windows-validation.yml: this job
          # does not build, but a prior windows-validation run on this SAME
          # persistent self-hosted workspace may have left build/vs2022's
          # manifest-mode vcpkg_installed tree behind. Reusing it (best
          # effort -- see the step below) is the difference between an SBOM
          # with real transitive versions and one with declared-direct-deps
          # only. clean:true would erase that for no benefit, since this job
          # never compiles anything itself.
          clean: false

      - name: Set up vcpkg (manifest mode)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: 15e5f3820f0370f1ba7150853762cec0688cd396

      - name: Run dependency CVE audit (run_deps.ps1)
        id: run_deps
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ inputs.vcpkg_root }}"
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          Write-Host "Using VcpkgRoot: $vcpkgRoot"

          $updateBaseline = "${{ inputs.update_baseline }}" -ne ""

          # NO -InstalledDir OVERRIDE: let run_deps.ps1's own auto-detect (added
          # this phase) look for build\*\vcpkg_installed in the checked-out
          # workspace. On a runner that has ALSO run windows-validation.yml for
          # this or a recent commit, clean:false above means that tree is
          # already sitting there and this picks it up for free -- no build
          # step in THIS workflow. On a cold checkout it finds nothing, warns,
          # and falls back to declared-direct-deps-only (documented, not
          # silent -- see run_deps.ps1's own Write-Warning).
          if ($updateBaseline) {
            pwsh -File scripts/security/run_deps.ps1 -VcpkgRoot $vcpkgRoot -UpdateBaseline
          } else {
            pwsh -File scripts/security/run_deps.ps1 -VcpkgRoot $vcpkgRoot
          }
          $rc = $LASTEXITCODE
          Write-Host "run_deps.ps1 exit code: $rc"
          if ($rc -ne 0) {
            Write-Error "Dependency audit FAILED (exit $rc) -- see tests/security/reports/deps/summary.md and cves.json above."
            exit $rc
          }

      - name: Upload SBOM + CVE report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pdfe-dependency-audit-${{ github.sha }}
          path: |
            tests/security/reports/deps/sbom.spdx.json
            tests/security/reports/deps/cves.json
            tests/security/reports/deps/summary.md
            tests/security/reports/deps/osv.json
            tests/security/reports/deps/cargo_audit.json
          if-no-files-found: warn
          retention-days: 90
