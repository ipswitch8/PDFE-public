# Release-asset hygiene: every published release's assets are scanned for the
# scrub-needle inventory, and its body must name the corresponding source
# (GitHub #200 item 5).
#
# WHY A SEPARATE WORKFLOW. fast-checks.yml gates pushes; a release is not a
# push, and the artifact that matters (the signed installer) never passes
# through a push diff -- build/ is gitignored, which is how the v0.3.0
# installer reached its release page without any scanner reading a byte of it
# (closed by p100 phase-1's hand scan; this makes it standing).
#
# TRIGGERS: `release: published/edited` so the scan runs the moment assets go
# live, plus workflow_dispatch for re-scanning any historical tag. This is NOT
# a push/PR trigger: fast-checks.yml remains the only workflow gating push/PR
# -- see tools/gate/check_workflow_triggers.py, which enforces that topology.
#
# The guard fails CLOSED: a partial download, an unextractable installer
# payload, a 0-asset release, or a failed sensitivity control all fail the run
# rather than reporting a clean scan of nothing.
name: release-asset-hygiene

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to scan (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scan release assets and verify the corresponding-source offer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python tools/gate/check_release_asset_hygiene.py --self-test
          python tools/gate/check_release_asset_hygiene.py --release "$TAG"
