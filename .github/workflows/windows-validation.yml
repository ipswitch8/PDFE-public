# ---------------------------------------------------------------------------
# Windows Build Validation
#
# Runs the full pdfe_tests GoogleTest suite on a self-hosted Windows
# runner. This is the Windows counterpart to linux-validation.yml.
#
# THIS WORKFLOW DOES **NOT** GATE PUSH OR PR TO MASTER. (GitHub #187)
#
#   Until 2026-09-13 this header said it "gates push/PR to master". That has
#   been false since 2026-07-20, when the push/pull_request triggers were
#   removed to keep the single self-hosted runner free during the day (see the
#   `on:` block below — `workflow_dispatch` ONLY; the nightly schedule that
#   briefly replaced the push triggers was itself removed 2026-08-13). The
#   sentence
#   survived the change and was read as reassurance for two months: the only
#   workflow with push/pull_request triggers is fast-checks.yml.
#
#   DO NOT TAKE THAT ON TRUST — IT IS ENFORCED, AND YOU CAN RUN IT:
#
#       python tools/gate/check_workflow_triggers.py
#
#   That check parses the `on:` block of every workflow and fails if any
#   workflow outside its expected set carries push/pull_request, or if
#   fast-checks.yml loses them. It runs in the fast-checks lane, so it fires on
#   the commit that would falsify this paragraph rather than on the audit that
#   discovers it two months later.
#
#   The first correction to this header did NOT have that, and the claim-check
#   gate caught it: a truer sentence with no mechanism behind it rots exactly
#   the way the false one did. The checker also fails if this paragraph stops
#   naming it, so the claim and its enforcement cannot drift apart.
#
#   That matters because ~8 gate scripts under tools/gate/ are referenced ONLY
#   from this file. Anything reachable only from here runs nightly at best, and
#   not at all on the commit that breaks it. Each of those scripts has now been
#   dispositioned (a) wired into fast-checks.yml, or (b) deliberately left here
#   with a written reason — a real completed test/benchmark run or a compile
#   database it cannot have in a 15-minute pure-Python ubuntu lane. The table
#   is in docs/audit/p85-remaining-open/phase-1/notes.md. Before adding a new
#   gate script here, decide which group it is in and write the reason down.
#
# IMPORTANT — DLL PATH PREFIX (step "Run pdfe_tests"):
#   The test binary depends on Qt6, MuPDF, QPDF, Tesseract, FreeType,
#   HarfBuzz, etc. shipped by vcpkg. Without prepending the build
#   output dir AND the vcpkg debug/release bin dirs to PATH, the
#   binary fails to start with 0xC0000135 (STATUS_DLL_NOT_FOUND).
#   We hit this on 2026-06-05 — do not remove the PATH prefix step.
#
# IMPORTANT — NO CTEST FOR THE GTEST SUITE:
#   gtest_discover_tests' default 5s probe timeout is one the pdfe_tests
#   suite blows through during discovery, so the GoogleTest suite is NOT
#   driven through ctest — pdfe_tests.exe is invoked directly (via
#   tests/scripts/run_gtest.py, which also owns the rerun-on-failure and
#   JUnit-XML pass semantics). Do not route the gtest suite back through
#   ctest.
#
#   This does NOT extend to the security-labelled CTest entries. Those are
#   plain add_test() registrations in tests/security/CMakeLists.txt (script
#   and pytest invocations, not discovered gtests), and
#   tests/CMakeLists.txt:735 now uses DISCOVERY_TIMEOUT 30 with
#   DISCOVERY_MODE PRE_TEST, under which `ctest -C Debug -L security`
#   enumerates and runs cleanly — verified locally 2026-08-01 (5 tests
#   listed, discovery completed). See the "Run ctest -L security" step and
#   meta-audit follow-up F5 / gap SEC-23.
# ---------------------------------------------------------------------------

name: Windows Build Validation

on:
  # NO SCHEDULED TRIGGER — REMOVED 2026-08-13, DELIBERATELY, DO NOT RESTORE.
  #
  # (Until 2026-09-18 an R2-14 paragraph stood ABOVE this line describing an
  # active 04:20 UTC nightly schedule staggered after windows-fuzz. It was
  # written when that schedule existed and was left behind when the schedule was
  # deleted, so the same comment block asserted both that the workflow runs
  # nightly and that it never does — with the stale claim first, where a reader
  # stops. Deleted; GitHub #205. Nothing in the `on:` block itself changed.)
  #
  # Every workflow in this repository is now MANUAL (`workflow_dispatch`) only.
  # Three separate reasons, each independently sufficient:
  #
  #   1. THE RUNNER IS NOT A SERVICE. The self-hosted Windows runner is started
  #      by hand (`run.cmd`) and dies silently. An unserviced scheduled run
  #      QUEUES and is then reported `cancelled` — a status that alerts nobody
  #      and is indistinguishable from a deliberate cancellation. The
  #      audit-of-audits records this lane as having no green in eight runs for
  #      exactly that reason.
  #   2. A SCHEDULED RUN WEDGES CONCURRENT LOCAL WORK. PDFE's single-instance
  #      mutex is MACHINE-GLOBAL, so a scheduled job's UI E2E / render steps
  #      hold it for hours and red `ShellAndInstanceLaunchTest` in every
  #      concurrent local suite run on the same host — a false red that has been
  #      misread as a product regression in three separate phases.
  #   3. IT IS THE OWNER'S STANDING INSTRUCTION: there are to be no recurring
  #      scheduled items on this project.
  #
  # Run it deliberately instead: `gh workflow run <this file>`, after checking
  # the runner is actually online. A manual run that a human is watching is
  # worth more than a nightly one nobody reads.
  workflow_dispatch:
    inputs:
      ui_only:
        description: >-
          Comma-separated substrings; run ONLY matching UI test files for a fast
          targeted validation in the runner context (e.g. "batch1_actions,
          batch3,canvas_pyautogui"). Empty = full suite. When set, the gtest,
          matrix-health, and render-verification steps are skipped (a subset run
          can't satisfy the full-suite gates).
        required: false
        default: ""
      ui_shards:
        description: >-
          Split the UI E2E sweep into N dispatches. The full ~126-file sweep is
          ~1163 min (126 x 9.23 min measured) against ~600 usable min per job
          (720 cap minus ~100 for the cold build), so it CANNOT fit in one run
          and is killed at the cap and reported `cancelled` — a status that
          alerts nobody. The cap is PER JOB, so 3 dispatches of ~488 min each
          (100 build + 388 UI) all fit, on the ONE existing runner: they simply
          queue. Nothing is skipped — every file runs in exactly one shard, and
          the partition is cost-weighted so the 30-45 min files do not pile up.
          1 = the whole sweep in one run (the old behaviour).
        required: false
        default: "1"
      ui_shard:
        description: >-
          Which shard to run, 1-based, when ui_shards > 1. Dispatch once per
          shard. A shard index outside 1..ui_shards fails fast rather than
          silently running everything.
        required: false
        default: "1"
      publish_build_artifact:
        description: >-
          Also upload the published build as a GitHub ARTIFACT, so a DIFFERENT
          runner can restore it. Off by default, deliberately: the account's
          artifact storage quota is currently EXHAUSTED (the reporting job's
          upload fails every run with "Artifact storage quota has been hit"), so
          switching this on before the quota is freed would add a step that
          reddens every run. The local per-machine store is unaffected and stays
          the fast path. Set to any non-empty value to enable.
        required: false
        type: string
        default: ""
      reuse_published_build:
        description: >-
          Set to any non-empty value (e.g. "yes") to REUSE the build published
          by an earlier run of this same commit instead of rebuilding. Build
          once, consume in every shard. Leave EMPTY to build normally.
          Measured: the build step costs ~65 min EVERY run — actions/checkout
          defaults to clean:true, which is `git clean -ffdx`, and -x deletes the
          gitignored build/ tree, so a persistent workspace never helps. Across
          3 shards that is ~130 min of recompiling byte-identical source.
          The store is LOCAL and keyed by commit SHA, because the runtime
          closure measures 2.3 GB and there is one runner: round-tripping that
          through GitHub artifacts, to land it on the disk it came from, would
          cost more than the build it saves. It carries the runtime closure
          only (bin/ + the vcpkg DLL dirs + CTest manifests), not object files.
          The restore REFUSES a commit mismatch rather than testing one
          commit's binaries against another's source.
        required: false
        default: ""

# PHASE-77 / karen-gate finding. Both F49 steps in this workflow call the
# Actions REST API through `gh` with the ambient GITHUB_TOKEN — the readiness
# step lists runners, and the step-level unmasking step reads this run's own
# jobs. With no `permissions:` block the token gets the repository default,
# which does NOT include the Actions scope, so BOTH returned:
#
#     gh: Resource not accessible by integration (HTTP 403)
#
# on dispatched run 32237974228. That is the F49 mechanism failing in exactly
# the situation it exists for, and it had never been exercised in-run: every
# prior use was out of band with a human's `gh` credentials, which carry the
# scope implicitly. `ci-liveness.yml` already declares these; this lane simply
# never did.
#
# contents: read is restated because naming ANY permission drops every
# unnamed one to none.
permissions:
  contents: read
  actions: read

concurrency:
  group: windows-validation-${{ github.ref }}
  # Gap A1-71 (UI-HYGIENE-01): this lane is the ~9-hour full-sweep validation
  # on a SINGLE self-hosted runner. cancel-in-progress:true meant any new push
  # or dispatch killed a run that was hours in, destroying the only evidence
  # the lane produces -- and cancelling a self-hosted job mid-build is what
  # wedges the runner (see docs/audit/ui-e2e-critique.md:210). A queued second
  # run is cheap; a destroyed 9-hour run is not. Short lanes (fast-checks,
  # governance, fuzz, sanitizer) keep cancel-in-progress:true deliberately.
  cancel-in-progress: false

env:
  VCPKG_FEATURE_FLAGS: manifests,binarycaching
  VCPKG_DEFAULT_TRIPLET: x64-windows
  CMAKE_GENERATOR_PLATFORM: x64
  # Persistent LOCAL binary cache first (this self-hosted box has a stable disk),
  # then GitHub Actions cache. Once a port is built for a given ABI it is restored
  # from C:\vcpkg-bincache on every later run — no source re-download, no rebuild —
  # so the build no longer depends on upstream (e.g. codeberg/mujs) being reachable
  # on an x-gha miss. vcpkg keys the cache by exact ABI hash, so it stays hermetic.
  # Matches windows-fuzz.yml. See selfhosted runner notes / docs.
  VCPKG_BINARY_SOURCES: 'clear;files,C:\vcpkg-bincache,readwrite;x-gha,readwrite'
  # Local vcpkg ASSET (source-distfile) cache on this self-hosted box. vcpkg serves
  # a port's source archive from C:\vcpkg-assets by SHA512 before contacting the
  # authoritative URL, so an upstream forge that regenerates a tag tarball with
  # different bytes (e.g. codeberg's mujs 1.3.8, which drifted from vcpkg's pinned
  # hash) no longer breaks the build — the known-good archive is served locally.
  # Cache misses still download normally (then populate the cache). Not x-block-origin.
  X_VCPKG_ASSET_SOURCES: 'clear;x-azurl,file:///C:/vcpkg-assets,,readwrite'

jobs:

  build:
    name: build
    # Toolchain, fixtures, the RAII scan, and the debug build.
    # ROLE-ROUTED. This job COMPILES, so it must land on a machine carrying
    # the full MSVC + vcpkg toolchain. `pdfe-builder` is the additive label that
    # says so; consume-only machines deliberately do NOT carry it, so GitHub can
    # never route a build here that the machine cannot perform -- a job on the
    # wrong machine does not fail fast, it fails deep into a compile.
    #
    # ADDITIVE, AND THAT WORD IS LOAD-BEARING. This list read
    # `[self-hosted, Windows, X64, pdfe-builder]` until the phase-2 karen gate
    # pointed out that it REPLACED `pdfe-windows` rather than adding to it. The
    # phase's own description asks for "ADDITIVE labels that never remove
    # today's working set", and dropping the base label also quietly widened
    # eligibility: a machine labelled only [self-hosted, Windows, X64,
    # pdfe-builder] would have matched, losing the pdfe-windows guarantee every
    # other job in this lane still relies on. Both labels are required now.
    #
    # WHAT THIS STILL DOES NOT SATISFY, stated rather than glossed: phase-2's
    # criterion 3 also asks that a runner carrying ONLY the four base labels
    # satisfy every job with no relabeling. That is not achievable together with
    # role routing -- routing by role means a distinguishing label, and a
    # distinguishing label is by definition one a four-label runner lacks. The
    # live runner pdfe-runner-01 was therefore given `pdfe-builder` via the runners
    # API, additively and with NO re-registration, so continuity held in
    # practice. See docs/audit/multi-runner-progress.md for the trade-off
    # against the alternative (no role label, plus a fail-fast toolchain
    # preflight), which detects a misroute instead of preventing it.
    runs-on: [self-hosted, Windows, X64, pdfe-windows, pdfe-builder]
    # 180 -> 480. THE OLD VALUE COULD NOT FIT THIS JOB'S OWN WORK, and the way it
    # failed was the worst available: `cancelled`, which this file's own `on:`
    # block notes "alerts nobody" and which MASKS every red step underneath it.
    #
    # MEASURED, runs 37093827678 and 37103925654 (2026-10-03), both killed at
    # exactly 3h00m:
    #
    #   checkout + setup                      ~4 min
    #   Configure (vcpkg deps), cache WARM   ~12 min
    #   Configure (vcpkg deps), cache COLD  >170 min  <-- run 1 died here, 42/47
    #   fz_try / RAII AST scan                43 min
    #   Page-load guard AST scan              71 min
    #   Build app + tests                    >50 min  <-- run 2 died here
    #
    # So even on a WARM cache the mandatory path is ~180 min before a single test
    # runs: the two clang AST scans alone are 114 min, and they are in this job
    # deliberately (page_load_guard_scan finds 9 of its 14 call sites only through
    # macro expansion, which the lexical scanner cannot see by construction).
    # A cold cache — which #272 shows is sometimes unavoidable, and which the
    # 2026-10-02 runner relocation produced — adds ~170 min more.
    #
    # 480 covers cold-configure + both scans + build with margin, and stays well
    # inside the 720-minute per-job platform cap that the ui_shards partition is
    # already sized against. It is NOT the cap itself: a job that overruns 8 hours
    # is wedged rather than slow, and should still be killed.
    timeout-minutes: 480
    # Exposed as OUTPUTS, not merely as this job's result. A consumer
    # needs to know WHICH of build-vs-restore succeeded, because the
    # skipped one reports `skipped` -- collapsing both into
    # needs.build.result would lose exactly the distinction that stops
    # a restored run from silently skipping every downstream control.
    outputs:
      built: ${{ steps.build_debug.outcome }}
      restored: ${{ steps.restore_build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Set up vcpkg (manifest mode)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: 15e5f3820f0370f1ba7150853762cec0688cd396

      - name: Operational readiness (manual submit) — F49
        # Deferred-backlog F49, follow-up phase-66. Runs ONLY on a manual
        # submit, which is the only way this workflow starts (there is no
        # schedule: trigger, deliberately — see the header).
        #
        # WHY THIS IS FAIL-FAST AND NOT A NEW BLOCKER. The only enforced tool
        # here is OpenCppCoverage, whose absence the coverage step below already
        # treats as "a HARD error (fail the job)". That step is ~100 minutes of
        # cold vcpkg build away. Failing here is the SAME failure, roughly two
        # hours earlier. It was step 15 of run 31359621883.
        #
        # STATED LIMITATION, because it would otherwise read as more than it is:
        # the runner-online half is near-tautological HERE — this step is
        # executing on the runner, so of course one is online. Its real use is
        # BEFORE submitting, from a developer's shell:
        #     python tools/gate/check_ci_readiness.py readiness --repo <owner/repo>
        # In-run it still records WHICH runner took the job and whether the
        # others are offline or busy, which is worth having in the summary.
        #
        # NOTHING HERE INSTALLS OR REGISTERS THE F46 RUNNER AUTOSTART.
        # tools/ops/register_runner_service.ps1 and runner_watchdog.ps1 stay
        # unregistered by the owner's explicit direction (governance.yml, header
        # note "THE ACTUAL DETECTION MECHANISM", crash/logout bullet: "Registering
        # that on the live host is a USER action").
        # This step is the alternative that was asked for instead: it does not
        # make unattended runs work, it makes a manual submit say immediately
        # that it would not have worked.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$env:GITHUB_WORKSPACE\tools\gate\check_ci_readiness.py" readiness `
            --repo "$env:GITHUB_REPOSITORY"
          exit $LASTEXITCODE

      - name: Fetch CNN font_embedder.onnx model
        # The CNN font re-ranker uses font_embedder.onnx (~44 MB,
        # gitignored). Without it the POST_BUILD step in tests/
        # CMakeLists.txt skips deploying the model, modelAvailable()
        # returns false, and 4 CNNFontClassifierTest cases SKIP.
        # Fetched from the project's "assets-v1" release where the
        # model lives as an attached asset. SHA256 verified.
        #
        # This repo is private — anonymous download from
        # github.com/.../releases/download/... returns 404. The
        # GitHub REST API asset endpoint accepts the workflow's
        # GITHUB_TOKEN as a Bearer token and returns the binary
        # when Accept: application/octet-stream is set.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expected = "476a74328a45b23245949ab9e1f4a205c61f7b6e83b17330b8b35a17d7d32b46"
          $dest = "$env:GITHUB_WORKSPACE\models\font_embedder.onnx"
          if (Test-Path $dest) {
            $h = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
            if ($h -eq $expected) {
              Write-Host "Model already present and SHA matches: $dest"
              return
            }
            Write-Host "Existing model SHA mismatch ($h), redownloading"
            Remove-Item $dest -Force
          }
          New-Item -ItemType Directory -Path (Split-Path $dest) -Force | Out-Null

          # RESOLVED BY NAME, NOT BY A HARD-CODED ASSET ID.
          #
          # This used to read `$assetId = 440223541`, with a comment explaining
          # that replacing the model meant editing the id and the SHA together.
          # An asset id is stable for a given UPLOAD -- and nothing more. It does
          # not survive re-uploading the same bytes, and it does not survive the
          # release being recreated. A hard-coded id is therefore a dependency on
          # an accident of history, and its failure mode is a 404 midway through
          # the build that reads as "the model is gone" rather than "the id
          # moved".
          #
          # `assets-v1` + `font_embedder.onnx` is the identity that actually
          # means something and is stable across any re-upload. The SHA-256 check
          # below is unchanged and remains the real control: resolving by name
          # decides WHICH bytes to fetch, and the hash decides whether to trust
          # them.
          #
          # `gh` is not guaranteed to be on the runner's PATH (verified: run
          # 27066959150 failed with "term 'gh' not recognized"), so this uses
          # raw Invoke-WebRequest with the workflow's GITHUB_TOKEN throughout.
          $hdr = @{
            "Authorization"        = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $relUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/assets-v1"
          $rel = Invoke-RestMethod -Uri $relUrl -UseBasicParsing -Headers ($hdr + @{ "Accept" = "application/vnd.github+json" })
          $asset = @($rel.assets | Where-Object { $_.name -eq 'font_embedder.onnx' })
          if ($asset.Count -ne 1) {
            throw "expected exactly one 'font_embedder.onnx' asset on release 'assets-v1', found $($asset.Count). Available: $(($rel.assets | ForEach-Object { $_.name }) -join ', ')"
          }
          $apiUrl = $asset[0].url
          Write-Host "Resolved font_embedder.onnx to asset id=$($asset[0].id) on release assets-v1"
          Invoke-WebRequest -Uri $apiUrl -OutFile $dest -UseBasicParsing `
            -Headers ($hdr + @{ "Accept" = "application/octet-stream" })
          $actual = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "font_embedder.onnx SHA256 mismatch: expected $expected, got $actual"
          }
          Write-Host "Model downloaded and SHA verified: $dest"

      - name: Generate image-PDF test fixtures (a3_*.pdf + b3_*.pdf)
        # tests/fixtures/image_pdf/ has a local .gitignore with *.pdf,
        # so a3_*.pdf and b3_*.pdf are not in git. They are produced
        # deterministically by gen_fixtures.py (seeded RNG). Without
        # this step, 3 SourceImageDpi + 6 B3BgClassification tests
        # SKIP because the iterated fixture filenames don't exist.
        #
        # Dependencies are pinned via requirements.txt (pip-compile
        # --generate-hashes) and verified with --require-hashes — a
        # supply-chain attack on PyPI for pymupdf or Pillow cannot
        # smuggle code into this self-hosted runner without breaking
        # the hash check.
        shell: pwsh
        run: |
          Write-Host "Installing pinned pymupdf + Pillow for fixture generation"
          python -m pip install --quiet --upgrade pip
          $req = "$env:GITHUB_WORKSPACE\tests\fixtures\image_pdf\requirements.txt"
          python -m pip install --quiet --require-hashes -r $req
          $script = "$env:GITHUB_WORKSPACE\tests\fixtures\image_pdf\gen_fixtures.py"
          Write-Host "Running $script"
          python $script
          $produced = Get-ChildItem "$env:GITHUB_WORKSPACE\tests\fixtures\image_pdf" -Filter "*.pdf"
          Write-Host "Generated $($produced.Count) fixture PDFs:"
          $produced | ForEach-Object { "  $($_.Name) ($([math]::Round($_.Length/1KB,1)) KB)" }
          # Sanity-check the specific fixtures the failing tests need.
          $required = @(
            "a3_72dpi_web_letter.pdf",
            "a3_mixed_dpi_5page.pdf",
            "b3_uniform_white_300dpi.pdf",
            "b3_yellowed_news_300dpi.pdf",
            "b3_halftone_news_200dpi.pdf",
            "b3_halftone_news_600dpi.pdf",
            "b3_textured_gray_300dpi.pdf"
          )
          foreach ($f in $required) {
            $p = "$env:GITHUB_WORKSPACE\tests\fixtures\image_pdf\$f"
            if (-not (Test-Path $p)) {
              throw "Required fixture missing after generation: $f"
            }
          }
          Write-Host "All required fixtures present."

      - name: Fetch ONNX Runtime pre-built SDK
        # ONNX Runtime is too large to build from source via vcpkg
        # (see top of CMakeLists.txt), so the project loads it from
        # external/onnxruntime-win-x64-1.20.1/. That directory is in
        # .gitignore and absent on a fresh checkout — without it,
        # PDFE_HAS_ONNXRUNTIME is OFF and the CNN font re-ranker is
        # disabled, which fails DllDependencyTest.OnnxRuntimePresent.
        #
        # HASH-PINNED (GitHub #72, #73). This step used to decide entirely on
        # EXISTENCE -- `Test-Path lib\onnxruntime.lib` to skip, and an unverified
        # Invoke-WebRequest to fetch. Both halves were wrong in the same way:
        # nothing established WHICH bytes were being linked into the product.
        # A tampered or truncated archive, or a pre-existing tampered tree left
        # by an earlier job on this self-hosted runner, satisfied the probe
        # exactly as well as the real SDK did.
        #
        # Now the archive's SHA256 is checked before extraction, and the
        # extracted import library's SHA256 is checked as well -- so the
        # "already present" fast path is a verification rather than a guess.
        # Both hashes were taken from the release artifact and cross-checked
        # against the copy already in use, so pinning cannot change behaviour.
        shell: pwsh
        run: |
          $version = "1.20.1"
          $zipSha  = "78d447051e48bd2e1e778bba378bec4ece11191c9e538cf7b2c4a4565e8f5581"
          $libSha  = "c5a4f0b1af1e8f1edd11391e1a15a7d52832d94a1a67cf6b8f22ed29f863a06c"
          $dest = "$env:GITHUB_WORKSPACE\external\onnxruntime-win-x64-$version"
          $lib  = "$dest\lib\onnxruntime.lib"

          $present = $false
          if (Test-Path $lib) {
            $h = (Get-FileHash $lib -Algorithm SHA256).Hash.ToLower()
            if ($h -eq $libSha) {
              Write-Host "ONNX Runtime already present at $dest (SHA256 verified)"
              $present = $true
            } else {
              # NOT a warning to be stepped over: the tree on disk is not the
              # SDK we pinned. Discard it and refetch rather than link it.
              Write-Host "ONNX Runtime present at $dest but onnxruntime.lib SHA256 does not match the pin (got $h); discarding and refetching."
              Remove-Item $dest -Recurse -Force
            }
          }

          if (-not $present) {
            $url = "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-win-x64-$version.zip"
            $zip = "$env:RUNNER_TEMP\onnxruntime.zip"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

            $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $zipSha) {
              Remove-Item $zip -Force
              throw "onnxruntime-win-x64-$version.zip SHA256 mismatch: expected $zipSha, got $actual"
            }
            Write-Host "Archive SHA256 verified."

            $extractRoot = "$env:GITHUB_WORKSPACE\external"
            New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
            Expand-Archive -Path $zip -DestinationPath $extractRoot -Force
            Remove-Item $zip
            if (-not (Test-Path $lib)) {
              throw "ONNX Runtime extraction failed: $lib not found"
            }
            $h = (Get-FileHash $lib -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $libSha) {
              throw "onnxruntime.lib SHA256 mismatch after extraction: expected $libSha, got $h"
            }
            Write-Host "Extracted ONNX Runtime to $dest (SHA256 verified)"
          }

      - name: Configure (windows-vs2022 preset)
        # PDFE_ENABLE_SECURITY_TESTS=ON (meta-audit follow-up F5, gap SEC-23).
        #
        # THE GAP THIS CLOSES: `grep -rn PDFE_ENABLE_SECURITY_TESTS
        # .github/workflows/` returned ZERO before this change, and the option
        # defaults OFF, so tests/security/CMakeLists.txt was never reached by
        # ANY lane — `ctest -L security` ran nowhere in CI and the whole
        # security-labelled suite was opt-in-and-never-opted-in.
        #
        # WHY THIS LANE: windows-validation is the only lane that already
        # configures the standard windows-vs2022 preset, builds Debug, and runs
        # nightly on the self-hosted host where pwsh + python are present —
        # the four security entries need exactly that. The sanitizer and fuzz
        # lanes use different presets/triplets and already carry long runtimes.
        #
        # RUNTIME COST — deliberate and bounded. `ctest -C Debug -L security`
        # selects exactly 5 tests (verified locally 2026-08-01):
        #   security_verify_optin            TIMEOUT  60 s
        #   security_runner_decision_unit    TIMEOUT  60 s
        #   security_runner_listener_unit    TIMEOUT 120 s
        #   security_runner_firewall_log_unit TIMEOUT 60 s
        #   security_regression_check        TIMEOUT 600 s
        # Worst case 900 s = 15 min on a job whose timeout is hours. That is
        # why this lane was chosen rather than adding a new one.
        #
        # NOTE: the flag is passed ON TOP of the preset rather than added to
        # CMakePresets.json, so a developer's `cmake --preset windows-vs2022`
        # keeps the documented OFF-by-default opt-in posture
        # (docs/security-testing.md section (b)); only CI opts in.
        shell: pwsh
        run: |
          cmake --preset windows-vs2022 -DPDFE_ENABLE_SECURITY_TESTS=ON

      - name: vcpkg package CONTENTS match the committed manifest (GitHub #177)
        # THIS IS THE CONTENTS CHECK, not the configuration one. Its sibling
        # tools/gate/check_vcpkg_binary_sources.py asserts WHICH STORES are in
        # the chain and says nothing about what is inside them -- a poisoned
        # entry in an approved store passes it. That was #177's residual and the
        # reason phase-2's validator gate failed.
        #
        # This step closes it: every file vcpkg installed is hashed and compared
        # against docs/security/vcpkg-cache-manifest.json, generated from a
        # trusted FROM-SOURCE build. A poisoned cache entry changes bytes and is
        # caught. Not circular: the manifest is committed and reviewed, so an
        # attacker who can write the cache cannot also change it without a PR.
        #
        # It runs HERE, straight after configure, because configure is what
        # restores packages from the binary cache -- checking earlier would
        # inspect nothing, and checking after the build would let a poisoned
        # package be linked before anyone objected.
        #
        # ONLY MEANINGFUL UNDER THE DETERMINISTIC TRIPLET. Ordinary MSVC output
        # is not byte-stable (a per-link random CodeView GUID plus a wall-clock
        # timestamp: measured at 19 differing bytes between two identical
        # links), so a hash manifest over a stock x64-windows tree would red
        # constantly. tools/vcpkg-triplets/x64-windows-repro.cmake removes both;
        # with it, two from-source builds of the probe set matched 24/24 on
        # every linked artifact. The checker refuses (exit 2) if the tree was
        # built with a different triplet, rather than reporting a verdict it
        # cannot support.
        if: ${{ !cancelled() }}
        shell: pwsh
        # Self-test first, so a checker that can no longer say NO fails here
        # rather than passing vacuously over the real tree.
        run: |
          python tools/gate/vcpkg_cache_manifest.py --self-test
          python tools/gate/vcpkg_cache_manifest.py --verify `
            --install-root build/vs2022/vcpkg_installed

      - name: fz_try / RAII boundary scan (AST, not grep) — phase-68
        # F44/F46 GUARD: `!cancelled()` and NOT the implicit success(). This is a
        # CHECK step, and it had no `if:` at all -- so GitHub's implicit
        # success() meant any earlier red step SKIPPED it, and a skipped check
        # reports `skipped`, not `failure`. That is the step-skip masking class
        # this lane's whole guard convention exists to remove, sitting in the
        # lane itself. It depends on nothing but the checkout, so it should run
        # whenever the job is still alive.
        if: ${{ !cancelled() }}
        # WHAT THIS CATCHES that nothing else does: a local with a non-trivial
        # destructor declared inside an fz_try block or inside a
        # MuPdfContext::execute/executeReturn lambda body, and a C++ `throw`
        # raised in either. MuPDF reports errors by longjmp, so neither has any
        # observable effect on a passing test — the destructor simply never
        # runs, and the pushed error frame is never popped. No assertion in the
        # 5700-test suite can see it.
        #
        # WHY IT IS A SEPARATE STEP AND NOT ONLY A GTEST CASE: the gtest case
        # (FzTryRaiiBoundary.*) scans the six files this phase repaired, which
        # keeps the suite fast. This step scans ALL of src/ against the
        # committed baseline, which is the part that catches a hazard in a file
        # nobody has touched yet.
        #
        # The baseline records the hazards that exist and were NOT repaired, so
        # this fails on NEW ones only. Regenerate deliberately with
        # `--update-baseline` and say why in the commit message; do not
        # regenerate to make a red step green.
        #
        # continue-on-error is NOT set. A new hazard is a real finding.
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check libclang
          # The compile database is a Ninja/clang-cl artifact; the vs2022
          # preset (MSBuild) cannot emit one, so the asan preset is configured
          # for its compile_commands.json ONLY -- nothing is built from it.
          #
          # VCPKG_INSTALLED_DIR points at the tree the preceding "Configure
          # (windows-vs2022 preset)" step already populated, and manifest
          # install is off, so this does NOT trigger a second vcpkg
          # installation. Both presets use the x64-windows triplet, and this
          # step never links, so sharing the installed tree between MSBuild/cl
          # and Ninja/clang-cl is safe here.
          cmake --preset windows-vs2022-asan `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/build/vs2022/vcpkg_installed"
          python "$env:GITHUB_WORKSPACE\tools\gate\fz_try_raii_scan.py" `
            --compile-commands "build/vs2022-asan/compile_commands.json" `
            --baseline "tools/gate/fz_try_raii_baseline.json" `
            --json "$env:GITHUB_WORKSPACE\fz-try-raii-scan.json"
          if ($LASTEXITCODE -ne 0) {
            throw "fz_try/RAII boundary scan reported a NEW hazard (or failed to parse a translation unit). See the listing above."
          }

      - name: Page-load guard call-site scan (AST, not lexical) — GitHub #176 F14
        # WHAT THIS REPLACES/AUGMENTS. tests/test_page_load_guard_sites.cpp is a
        # lexical scan (strip comments/strings, whole-identifier substring
        # match) that re-derives the fz_load_page/pdf_load_page and
        # safeLoadPage/safeLoadPdfPage call-site lists on every gtest run. It
        # says plainly in its own header that it cannot see a macro-wrapped
        # call or a call through a function pointer, and that its guarded-site
        # floor was once padded by two because a substring match cannot tell a
        # declaration from a call (FormXObjectDepthGuard.h's two prototypes
        # looked like call sites). tools/gate/page_load_guard_scan.py answers
        # both gaps from the compiler's own AST, reusing the compile_commands
        # infrastructure the fz_try/RAII scan above already established, and
        # asserts its AST count is never LOWER than a from-scratch Python port
        # of the lexical .cpp scan() run over the same tree.
        #
        # Depends only on the asan-preset configure two steps up, which this
        # job already pays for -- no second cmake configure here.
        #
        # The self-test runs first and needs neither the compile_commands.json
        # nor real MuPDF headers -- its fixtures forward-declare their own
        # fz_context/fz_document/fz_page stand-ins -- so a regression in the
        # scanner's OWN mechanism (declaration-vs-call, macro expansion,
        # function-pointer aliasing) is caught before the real-tree number is
        # ever trusted.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\tools\gate\test_page_load_guard_scan.py"
          if ($LASTEXITCODE -ne 0) {
            throw "page_load_guard_scan self-test failed -- the scanner's own mechanism is broken, its src/ count means nothing until this is green again."
          }
          python "$env:GITHUB_WORKSPACE\tools\gate\page_load_guard_scan.py" `
            --compile-commands "build/vs2022-asan/compile_commands.json" `
            --json "$env:GITHUB_WORKSPACE\page-load-guard-scan.json"
          if ($LASTEXITCODE -ne 0) {
            throw "Page-load guard AST scan failed: either the AST count regressed below the lexical scanner's count, or a translation unit could not be parsed. See the listing above."
          }

      - name: Probe for a LOCAL published build (is this a warm machine?)
        id: restore_probe
        # Split out so the artifact download below can be conditional on it.
        # With 2-4 runners a job may land on a machine that has never built this
        # commit -- the "cold machine" case the local-only store could not serve.
        if: ${{ !cancelled() && inputs.reuse_published_build != '' }}
        shell: pwsh
        run: |
          $store = "C:\pdfe-build-store\$env:GITHUB_SHA"
          $hit = Test-Path (Join-Path $store 'published-sha.txt')
          Write-Host ("local store for {0}: {1}" -f $env:GITHUB_SHA, $(if ($hit) { "HIT" } else { "MISS (cold machine)" }))
          "local_hit=$($hit.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Locate the artifact-published build for this commit
        id: find_build_artifact
        # WHY THIS STEP EXISTS. actions/download-artifact@v4 scopes artifacts
        # PER RUN: with no `run-id` it searches only the CURRENT run. The
        # publish happens in the `release` job -- after this `build` job -- so
        # a same-run lookup is not merely empty, it is chronologically
        # impossible. Without this step the cross-machine path is inert and
        # fails closed on every run, which is exactly what a security-audit
        # gate found after two other gates had passed the wiring as
        # self-consistent.
        #
        # THE LOOKUP IS ITSELF ATTACK SURFACE, so it is constrained rather than
        # trusting the artifact name alone. An artifact is accepted only if:
        #   * its name is exactly pdfe-build-<this commit>
        #   * it has not expired
        #   * the run that produced it has head_sha == this commit
        #   * it is not fork-originated (repository_id == head_repository_id)
        #   * that run is THIS workflow file, not some other workflow in the
        #     repo that happened to upload a same-named artifact
        # The newest surviving candidate wins. Anything else is ignored, and
        # finding nothing leaves run_id empty so the download below is skipped
        # and the build proceeds normally -- fail-closed, never fail-open.
        if: ${{ !cancelled() && inputs.reuse_published_build != '' && steps.restore_probe.outputs.local_hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $want = "pdfe-build-$env:GITHUB_SHA"
          $runId = ""
          try {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" 2>$null | ConvertFrom-Json
            $cands = @($json.artifacts | Where-Object {
              $_.name -eq $want -and
              -not $_.expired -and
              $_.workflow_run -and
              $_.workflow_run.head_sha -eq $env:GITHUB_SHA -and
              $_.workflow_run.repository_id -eq $_.workflow_run.head_repository_id
            } | Sort-Object { [datetime]$_.created_at } -Descending)

            foreach ($c in $cands) {
              $rid = $c.workflow_run.id
              $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$rid" 2>$null | ConvertFrom-Json
              if ($run -and $run.path -eq ".github/workflows/windows-validation.yml") {
                $runId = "$rid"
                Write-Host "accepted artifact '$want' from run $rid (head_sha and workflow verified)"
                break
              }
              Write-Host "  rejected run $rid -- produced by $($run.path), not this workflow"
            }
            if (-not $runId) {
              Write-Host "no artifact named '$want' passed every constraint; the build will proceed normally."
            }
          } catch {
            Write-Host "artifact lookup failed (non-fatal, will build): $($_.Exception.Message)"
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Fetch the published build from ARTIFACTS (cold machine only)
        # Only when the local store missed. Populates exactly the same directory
        # the local publish writes, so the verification step below is UNCHANGED
        # and every refusal it enforces -- no marker, wrong commit, incomplete,
        # nothing published -- applies identically to an artifact-sourced store.
        # That is the point of splitting it this way rather than teaching the
        # verifier a second source it would have to be re-proved against.
        if: ${{ !cancelled() && inputs.reuse_published_build != '' && steps.restore_probe.outputs.local_hit != 'true' && steps.find_build_artifact.outputs.run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pdfe-build-${{ github.sha }}
          path: C:\pdfe-build-store\${{ github.sha }}
          # run-id + github-token are what make this CROSS-RUN. Without them v4
          # searches the current run only, and the whole cross-machine path is
          # inert -- see the lookup step above.
          run-id: ${{ steps.find_build_artifact.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Restore the published build for this commit (build once, reuse in shards)
        id: restore_build
        # F46 PRODUCER-GUARD DECISION: DEPENDENT, deliberately, on one input and
        # nothing else. This step is named by eleven consumers, so its guard
        # decides whether they run -- which is precisely why F46 requires the
        # decision to be stated here rather than inferred.
        #
        # `!cancelled()` and NOT success(): an earlier red step must not silently
        # turn a requested restore into a skip, because a skipped restore makes
        # every build step run instead, and the run then reports green having
        # quietly ignored what it was asked to do.
        #
        # The `inputs.reuse_published_build != ''` term is the whole feature:
        # default behaviour is unchanged (build from scratch), and reuse happens
        # only when a human asks for it. It is NOT dependent on any build step --
        # depending on a build to decide whether to skip the build is circular.
        #
        # Consumers do NOT gate on this step succeeding. They accept
        # `build_X success OR restore_build success`, because a skipped build
        # reports `skipped`, and a consumer gated on the build alone would skip
        # on a successful restore -- running none of gtest / parity / coverage /
        # security / render while reporting green. That is the F44/F46 masking
        # class arriving through an optimisation, and it is asserted statically
        # by tools/gate/check_build_reuse_guards.py and behaviourally by
        # tools/gate/test_build_reuse_roundtrip.py.
        if: ${{ !cancelled() && inputs.reuse_published_build != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # WHY A LOCAL STORE RATHER THAN A GITHUB ARTIFACT.
          #
          # Measured on this runner, the runtime closure is 2.3 GB:
          #     bin\Debug                             791 MB
          #     vcpkg_installed\x64-windows\bin       535 MB
          #     vcpkg_installed\...\debug\bin         981 MB
          # Uploading that to GitHub and downloading it again per shard means
          # ~2.3 GB out plus 2.3 GB back for each consumer — to land it on the
          # SAME DISK it came from, because there is exactly one runner and all
          # shards execute on it. That costs more than the 65-minute build it
          # was meant to save.
          #
          # So the "publish" is a local store keyed by commit SHA. Same
          # semantics — build once, consume in every shard — with a store that
          # matches the actual topology. When a SECOND runner exists the shards
          # land on different machines and this no longer works; at that point
          # publish the same closure as a real artifact (or to a share), and
          # note the 2.3 GB is what that will cost per shard.
          $dest = "$env:GITHUB_WORKSPACE\build\vs2022"
          $store = "C:\pdfe-build-store\$env:GITHUB_SHA"
          Write-Host "Looking for a build published for commit $env:GITHUB_SHA"

          if (-not (Test-Path $store)) {
            Write-Error "no published build at $store for this commit. Run this workflow once WITHOUT reuse_published_build to publish one, then reuse it."
            exit 1
          }

          # REFUSE A COMMIT MISMATCH. The store is keyed by SHA, so a wrong-
          # commit reuse cannot happen by construction — but the marker is
          # checked anyway, because "keyed by SHA" is an assumption about a
          # directory name and this is the one failure that would make every
          # downstream test green against code that is not under test.
          $marker = Join-Path $store 'published-sha.txt'
          if (-not (Test-Path $marker)) {
            Write-Error "$store has no published-sha.txt marker; refusing to trust it."
            exit 1
          }
          $publishedSha = (Get-Content $marker -Raw).Trim()
          if ($publishedSha -ne "$env:GITHUB_SHA") {
            Write-Error "store says it was built from $publishedSha but this run is $env:GITHUB_SHA. Refusing to test one commit's binaries against another commit's source."
            exit 1
          }

          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Write-Host "Restoring from $store"
          Copy-Item "$store\*" $dest -Recurse -Force

          # Prove the restore produced what the later steps actually consume,
          # rather than reporting success for an empty directory.
          $needed = @(
            "$dest\bin\Debug\pdfe_tests.exe",
            "$dest\bin\Debug\pdfe.exe",
            "$dest\bin\Release\pdfe.exe"
          )
          $missing = @($needed | Where-Object { -not (Test-Path $_) })
          if ($missing) {
            Write-Error "restore incomplete - missing: $($missing -join ', ')"
            exit 1
          }
          foreach ($f in $needed) { Write-Host ("  ok {0,-12} {1}" -f ((Get-Item $f).Length), $f) }
          "$env:GITHUB_SHA" | Out-File -FilePath (Join-Path $dest '.pdfe-commit') -Encoding ascii
          Write-Host "Build tree restored; the build steps below will be skipped."

      - name: Build app + tests (debug-vs2022 preset)
        # F44: `id:` added so the nine formerly-masked steps below can name this
        # step as their PRODUCER instead of relying on GitHub's implicit
        # success() (which conflates "my build is missing" with "some unrelated
        # earlier step went red").
        id: build_debug
        # F46 PRODUCER-GUARD DECISION — UNCONDITIONAL (`!cancelled()`).
        # F44 gave the nine consumers a producer term but left this step with no
        # `if:`, so GitHub's implicit success() applied HERE: any red above —
        # fixture generation, the ONNX SDK fetch, the model fetch, the vcpkg
        # cache export — SKIPPED this build, which made `outcome == 'skipped'`
        # and skipped all six of its consumers. The masking was not removed, it
        # was relocated into the producer. This guard is what actually removes
        # it, and it is the reason the "Run pdfe_tests" comment below is true.
        # WHY UNCONDITIONAL rather than a `steps.configure.outcome` term: the
        # only step this build genuinely needs is Configure, and if Configure
        # failed there is no build tree, so `cmake --build --preset` errors out
        # in seconds. A loud second red that names the real cause is strictly
        # better than a silent skip that deletes six downstream controls; the
        # wasted runtime is negligible because nothing is built.
        #
        # The added `restore_build` term does NOT weaken this. It skips the
        # build only when a restore RAN AND SUCCEEDED — i.e. the binaries this
        # step would have produced already exist, verified present and verified
        # to come from this exact commit. A failed or skipped restore leaves the
        # term false and the build runs, so the F46 guarantee (a red upstream
        # cannot silently skip the six controls downstream) is intact.
        if: ${{ !cancelled() && steps.restore_build.outcome != 'success' }}
        # Builds the GUI application (PDFE.exe) and, for full runs, the headless
        # gtest binary (pdfe_tests). For a targeted UI subset run (ui_only),
        # gtest is skipped (see the "Run pdfe_tests" step), so building the large
        # pdfe_tests binary is pure overhead — build ONLY the pdfe app target,
        # which cuts most of the build time. The pdfe target's own POST_BUILD
        # deploys its Qt plugins (platform/imageformats/TLS), so the app is fully
        # functional without pdfe_tests being built.
        shell: pwsh
        run: |
          # The `!cancelled()` guard above is deliberate (F46): it stops a red
          # anywhere upstream from SKIPPING this build and thereby silently
          # skipping six downstream controls. The documented cost is that this
          # step can run with its prerequisites missing and go red for a reason
          # that is not its own.
          #
          # On dispatched run 32237974228 that cost was paid and the message was
          # useless: "Set up MSVC environment" had been skipped, so the failure
          # read `cmake: not recognized`, which looks like a broken toolchain
          # install rather than a cascade. Keep the guard -- reverting it would
          # restore the masking F46 removed -- but say WHY, so the second red
          # names the first one instead of impersonating a new problem.
          # NB: no PowerShell here-string (@"..."@) here. Its body and closing
          # token must sit at column 0, which drops below this YAML block
          # scalar's indentation and silently ENDS the block -- it made the
          # whole workflow unparseable, and GitHub's only symptom was a 422
          # "Workflow does not have 'workflow_dispatch' trigger" on dispatch.
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            Write-Host "cmake is not on PATH, so this build cannot start."
            Write-Host "This is almost certainly a CASCADE, not a toolchain problem:"
            Write-Host "'Set up MSVC environment' provides cmake, and it is skipped"
            Write-Host "whenever an earlier step goes red. Look at the FIRST red step"
            Write-Host "in this job, not this one -- this step runs unconditionally by"
            Write-Host "design (F46) so that a red upstream cannot silently skip the"
            Write-Host "six controls downstream of it."
            Write-Error "cmake not found; see the cascade note above."
            exit 1
          }
          $targets = if ("${{ inputs.ui_only }}") { @('pdfe') } else { @('pdfe_tests','pdfe') }
          Write-Host "Building Debug targets: $($targets -join ', ')"
          cmake --build --preset debug-vs2022 --target $targets --parallel 4
          # Stamp the tree with the commit it was built from. The
          # ensure-build-tree probe refuses a workspace tree whose
          # stamp does not match, which is what stops a consume-only
          # machine testing this commit's source against the binaries
          # a PREVIOUS commit left in its persistent workspace.
          "$env:GITHUB_SHA" | Out-File -FilePath "$env:GITHUB_WORKSPACE\build\vs2022\.pdfe-commit" -Encoding ascii

      - name: Publish the DEBUG closure for cross-machine consumers
        id: publish_debug
        # F46 PRODUCER-GUARD DECISION — DEPENDENT, on having actually built.
        # It is a producer because the artifact upload below names it, so the
        # decision has to be stated here rather than inferred.
        #
        # Dependent and NOT unconditional, for two independent reasons: with no
        # successful Debug build there is nothing to publish, and publishing
        # from a run that itself RESTORED would rewrite the store from a copy of
        # itself. `!cancelled()` rather than implicit success(), so an unrelated
        # red above cannot silently turn the publish into a skip -- the next
        # run's restore would then find nothing and nobody would know why.
        #
        # WHY A SECOND, DEBUG-ONLY STORE rather than reusing the full one the
        # `release` job publishes. `core-tests` declares `needs: [build]` and so
        # runs CONCURRENTLY with `release` -- the full closure does not exist yet
        # when core-tests starts, and adding `needs: [release]` would serialise
        # the two longest jobs for no reason other than to satisfy a store key.
        # So the producer of the Debug binaries publishes them itself, at the
        # moment they exist.
        #
        # The key is SUFFIXED (`<sha>-debug`) precisely so it cannot be confused
        # with the full closure: a consumer that needs bin\Release must not be
        # able to satisfy its completeness check against a store that never
        # contained it.
        #
        # Non-fatal, like the full publish: a validation lane must not go red
        # because a cache write did not work. The consequence of a failed write
        # surfaces later as a LOUD refusal in ensure-build-tree, never as a
        # false green now.
        #
        # EXCLUDES RESTORED RUNS (`steps.restore_build.outcome != 'success'`),
        # like the full publish and for the same reason: republishing a store
        # from a copy of itself is at best a no-op and at worst rewrites a good
        # store from a partially-verified restore. check_build_reuse_guards.py
        # rule 1 caught the first version of this step, which named a build
        # outcome without either term.
        if: ${{ !cancelled() && steps.restore_build.outcome != 'success' && steps.build_debug.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $src   = "$env:GITHUB_WORKSPACE\build\vs2022"
          $store = "C:\pdfe-build-store\$env:GITHUB_SHA-debug"
          try {
            $parts = @(
              @{ from = "$src\bin\Debug";                             to = "$store\bin\Debug" },
              @{ from = "$src\vcpkg_installed\x64-windows\bin";       to = "$store\vcpkg_installed\x64-windows\bin" },
              @{ from = "$src\vcpkg_installed\x64-windows\debug\bin"; to = "$store\vcpkg_installed\x64-windows\debug\bin" }
            )
            Remove-Item $store -Recurse -Force -ErrorAction SilentlyContinue
            foreach ($p in $parts) {
              if (Test-Path $p.from) {
                New-Item -ItemType Directory -Path $p.to -Force | Out-Null
                Copy-Item "$($p.from)\*" $p.to -Recurse -Force
              }
            }
            Get-ChildItem $src -Recurse -Filter 'CTestTestfile.cmake' -ErrorAction SilentlyContinue |
              ForEach-Object {
                $rel = $_.FullName.Substring($src.Length).TrimStart('\')
                $out = Join-Path $store $rel
                New-Item -ItemType Directory -Path (Split-Path $out) -Force | Out-Null
                Copy-Item $_.FullName $out -Force
              }
            # Written LAST, so an interrupted publish leaves a store the restore
            # REFUSES rather than a half-copied one it accepts.
            "$env:GITHUB_SHA" | Out-File -FilePath (Join-Path $store 'published-sha.txt') -Encoding ascii
            $size = (Get-ChildItem $store -Recurse -File | Measure-Object -Property Length -Sum).Sum
            Write-Host ("Published {0:N1} GB debug closure to {1}" -f ($size / 1GB), $store)
            # PUBLISH TO R2, if this machine is configured for it. A restore leg
            # with nothing writing to it is INERT -- which is precisely the
            # defect a security-audit gate found in the artifact path, where the
            # download could never have found anything. Adding the consumer
            # without the producer would repeat it.
            #
            # Non-fatal like the rest of publishing, and for the same reason: a
            # validation lane must not go red because a cache write failed. The
            # consequence surfaces later as ensure-build-tree's loud refusal.
            #
            # Credentials are MACHINE-LEVEL env only -- never workflow secrets.
            $r2e = $env:PDFE_R2_ENDPOINT; $r2b = $env:PDFE_R2_BUCKET
            $r2k = $env:PDFE_R2_ACCESS_KEY_ID; $r2s = $env:PDFE_R2_SECRET_ACCESS_KEY
            if ($r2e -and $r2b -and $r2k -and $r2s) {
              if (Get-Command aws -ErrorAction SilentlyContinue) {
                try {
                  $zip = Join-Path $env:RUNNER_TEMP "r2-$env:GITHUB_SHA-debug.zip"
                  Remove-Item $zip -Force -ErrorAction SilentlyContinue
                  Compress-Archive -Path "$store\*" -DestinationPath $zip -CompressionLevel Fastest
                  $env:AWS_ACCESS_KEY_ID = $r2k
                  $env:AWS_SECRET_ACCESS_KEY = $r2s
                  $env:AWS_DEFAULT_REGION = 'auto'
                  aws s3 cp $zip "s3://$r2b/pdfe-build/$env:GITHUB_SHA-debug.zip" --endpoint-url $r2e --only-show-errors
                  if ($LASTEXITCODE -eq 0) {
                    Write-Host ("published to R2: pdfe-build/$env:GITHUB_SHA-debug.zip ({0:N2} GB)" -f ((Get-Item $zip).Length / 1GB))
                  } else {
                    Write-Host "::warning::R2 upload failed (non-fatal); a cold machine will refuse loudly instead."
                  }
                  Remove-Item $zip -Force -ErrorAction SilentlyContinue
                } catch {
                  Write-Host "::warning::R2 publish threw (non-fatal): $($_.Exception.Message)"
                }
              } else {
                Write-Host "::warning::R2 configured but the aws CLI is absent; nothing published to R2."
              }
            } else {
              Write-Host "R2 not configured on this machine; local store only."
            }

          } catch {
            Write-Host "debug publish failed (non-fatal): $($_.Exception.Message)"
          }
          exit 0

      - name: Upload the DEBUG closure as an ARTIFACT (cross-machine reuse)
        # THE LEG THAT MAKES A CONSUME-ONLY RUNNER POSSIBLE for core-tests. The
        # local store above serves a warm machine; only this serves a cold one.
        #
        # Still OFF by default, and that is a quota fact rather than caution:
        # the account's artifact storage quota is EXHAUSTED (the reporting job's
        # upload fails every run with "Artifact storage quota has been hit"), so
        # enabling it unconditionally would redden every run. Until quota is
        # freed, a cold consume-only machine FAILS LOUDLY in ensure-build-tree
        # with a message naming this input -- which is the honest state, not a
        # working cross-machine lane.
        #
        # continue-on-error is safe here for the same reason it is safe on the
        # full-closure upload below and catastrophic at R-32/GAP-A15: nothing in
        # THIS run consumes the output, so a swallowed failure resurfaces as a
        # later refusal, never as a false green now.
        if: ${{ !cancelled() && inputs.publish_build_artifact != '' && steps.publish_debug.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pdfe-build-debug-${{ github.sha }}
          path: C:\pdfe-build-store\${{ github.sha }}-debug
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # CROSS-MACHINE STATUS, stated here because it decides when a SECOND runner
  # may safely be registered. This block previously recorded the gap; it now
  # records what closed it and what has NOT.
  #
  # CLOSED: every job below that consumes `build/vs2022` now begins with
  # `./.github/actions/ensure-build-tree`, which probes the workspace (the
  # same-machine fast path `clean: false` provides), then the local per-SHA
  # store, then the published artifact -- and FAILS LOUDLY, naming which of the
  # five refusals applied, when it can serve none of them. It is automatic, not
  # opt-in: an opt-in restore is a restore that is off on the run where it was
  # needed.
  #
  # NOT CLOSED, and not closable here: the artifact leg only functions when the
  # producing run was dispatched with `publish_build_artifact`, which needs
  # artifact storage quota this account does not currently have. So on a cold
  # machine the lane today fails LOUDLY and correctly instead of failing
  # obscurely -- that is a real improvement and it is NOT a working
  # cross-machine lane. Free the quota before registering a consume-only
  # machine, and dispatch with publish_build_artifact set.
  #
  # ALSO NOT COVERED, deliberately: `release` runs `cmake --build`, which needs
  # a CONFIGURED tree, not a runtime closure. ensure-build-tree cannot serve it
  # and does not pretend to. `release` stays co-located with `build` via the
  # `pdfe-builder` label; with more than one builder machine it would need its
  # own treatment.
  # ------------------------------------------------------------------------
  core-tests:
    name: core-tests
    # gtest, JUnit verification, parity, flaky-quarantine, coverage, perf.
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    needs: [build]
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # clean:false is LOAD-BEARING. actions/checkout defaults to
          # clean:true, which runs `git clean -ffdx`; the -x deletes
          # gitignored files, i.e. the entire build/ tree this job
          # depends on the `build` job having produced.
          #
          # STILL LOAD-BEARING, and no longer LOAD-ALONE: `ensure-build-tree`
          # below now covers the case this cannot -- a machine that never built.
          clean: false

      - name: Ensure the build tree is present (same machine or restored)
        # THE CROSS-MACHINE GUARANTEE. `clean: false` above preserves a build
        # tree that this machine produced; it can do nothing about a job routed
        # to a machine that never built, which is exactly what a second runner
        # carrying `pdfe-windows` makes possible. This restores it, or fails
        # with a message that names which of the five refusals applied.
        #
        # `!cancelled()` and not implicit success(): a red step above must not
        # turn this into a skip, because a skipped restore leaves every step
        # below to fail on a missing exe -- the cause-hiding cascade this lane's
        # whole guard convention exists to remove.
        if: ${{ !cancelled() }}
        uses: ./.github/actions/ensure-build-tree
        with:
          # The DEBUG closure, published by the `build` job itself. NOT the full
          # one: this job declares `needs: [build]` and so runs concurrently
          # with `release`, where the full closure is published -- it does not
          # exist yet when this job starts.
          store-key: ${{ github.sha }}-debug
          artifact-name: pdfe-build-debug-${{ github.sha }}
          github-token: ${{ github.token }}
          # pdfe_tests.exe is required ONLY on a full run. A `ui_only` dispatch
          # deliberately builds just the `pdfe` target (see the build step), so
          # demanding the test binary here would fail every targeted run on the
          # absence of something nothing in this job then uses.
          required-files: |
            bin/Debug/pdfe.exe
            ${{ inputs.ui_only == '' && 'bin/Debug/pdfe_tests.exe' || '' }}

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Set up vcpkg (manifest mode)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: 15e5f3820f0370f1ba7150853762cec0688cd396

      - name: Run security-focused gtest subset (SEC-26 / GitHub #49; fast pre-check)
        id: security_subset
        # GitHub #49 (SEC-26) asked for this in fast-checks.yml "or equivalent".
        # fast-checks.yml is a pure-Python gate on a GitHub-hosted ubuntu runner
        # with no C++ toolchain (see that workflow's own header) -- a Windows
        # gtest binary cannot run there at all. windows-validation.yml is the
        # "or equivalent": it already has the toolchain and the built binary.
        # See docs/audit/backlog-p82/phase-13/notes.md for the full reasoning.
        #
        # WHY THIS IS PLACED BEFORE "Run pdfe_tests" (the full ~5900-test
        # sharded suite) RATHER THAN AFTER: this filter's tests are already a
        # subset of the full run, so running it again afterward would be pure
        # duplication with zero new coverage. Running it FIRST instead gives a
        # fast-fail: a security regression is visible in minutes instead of
        # after the full multi-hour dispatch, which is the actual value a
        # "fast, sharded gtest subset" (the row's own title) can add here.
        #
        # THE FILTER IS THE SAME STRING as windows-sanitizer.yml's "Run
        # security-focused gtest subset under ASan" step (that file, the
        # `$filter =` assignment near its ASAN_OPTIONS block) -- SEC-26's
        # proposed-work text names that filter by reference. There is no
        # shared file both workflows can source it from without a larger
        # refactor than this row asks for, so the two copies must be kept in
        # sync BY HAND. If you touch one, touch the other.
        if: ${{ !cancelled() && (needs.build.outputs.built == 'success' || needs.build.outputs.restored == 'success') && !inputs.ui_only }}
        shell: pwsh
        run: |
          $buildBin = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $vcpkgDbg = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\debug\bin"
          $vcpkgRel = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$buildBin;$vcpkgDbg;$vcpkgRel;$env:PATH"
          $testExe = Join-Path $buildBin "pdfe_tests.exe"
          if (-not (Test-Path $testExe)) {
            Write-Error "pdfe_tests.exe not found at $testExe"
            exit 1
          }

          $filter = "MaliciousPdfTest.*:SecurityAudit.*:Encryption*.*:Redaction*.*:Phase8SecurityTest.*:Phase7RedactionTest.*:E2ERedaction.*:PathSecurity.*:JavaScriptEngineTest.*:JsSandboxSecurityTest.*:SignatureSecurityTest.*:Pkcs7FuzzSmokeTest.*:FontFuzzSmokeTest.*:Pkcs7BridgeTest.*:Pkcs7RoundTripTest.*:CertEnforcementTest.*:CertificationSignatureTest.*:InvisibleSignatureTest.*:SignatureVerifyResultTest.*:SignatureManagerTest.*:PermissionFlagsTest.*:TileConcurrencyStress.*"

          # POSITIVE-CONTROL GUARD, added because of what phase-13 measured
          # locally: `run_gtest.py` (and a bare `pdfe_tests.exe` invocation)
          # EXITS 0 when a --gtest_filter selects ZERO tests -- the GAP-A15
          # cousin. A filter that has silently drifted from the suite (a
          # renamed test suite, a moved file) would otherwise report this step
          # green while checking nothing. Assert a non-zero selected count
          # BEFORE trusting the run below.
          $listOut = & $testExe "--gtest_filter=$filter" --gtest_list_tests 2>&1
          $selected = @($listOut | Select-String '^\s{2}\S').Count
          Write-Host "Security subset filter selected $selected test(s)."
          if ($selected -le 0) {
            Write-Error "Security gtest subset filter selected ZERO tests -- the filter has drifted from the suite (SEC-26/#49). Refusing to report a false green; update the filter in BOTH this step and windows-sanitizer.yml."
            exit 1
          }

          $xmlPath = "$env:GITHUB_WORKSPACE\gtest-security-subset-results.xml"
          & $testExe "--gtest_filter=$filter" --gtest_color=no "--gtest_output=xml:$xmlPath"
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Write-Error "Security-focused gtest subset FAILED (exit $rc). See $xmlPath."
            exit 1
          }
          Write-Host "Security-focused gtest subset ($selected tests): PASS."

      - name: Run pdfe_tests
        id: gtest
        # Skipped for a targeted UI subset run (workflow_dispatch ui_only): the
        # gtest layer is unrelated to a UI-harness fix and adds ~13 min.
        #
        # F44 STEP-MASKING DECISION — GUARDED, with a producer precondition.
        # The old `if: ${{ !inputs.ui_only }}` carried no status-check function,
        # so GitHub's implicit success() still applied and ANY earlier red step
        # silently skipped this one. !cancelled() removes that masking.
        # PRODUCER: this step consumes pdfe_tests.exe from "Build app + tests
        # (debug-vs2022 preset)", so it stays conditioned on that step's success.
        #
        # F46 CORRECTION — this comment previously claimed that "a failure in an
        # UNRELATED earlier step (fixture generation, the ONNX SDK fetch, the
        # vcpkg cache export) no longer skips it". As written at F44 that was
        # FALSE, and false for exactly the three examples it cited: all three sit
        # ABOVE build_debug and all three genuinely throw, build_debug then had
        # no `if:` of its own, so implicit success() skipped BUILD_DEBUG, whose
        # outcome became 'skipped', which skipped this step too. The masking had
        # been relocated into the producer, not removed. It is true now only
        # because build_debug carries its own `!cancelled()` (see that step's
        # F46 PRODUCER-GUARD DECISION note); the two facts must stay together.
        #
        # WHAT THIS NOW GUARANTEES, exactly: any red step above that is not the
        # Debug build itself leaves this step running. WHAT IT DOES NOT: a failed
        # Debug build still skips this step, deliberately — there is no
        # pdfe_tests.exe to run — and a ui_only dispatch still skips it.
        if: ${{ !cancelled() && (needs.build.outputs.built == 'success' || needs.build.outputs.restored == 'success') && !inputs.ui_only }}
        # GAP-A15 (Phase 6): continue-on-error REMOVED. It was added in
        # Phase 2-3 to tolerate the then-flaky
        # MainWindowIntegrationTest.ZoomComboExists so the UI suite would
        # still run. That flag also turned the WHOLE JOB green on ANY
        # gtest failure — it is precisely why 2 real BatchDialogTest
        # failures rode green for 3 phases (the exit-code masking failed
        # the step, but continue-on-error swallowed it at the job level).
        # ZoomComboExists has been stable across runs 27310588193,
        # 27335387425, 27367556829, 27446597142 (verified: 0 failure
        # children in each XML), so the flag is no longer needed. The
        # step now (a) returns the real gtest exit code and (b) parses
        # gtest-results.xml and exits 1 on any failures/errors — and that
        # exit-1 now fails the job, as it must.
        shell: pwsh
        run: |
          # NOTE on PATH: we use vcpkg in MANIFEST mode (vcpkg.json in
          # repo root). In manifest mode, vcpkg installs deps under the
          # CMake build directory at build/<preset>/vcpkg_installed/<triplet>/
          # — NOT under $VCPKG_ROOT/installed/<triplet>/ (which is
          # vcpkg-classic-mode and is empty here).
          $buildBin = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $vcpkgDbg = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\debug\bin"
          $vcpkgRel = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$buildBin;$vcpkgDbg;$vcpkgRel;$env:PATH"

          # Sanity check the paths exist before we try to run the binary.
          # Without this the failure mode is opaque (exit 1, no stdout).
          foreach ($p in @($buildBin, $vcpkgDbg, $vcpkgRel)) {
            if (-not (Test-Path $p)) {
              Write-Warning "PATH segment missing: $p"
            }
          }

          $testExe = Join-Path $buildBin "pdfe_tests.exe"
          if (-not (Test-Path $testExe)) {
            Write-Error "pdfe_tests.exe not found at $testExe"
            exit 1
          }

          $logPath = "$env:GITHUB_WORKSPACE\pdfe_tests.log"
          $outDir  = "$env:GITHUB_WORKSPACE\build\gtest_ci_out"

          # Run via the rerun-on-failure wrapper. A small number of
          # MainWindow-integration tests (e.g. MainWindowIntegrationTest.
          # ZoomComboExists) are PROBABILISTICALLY flaky under the cumulative
          # state of the ~3900-test single process on the headless runner:
          # createToolBar() occasionally fails to populate the toolbar after
          # thousands of prior tests, though the test passes reliably in a
          # FRESH process and in isolation (verified). run_gtest.py runs the
          # full suite once, then re-runs ONLY the failed tests in a fresh
          # process; a transient flake heals, a GENUINE failure fails every
          # rerun and the wrapper exits non-zero. This is rerun-on-failure
          # (NOT skipping) and mirrors run_ui_suite.py's --reruns. The wrapper
          # parses the JUnit XML itself (not the exit code) for failure
          # detection, preserving the false-green defense (run 27446597142:
          # pdfe_tests.exe exited 0 with failures in the XML).
          python "$env:GITHUB_WORKSPACE\tests\scripts\run_gtest.py" `
            --exe $testExe `
            --output-dir $outDir `
            --reruns 2 `
            *>&1 | Tee-Object -FilePath $logPath
          $gtestExit = $LASTEXITCODE

          # Copy the full-run JUnit to the conventional path for artifact
          # upload / downstream tooling.
          $fullXml = Join-Path $outDir "gtest_full.xml"
          if (Test-Path $fullXml) {
            Copy-Item $fullXml "$env:GITHUB_WORKSPACE\gtest-results.xml" -Force
          } else {
            Write-Error "gtest XML not produced at $fullXml -- cannot verify results"
            exit 1
          }
          if ($gtestExit -ne 0) {
            Write-Host "::error::gtest reported failures that did NOT heal on a fresh rerun (genuine failures) -- see log"
            exit 1
          }
          Write-Host "gtest: clean (failures, if any, were transient flakes that passed on a fresh rerun)"
          exit 0

      - name: Verify gtest JUnit XML (single-source checker — GAP-A15 / Register H6)
        # Explicit machine-check of the produced gtest-results.xml using the
        # SAME authority the gate hook uses (tools/gate/check_junit_xml.py), so
        # CI and the local test-runner gate agree on what "passed" means and
        # neither trusts the process exit code. Redundant with run_gtest.py's
        # own XML parse on purpose: it pins the pass/fail contract to one shared
        # script. See docs/gate-verification.md §4.
        #
        # F44 STEP-MASKING DECISION — GUARDED, and deliberately conditioned on
        # the gtest step having RUN rather than having SUCCEEDED. This step is
        # the GAP-A15 authority: run_gtest.py writes gtest-results.xml whether
        # the run passed or failed, and the whole point of the checker is to
        # adjudicate a run whose exit code cannot be trusted. Under the old
        # implicit success() a FAILING gtest run skipped its own verifier —
        # exactly backwards. `!= 'skipped'` keeps it out of the ui_only path
        # (where no XML exists) while letting it run on a red gtest step.
        if: ${{ !cancelled() && steps.gtest.outcome != 'skipped' && !inputs.ui_only }}
        shell: pwsh
        run: |
          $xml = "$env:GITHUB_WORKSPACE\gtest-results.xml"
          python "$env:GITHUB_WORKSPACE\tools\gate\check_junit_xml.py" $xml
          if ($LASTEXITCODE -ne 0) {
            Write-Error "check_junit_xml.py rejected $xml (failures/errors present or empty run). Failing the job."
            exit 1
          }
          Write-Host "check_junit_xml.py: gtest-results.xml verified clean."

      - name: Compare suite size and skip SET against the recorded baseline (GitHub #276)
        # check_junit_xml.py above asks "did anything fail". This asks the
        # question nothing asked before: DID THE SUITE CHANGE SHAPE. A rising
        # skip count could not be caught on the run that caused it, because no
        # machine-readable source recorded the size or the skips -- "at or below
        # the current 15-skip baseline" is satisfied indefinitely by fourteen new
        # skips appearing, and "15" traced only to a project note.
        #
        # Records the SET, not a count, because a count cannot tell a new skip
        # from a different machine: CI reported 15 and a workstation 19 for a
        # comparable commit, the difference being CNN-model tests whose model
        # file is absent locally. Those are named in --allow-env-skips so they
        # are reported without failing; everything else fails.
        #
        # Same condition as the step above, and for the same reason: a run whose
        # shape changed is exactly the run this needs to adjudicate, so it must
        # not be gated on the gtest step having SUCCEEDED.
        if: ${{ !cancelled() && steps.gtest.outcome != 'skipped' && !inputs.ui_only }}
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\tools\gate\check_suite_totals.py" `
            --xml "$env:GITHUB_WORKSPACE\gtest-results.xml" `
            --baseline "$env:GITHUB_WORKSPACE\tools\gate\suite_totals_baseline.json" `
            --allow-env-skips "CNNFontClassifierTest"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "check_suite_totals.py: the suite's size or skip set drifted from tools/gate/suite_totals_baseline.json. Fix the test, or re-record the baseline with --update and say why in --note. Failing the job."
            exit 1
          }
          Write-Host "check_suite_totals.py: suite size and skip set match the baseline."

      - name: Reconcile enumerated parameterised ids against the JUnit XML (GitHub #211)
        # check_junit_xml.py above adjudicates the tests that ARE in the XML:
        # parses, failures==0, errors==0, tests>0, >=1 ran. Every one of those
        # is a property of what is present. NOTHING compared the XML against an
        # independent enumeration of what SHOULD have been there — and a TEST_P
        # case that is never instantiated is not a failure, it is nothing at
        # all. PDF-79: test_realworld_corpus.cpp is parameterised over the
        # sidecars it discovers, seventeen fixtures had none, so seventeen
        # cases did not exist and the suite reported green for months.
        #
        # LAYER 1 (--list-file) reconciles `--gtest_list_tests` against the
        # XML's testcases. LAYER 2 (--expectations) reconciles the XML against
        # the ARTEFACTS on disk — the only source independent of the test
        # binary, and the only one that can catch PDF-79, because with no
        # sidecars present the enumeration omits the cases too.
        #
        # F44 STEP-MASKING DECISION — GUARDED, and deliberately conditioned the
        # same way as check_junit_xml.py above: on the gtest step having RUN,
        # not having SUCCEEDED. A run whose ids do not reconcile is exactly the
        # run this needs to adjudicate; under an implicit success() a red gtest
        # step would skip its own reconciler.
        if: ${{ !cancelled() && steps.gtest.outcome != 'skipped' && !inputs.ui_only }}
        shell: pwsh
        run: |
          # GitHub #280 — these three were MISSING, and that is the whole bug.
          #
          # $outDir and $testExe are assigned inside the "Run pdfe_tests" step's
          # own run: block — by NAME, not by line, for the reason given below.
          # Every `run:` is a SEPARATE pwsh
          # process, so nothing assigned there survives into this step: both
          # arrived here as $null. `Join-Path $null` throws a mandatory-parameter
          # binding error, so this step died on its FIRST line, every single run.
          #
          # The step is deliberately conditioned on gtest having RUN rather than
          # SUCCEEDED (see the F44 note above) precisely so it can adjudicate a
          # red run — but it never adjudicated anything, because it never got
          # past line one. LAYER 1 and LAYER 2 below, built to catch PDF-79's
          # seventeen phantom cases, have therefore never once executed.
          #
          # Re-derived here from $env:GITHUB_WORKSPACE, which IS available to
          # every step. This is the established convention in this file, not a
          # new one: SEVEN other steps each re-derive $buildBin from this
          # byte-identical literal, and this step was the lone place that read
          # the variables without deriving them.
          #
          # Deliberately NO line numbers. The first version of this comment
          # cited them (":1192, :1276, :1457, ...") and FIVE of the seven were
          # already wrong when committed, each short by exactly 36 — because
          # this very step's 36-line insertion shifted every occurrence below
          # it. A line citation inside the file it describes invalidates itself
          # the moment that file is edited, which is the one thing a workflow
          # comment can be sure will happen. phase-6's claim-check gate caught
          # it. Re-derive instead, which is cheap and cannot go stale:
          #
          #   grep -n '\$buildBin = "\$env:GITHUB_WORKSPACE' windows-validation.yml
          #
          # check_pwsh_step_locals.py fails the build on a recurrence of the
          # underlying defect.
          $buildBin = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $testExe  = Join-Path $buildBin "pdfe_tests.exe"
          $outDir   = "$env:GITHUB_WORKSPACE\build\gtest_ci_out"

          # Fail LOUDLY with a diagnosis rather than a parameter-binding error.
          # The original failure mode named neither the variable nor the cause,
          # which is why this sat broken behind a green-looking suite.
          foreach ($pair in @(@{N='testExe';V=$testExe}, @{N='outDir';V=$outDir})) {
            if ([string]::IsNullOrWhiteSpace($pair.V)) {
              Write-Error ("GitHub #280 regression: `$" + $pair.N + " is null/empty in this step. " +
                           "Each GitHub Actions run: block is a separate process, so a variable " +
                           "assigned in an earlier step is NOT visible here — derive it in THIS block.")
              exit 1
            }
          }

          $listLog = Join-Path $outDir "gtest_list.log"
          if (-not (Test-Path $listLog)) {
            # run_gtest.py writes this during sharded enumeration. Single-process
            # mode does not, so produce it here rather than silently skipping —
            # a reconciler that quietly does nothing is the defect it exists to
            # catch, one level up.
            & $testExe --gtest_list_tests *> $listLog
            # GitHub #288, the EIGHTH site -- found by
            # tools/gate/check_test_exe_exit_captured.py, which was written for
            # the other three in this file. Neither I nor the gate that found
            # those three spotted this one; the guard did, on its first run.
            #
            # This one is nastier than a lost red. A crash partway through
            # enumeration leaves a TRUNCATED $listLog, and the reconciler below
            # checks that every ENUMERATED test has a testcase in the XML. A
            # shorter list is an EASIER test to satisfy, so the crash does not
            # just go unreported -- it quietly shrinks the population the gate
            # measures and makes it pass. Note `*>` also folds stderr into the
            # list file, so the damage is not even visibly a diagnostic.
            #
            # The reconciler IS bidirectional, which looks like it would catch
            # this, so be precise: of its two result sets, `missing_from_xml` is
            # the fatal one and a truncated list SHRINKS it, while
            # `in_xml_not_enumerated` is printed as a non-fatal `note:` whose own
            # text reads "XML older than the binary, or a filtered run". The
            # truncation therefore weakens the half that can fail and trips only
            # the half that cannot, with a message that explains it away.
            $listExit = $LASTEXITCODE
            if ($listExit -ne 0 -and $listExit -ne 1) {
              Write-Error "pdfe_tests.exe CRASHED while enumerating tests (exit $listExit). The list at $listLog may be truncated, which would make the reconciliation below weaker and therefore GREENER. Refusing to reconcile against a partial enumeration (GitHub #288)."
              exit 1
            }
          }
          python "$env:GITHUB_WORKSPACE\tools\gate\check_param_suite_reconciliation.py" `
            --xml "$env:GITHUB_WORKSPACE\gtest-results.xml" `
            --list-file $listLog `
            --expectations "$env:GITHUB_WORKSPACE\tools\gate\param_suite_expectations.json" `
            --repo-root "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "check_param_suite_reconciliation.py found enumerated tests with no testcase in the XML, or an artefact with no case covering it. Failing the job."
            exit 1
          }
          Write-Host "check_param_suite_reconciliation.py: enumeration, artefacts and XML all reconcile."

      - name: Run + verify CROSS-PLATFORM CORE PARITY suite (C-10)
        # C-10: run the platform-INDEPENDENT behavioral core as an EXPLICIT, named
        # selection so Windows asserts the SAME cross-platform contract the Linux and
        # macOS lanes assert. The full pdfe_tests run above is a superset, but this
        # step pins the parity axis: tools/gate/parity_filter.py generates the
        # gtest_filter from tools/gate/parity_suite.txt -- the SAME script + SAME
        # source list all three lanes use, so the filter is byte-identical on every
        # platform by construction. If a suite is added to (or removed from)
        # parity_suite.txt, all three lanes track it in lock-step. GAP-A15: the
        # produced XML (not the exit code) is the authority; --min-tests 200 guards a
        # silently-shrunk selection (this run selects ~950 core tests locally).
        #
        # F44 STEP-MASKING DECISION — GUARDED, producer = the Debug build only.
        # This step re-invokes pdfe_tests.exe with its own filter and writes its
        # own parity-results.xml; it does NOT consume anything the "Run
        # pdfe_tests" step produced. The parity axis is therefore an INDEPENDENT
        # control and must still report when the full gtest run went red — that
        # is the single most useful moment to know whether the cross-platform
        # core specifically regressed.
        if: ${{ !cancelled() && (needs.build.outputs.built == 'success' || needs.build.outputs.restored == 'success') && !inputs.ui_only }}
        shell: pwsh
        run: |
          $buildBin = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $vcpkgDbg = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\debug\bin"
          $vcpkgRel = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$buildBin;$vcpkgDbg;$vcpkgRel;$env:PATH"
          $testExe = Join-Path $buildBin "pdfe_tests.exe"
          if (-not (Test-Path $testExe)) { Write-Error "pdfe_tests.exe not found"; exit 1 }

          $filter = & python "$env:GITHUB_WORKSPACE\tools\gate\parity_filter.py"
          if ($LASTEXITCODE -ne 0 -or -not $filter) {
            Write-Error "parity_filter.py did not emit a filter"; exit 1
          }
          Write-Host "parity gtest_filter length: $($filter.Length)"
          $parityXml = "$env:GITHUB_WORKSPACE\parity-results.xml"
          # PHASE-24 CRITERION 2 -- why this argument is now ONE quoted token.
          #
          # This used to read:
          #     --gtest_output=("xml:" + $parityXml)
          # PowerShell does not treat that as one argument. A bare word followed
          # by a parenthesised expression is TWO arguments, so the child received
          #     --gtest_output=            <- empty value
          #     xml:C:\...\parity-results.xml   <- stray positional, ignored
          # gtest accepts an empty output path by writing nothing, ignores the
          # stray argument, runs every test, reports them all passing and exits
          # 0. Verified by echoing the split (`cmd /c echo`) and by A/B-running
          # the two forms against the same binary and the same filter: the
          # parenthesised form produced no XML, the quoted form did.
          #
          # So the step failed on "parity-results.xml not produced" after a
          # completely clean 990-test run, which reads like a crashed or
          # truncated run and is nothing of the kind. Note this is NOT the
          # teardown-crash theory, and NOT filter length: the identical filter
          # works when the argument is a single token.
          #
          # Keep it quoted. The guard below stays regardless -- it is what
          # turned a silent no-op into a visible failure in the first place.
          & $testExe --gtest_filter="$filter" "--gtest_output=xml:$parityXml" --gtest_brief=1
          # GitHub #288, the SEVENTH site. Capture the exit code on the VERY NEXT
          # line. The python call below overwrites $LASTEXITCODE, so by the time
          # anything tested it the test binary's own code was already gone -- the
          # signal existed for exactly one statement and was never read.
          #
          # Test-Path proves the FILE arrived; it cannot prove the PROCESS
          # survived writing it. gtest exits 0 or 1 normally (see
          # _is_abnormal_exit in tests/scripts/run_gtest.py); anything else is a
          # structured exception or a signal, and a green XML cannot reveal it
          # because the crash arrives after the last assertion.
          $parityExit = $LASTEXITCODE
          if (-not (Test-Path $parityXml)) {
            Write-Error "parity-results.xml not produced -- cannot verify results (check that --gtest_output reached the child as ONE argument)"; exit 1
          }
          if ($parityExit -ne 0 -and $parityExit -ne 1) {
            Write-Error "Cross-platform parity suite CRASHED (exit $parityExit). The XML may look complete and green, but the process that wrote it died; a report from a dead process is not a pass (GitHub #288)."
            exit 1
          }
          python "$env:GITHUB_WORKSPACE\tools\gate\check_junit_xml.py" $parityXml --min-tests 200
          if ($LASTEXITCODE -ne 0) {
            Write-Error "check_junit_xml.py rejected the parity results (C-10). Failing the job."
            exit 1
          }
          Write-Host "Cross-platform parity suite (C-10): verified clean."

      - name: Flaky-quarantine gate — reruns must not mask an untracked flake (R-37)
        # Remediation Phase 5, R-37. run_gtest.py re-runs failed tests in a fresh
        # process; a test that heals goes green. Without a ledger that silently
        # masks a degrading test. run_gtest.py now writes healed_flakes.json; this
        # gate FAILS if any test healed on rerun this run is NOT registered in
        # tools/gate/flaky_quarantine.json (or a registry entry has expired).
        #
        # F44 STEP-MASKING DECISION — GUARDED, conditioned on the gtest step
        # having RUN, not succeeded. R-37 exists precisely for the run where
        # something ELSE failed and a flake quietly healed underneath it; the
        # old implicit success() skipped the gate on exactly those runs.
        # check_flaky_quarantine.py treats an absent --healed file as "nothing
        # healed" (verified: `if args.healed and args.healed.exists()`), so a
        # gtest step that died before writing healed_flakes.json degrades to a
        # trivial pass rather than a spurious red.
        if: ${{ !cancelled() && steps.gtest.outcome != 'skipped' && !inputs.ui_only }}
        shell: pwsh
        run: |
          $healed = "$env:GITHUB_WORKSPACE\build\gtest_ci_out\healed_flakes.json"
          python "$env:GITHUB_WORKSPACE\tools\gate\check_flaky_quarantine.py" `
            --registry "$env:GITHUB_WORKSPACE\tools\gate\flaky_quarantine.json" `
            --healed $healed
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Flaky-quarantine gate FAILED: an untracked/expired flake healed on rerun (R-37). Register it in tools/gate/flaky_quarantine.json or fix it."
            exit 1
          }
          Write-Host "Flaky-quarantine gate clean."

      - name: Code coverage (OpenCppCoverage → Cobertura) — ENFORCED FLOOR (R-32)
        # Remediation Phase 5, R-32: this was `continue-on-error: true` (best-
        # effort) — the Cobertura report was uploaded but NEVER gated, and a
        # runner WITHOUT OpenCppCoverage silently skipped coverage. Both let a
        # coverage collapse ship green. Now:
        #   * OpenCppCoverage ABSENCE is a HARD error (fail the job) — the tool is
        #     a required runner dependency, not an optional nicety. We attempt a
        #     choco install first; if it still is not on PATH we FAIL.
        #   * the produced Cobertura line-rate is gated by
        #     tools/gate/check_coverage_floor.py against COVERAGE_FLOOR: below the
        #     floor fails the job; a missing/corrupt report is a HARD error.
        # continue-on-error REMOVED.
        #
        # F44 STEP-MASKING DECISION — GUARDED, producer = the Debug build only.
        # OpenCppCoverage re-launches pdfe_tests.exe under instrumentation and
        # writes its own Cobertura report; it consumes nothing from the "Run
        # pdfe_tests" step. A coverage collapse is an independent signal and R-32
        # was written after two false greens, so it must not be silenced by an
        # unrelated red step.
        if: ${{ !cancelled() && (needs.build.outputs.built == 'success' || needs.build.outputs.restored == 'success') && !inputs.ui_only }}
        shell: pwsh
        env:
          # Conservative starting floor. RATCHET UP after the first measured
          # nightly run (see docs/harness-audit/remediation/phase-5-report.md).
          COVERAGE_FLOOR: "0.50"
        run: |
          # PHASE-24 CRITERION 3. OpenCppCoverage is a REQUIRED runner
          # dependency (R-32: absence is a hard error, never a silent skip),
          # and on the current runner it is simply not installed -- verified
          # 2026-08-19 with tools/runner-deployment/Test-PdfeRunner.ps1, which
          # reports it absent on the real host. So this step has been failing
          # every run, and the choco fallback below did NOT rescue it: choco is
          # not functional on that machine, which is exactly why the register
          # flagged this as a masked red rather than a transient.
          #
          # WHAT CHANGED, and what deliberately did NOT:
          #   * The install fallback now uses the GitHub release installer
          #     rather than Chocolatey, because choco is the broken path.
          #   * The hard-error-on-absence rule is UNCHANGED. A runner without
          #     coverage tooling still fails the job. The fix is to make the
          #     tool present (see tools/runner-deployment/), not to soften the
          #     gate -- softening it is what R-32 was written after two false
          #     greens to prevent.
          #   * The fallback is a convenience for a runner that slipped through
          #     provisioning, NOT the supported install route. The supported
          #     route is the deployment package, which installs it up front and
          #     verifies it before the runner ever takes a job.
          $occ = Get-Command OpenCppCoverage.exe -ErrorAction SilentlyContinue
          if (-not $occ) {
            # PORTABLE LOCATION FIRST. OpenCppCoverage ships only as an Inno
            # installer, which requires elevation -- and the account this runner
            # executes as is not in the local Administrators group, so the
            # elevated install is an operator action that may never happen.
            #
            # It does not actually need installing. The payload extracts with
            # innoextract and runs standalone (it instruments via the debugging
            # APIs, which work fine for a same-user process), so the deployment
            # package can place it under %LOCALAPPDATA%\Programs with no
            # elevation at all. Verified on this runner: a real Cobertura report
            # with lines-valid=53399 from an unelevated extracted copy.
            #
            # Checked BEFORE Program Files because an unelevated runner is the
            # normal case here, not the exception. A machine that does have the
            # elevated install still resolves it via PATH or the branch below.
            $portable = Join-Path $env:LOCALAPPDATA "Programs\OpenCppCoverage"
            $portableExe = Join-Path $portable "OpenCppCoverage.exe"
            $occDir = "C:\Program Files\OpenCppCoverage"
            $occExe = "$occDir\OpenCppCoverage.exe"
            if (Test-Path $portableExe) {
              Write-Host "OpenCppCoverage found (portable) at $portableExe; prepending."
              $env:PATH = "$portable;$env:PATH"
              $occDir = $portable
              $occExe = $portableExe
            }
            elseif (Test-Path $occExe) {
              # Installed but not on PATH -- the commonest state after a manual
              # install, and previously indistinguishable from absent.
              Write-Host "OpenCppCoverage found at $occExe but not on PATH; prepending."
              $env:PATH = "$occDir;$env:PATH"
            } else {
              Write-Host "OpenCppCoverage not present; attempting the release installer (NOT choco -- choco is the broken path on this runner)."
              $url = "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe"
              $dst = "$env:RUNNER_TEMP\OpenCppCoverageSetup.exe"
              # SHA256-pinned (GitHub #73). This is the sharpest of the
              # unverified fetches in this file: the bytes are not merely
              # linked, they are EXECUTED as an installer on the self-hosted
              # runner that also builds and signs the product. An unverified
              # download here is arbitrary code execution with a release
              # machine's privileges, gated on nothing but DNS and TLS to a
              # third-party release host.
              $occSha = "2295a733da39412c61e4f478677519dd0bb1893d88313ce56b468c9e50517888"
              try {
                Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
                # Checked BEFORE Start-Process, not after: verifying an
                # installer that has already run proves nothing.
                $occActual = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
                if ($occActual -ne $occSha) {
                  Remove-Item $dst -Force -ErrorAction SilentlyContinue
                  throw "OpenCppCoverage installer SHA256 mismatch: expected $occSha, got $occActual"
                }
                Write-Host "OpenCppCoverage installer SHA256 verified."
                # INNO SETUP, not NSIS. This previously passed '/S', which was
                # wrong in a way that could not fail fast: Inno IGNORES switches
                # it does not recognise and falls back to its INTERACTIVE
                # wizard, so '/S' under -Wait would block until the 720-minute
                # job cap and report `cancelled` -- precisely the masked-red
                # class this phase exists to remove. Verified from the
                # downloaded bytes (3 'Inno Setup' signature hits, 0 NSIS);
                # scratchpad/verify_installer_urls.ps1 is the checker.
                # /SUPPRESSMSGBOXES so a prompt cannot block either, and a
                # timeout so ANY future hang here is bounded and visible.
                $proc = Start-Process $dst -PassThru `
                  -ArgumentList '/VERYSILENT','/NORESTART','/SP-','/SUPPRESSMSGBOXES'
                if (-not $proc.WaitForExit(600000)) {
                  Write-Host "installer still running after 10 minutes; killing it rather than burning the job cap."
                  try { $proc.Kill() } catch { }
                  throw "OpenCppCoverage installer timed out (it should be silent and quick)."
                }
                Write-Host "installer exit code: $($proc.ExitCode)"
                if (Test-Path $occExe) { $env:PATH = "$occDir;$env:PATH" }
              } catch {
                Write-Host "installer attempt failed: $($_.Exception.Message)"
              }
            }
            $occ = Get-Command OpenCppCoverage.exe -ErrorAction SilentlyContinue
          }
          if (-not $occ) {
            Write-Error "OpenCppCoverage is REQUIRED but not installed, and the release-installer fallback did not produce it (R-32: tool-absence is a hard error, not a silent skip). Provision the runner with tools/runner-deployment/Install-PdfeRunner.ps1, then confirm with Test-PdfeRunner.ps1."
            exit 1
          }
          Write-Host "OpenCppCoverage: $($occ.Source)"
          $buildBin = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $vcpkgDbg = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\debug\bin"
          $vcpkgRel = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$buildBin;$vcpkgDbg;$vcpkgRel;$env:PATH"
          $cov = "$env:GITHUB_WORKSPACE\coverage-cobertura.xml"
          & OpenCppCoverage.exe --quiet --export_type "cobertura:$cov" `
            --sources "$env:GITHUB_WORKSPACE\src" `
            --modules "$buildBin" `
            -- "$buildBin\pdfe_tests.exe" --gtest_brief=1
          # GitHub #288, the SEVENTH site (2 of 3). Capture before anything else
          # runs; the python call below overwrites $LASTEXITCODE, so $covExit has
          # only ever carried check_coverage_floor.py's verdict -- and that script
          # reads the Cobertura XML, which has no concept of "the process that
          # produced this file then crashed".
          #
          # HONEST LIMIT: this is OpenCppCoverage's exit code, not directly
          # pdfe_tests.exe's. Whether it forwards its child's code is not
          # verifiable on this host (no OpenCppCoverage here), so this is not
          # claimed to catch every crash of the wrapped binary -- it catches the
          # ones that surface, which is strictly more than discarding the code.
          # If it proves not to forward, the fix is --% or an explicit wrapper,
          # not a wider accepted blind spot.
          $covRunExit = $LASTEXITCODE
          if ($covRunExit -ne 0 -and $covRunExit -ne 1) {
            Write-Error "Coverage run CRASHED (exit $covRunExit). A complete-looking Cobertura report from a dead process is not a pass (GitHub #288)."
            exit 1
          }
          $line = "## Coverage"
          # Floor gate — missing/corrupt report = hard error (exit 2 -> job fails).
          python "$env:GITHUB_WORKSPACE\tools\gate\check_coverage_floor.py" $cov --floor $env:COVERAGE_FLOOR
          $covExit = $LASTEXITCODE
          if ($covExit -eq 2) {
            $line += "`nHARD ERROR: coverage report missing/unparseable — failing (R-32)."
            $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Error "Coverage report missing/unparseable (R-32 hard error)."
            exit 1
          }
          if ($covExit -ne 0) {
            $line += "`nCoverage BELOW floor $($env:COVERAGE_FLOOR) — failing the job (R-32)."
            $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Error "Coverage below floor $($env:COVERAGE_FLOOR) (R-32)."
            exit 1
          }
          $line += "`nCoverage at/above floor $($env:COVERAGE_FLOOR); Cobertura uploaded as an artifact."
          $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Staged runtime closure vs the real import tables (GitHub #281)
        if: ${{ !cancelled() && !inputs.ui_only }}
        shell: pwsh
        # GitHub #281. "A missing runtime DLL at load time raises a modal dialog
        # that blocks a CI job until its timeout" was true and established by
        # OBSERVATION only -- on 2026-10-05 a Windows System Error modal for a
        # missing zlib1.dll sat there until something killed the job. Nothing
        # automated enforced the closure.
        #
        # tests/test_dll_dependencies.cpp asserts a HAND-TYPED roster of DLLs
        # loads, which is this corpus's highest-weight test-gap class (C-ENUM):
        # a dependency absent from the list is indistinguishable from one that
        # does not exist. Measured 2026-10-15, that roster misses three real
        # staged dependencies -- gtest.dll, qt6networkd.dll, qt6testd.dll.
        #
        # This reads the PE IMPORT DIRECTORY instead -- the list the loader
        # itself walks -- so a new dependency is covered the moment it is
        # linked. It belongs HERE rather than in fast-checks.yml for the same
        # reason the perf floor does: there is no build there, and a closure
        # check with no binaries to read would be structurally unable to fail.
        #
        # Re-derived from $env:GITHUB_WORKSPACE, which IS available to every
        # step -- see the GitHub #280 note above for what happens to a step
        # that reads a variable assigned in another step's shell.
        run: |
          $binDir = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $images = @()
          foreach ($n in @("pdfe.exe", "pdfe_tests.exe")) {
            $p = Join-Path $binDir $n
            if (Test-Path $p) { $images += $p }
          }
          if ($images.Count -eq 0) {
            Write-Error "neither pdfe.exe nor pdfe_tests.exe is present under $binDir, so the staged runtime closure cannot be checked. That is a failure, not a skip: a closure check with no image to read would pass over the very thing it exists to verify."
            exit 1
          }
          python "$env:GITHUB_WORKSPACE\tools\gate\check_staged_runtime_closure.py" @images
          if ($LASTEXITCODE -ne 0) {
            Write-Error "check_staged_runtime_closure.py: an imported DLL is neither staged beside the image nor resolvable as a system DLL. At load time Windows raises a MODAL System Error dialog for each, which on a runner blocks the job until its timeout (GitHub #281). Failing the job here instead."
            exit 1
          }
          Write-Host "check_staged_runtime_closure.py: every imported DLL resolves."

      - name: Performance-regression floor gate (C-07)
        # C-07: the perf tests MEASURE hot paths but assert no floor. This lane
        # runs the PerfBenchmark harness (emits per-metric medians to a measured
        # JSON) then gates it with tools/gate/check_perf_floor.py against the
        # committed SAME-MACHINE baseline (tools/gate/perf_baselines.json). A
        # regression beyond the generous 3x threshold fails the job; a dropped /
        # unmeasured metric or a missing baseline is a HARD error. This is the
        # gate the perf-benchmarks gate agent consumes.
        #
        # MACHINE-VARIANCE: absolute wall-clock is machine/thermal-dependent, so
        # the gate is RELATIVE to a same-machine baseline with a 3x threshold --
        # ordinary run-to-run noise (<2x on this runner) does not trip it, only a
        # real large hot-path regression (the XFA-save 10x-100x class) does. The
        # baseline must be regenerated on THIS runner if the host changes.
        #
        # F44 STEP-MASKING DECISION — GUARDED, producer = the Debug build only.
        # The PerfBenchmark harness is a separate invocation of pdfe_tests.exe
        # emitting its own measured JSON; nothing here reads the earlier run's
        # output. A hot-path regression of the XFA-save 10x-100x class is exactly
        # what must NOT be hidden by an unrelated failure upstream.
        if: ${{ !cancelled() && (needs.build.outputs.built == 'success' || needs.build.outputs.restored == 'success') && !inputs.ui_only }}
        shell: pwsh
        run: |
          $buildBin = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $vcpkgDbg = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\debug\bin"
          $vcpkgRel = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$buildBin;$vcpkgDbg;$vcpkgRel;$env:PATH"
          $testExe = Join-Path $buildBin "pdfe_tests.exe"
          if (-not (Test-Path $testExe)) { Write-Error "pdfe_tests.exe not found"; exit 1 }

          $measured = "$env:GITHUB_WORKSPACE\perf-measured.json"
          $env:PDFE_PERF_JSON = $measured
          # Run only the perf benchmark suite (fast: small fixture, few iters).
          & $testExe --gtest_filter=PerfBenchmark.* --gtest_brief=1
          # GitHub #288, the SEVENTH site (3 of 3). Capture on the next line:
          # $perfExit below is check_perf_floor.py's code, never the test
          # binary's. This is the most deceptive of the three, because
          # PDFE_PERF_JSON is written DURING the run -- so a teardown crash
          # leaves a complete, valid, in-floor JSON and the gate reads real
          # numbers from a process that did not survive producing them.
          $perfRunExit = $LASTEXITCODE
          if (-not (Test-Path $measured)) {
            Write-Error "PerfBenchmark produced no measured JSON at $measured"
            exit 1
          }
          if ($perfRunExit -ne 0 -and $perfRunExit -ne 1) {
            Write-Error "PerfBenchmark CRASHED (exit $perfRunExit). The measured JSON is complete, but the process that wrote it died; those timings are not a pass (GitHub #288)."
            exit 1
          }
          $report = "$env:GITHUB_WORKSPACE\perf-gate-report.json"
          python "$env:GITHUB_WORKSPACE\tools\gate\check_perf_floor.py" `
            --baselines "$env:GITHUB_WORKSPACE\tools\gate\perf_baselines.json" `
            --measured $measured `
            --json-out $report
          $perfExit = $LASTEXITCODE
          $line = "## Performance floor (C-07)"
          if ($perfExit -eq 2) {
            $line += "`nHARD ERROR: a metric was dropped or a baseline is missing — failing (C-07)."
            $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Error "Perf gate hard error (dropped metric / bad input)."
            exit 1
          }
          if ($perfExit -ne 0) {
            $line += "`nA hot path REGRESSED beyond the threshold — failing the job (C-07)."
            $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Error "Perf regression beyond threshold (C-07)."
            exit 1
          }
          $line += "`nAll hot paths within the same-machine regression threshold."
          $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  release:
    name: release
    # Python deps, ctest security, WinAppDriver, Release build, installer, publish.
    # ROLE-ROUTED. This job COMPILES, so it must land on a machine carrying
    # the full MSVC + vcpkg toolchain. `pdfe-builder` is the additive label that
    # says so; consume-only machines deliberately do NOT carry it, so GitHub can
    # never route a build here that the machine cannot perform -- a job on the
    # wrong machine does not fail fast, it fails deep into a compile.
    #
    # ADDITIVE, AND THAT WORD IS LOAD-BEARING. This list read
    # `[self-hosted, Windows, X64, pdfe-builder]` until the phase-2 karen gate
    # pointed out that it REPLACED `pdfe-windows` rather than adding to it. The
    # phase's own description asks for "ADDITIVE labels that never remove
    # today's working set", and dropping the base label also quietly widened
    # eligibility: a machine labelled only [self-hosted, Windows, X64,
    # pdfe-builder] would have matched, losing the pdfe-windows guarantee every
    # other job in this lane still relies on. Both labels are required now.
    #
    # WHAT THIS STILL DOES NOT SATISFY, stated rather than glossed: phase-2's
    # criterion 3 also asks that a runner carrying ONLY the four base labels
    # satisfy every job with no relabeling. That is not achievable together with
    # role routing -- routing by role means a distinguishing label, and a
    # distinguishing label is by definition one a four-label runner lacks. The
    # live runner pdfe-runner-01 was therefore given `pdfe-builder` via the runners
    # API, additively and with NO re-registration, so continuity held in
    # practice. See docs/audit/multi-runner-progress.md for the trade-off
    # against the alternative (no role label, plus a fail-fast toolchain
    # preflight), which detects a misroute instead of preventing it.
    runs-on: [self-hosted, Windows, X64, pdfe-windows, pdfe-builder]
    needs: [build]
    timeout-minutes: 120
    outputs:
      release_built: ${{ steps.build_release.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # clean:false is LOAD-BEARING. actions/checkout defaults to
          # clean:true, which runs `git clean -ffdx`; the -x deletes
          # gitignored files, i.e. the entire build/ tree this job
          # depends on the `build` job having produced.
          clean: false

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Set up vcpkg (manifest mode)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: 15e5f3820f0370f1ba7150853762cec0688cd396

      - name: Install Python UI test dependencies
        # F44: `id:` added — "Run ctest -L security" names this step as a second
        # producer (three of its five CTest entries are `python -m pytest`).
        id: pydeps
        # F46 PRODUCER-GUARD DECISION — UNCONDITIONAL (`!cancelled()`).
        # THE SHARPEST INSTANCE OF THE RELOCATED MASKING. This step sits BELOW
        # the gtest, parity, coverage and perf steps, and had no `if:`, so
        # implicit success() meant any one of those four going red skipped it —
        # and skipping it skipped "Run ctest -L security", which names it as a
        # producer. SEC-23's whole point is that the security-labelled suite ran
        # nowhere; before this guard an unrelated test failure still deleted it.
        # UNCONDITIONAL IS CORRECT HERE, not a blanket sweep: `pip install` of a
        # hash-pinned requirements file consumes NOTHING produced by any earlier
        # step. It needs only python on the runner. There is no upstream failure
        # after which it must not run.
        if: ${{ !cancelled() }}
        # Phase 2 of pipeline f3c91a2e: wire UI E2E into CI. Closes
        # GAP-A1 (no CI step installs pywinauto/Pillow). Deps pinned
        # via tests/ui_automation/requirements-locked.txt
        # (pip-compile --generate-hashes), 33 packages locked.
        shell: pwsh
        run: |
          Write-Host "Installing pinned UI test deps"
          python -m pip install --quiet --upgrade pip
          $req = "$env:GITHUB_WORKSPACE\tests\ui_automation\requirements-locked.txt"
          python -m pip install --quiet --require-hashes -r $req

      - name: Run ctest -L security (meta-audit F5 / SEC-23)
        # THE STEP NAME IS DELIBERATELY UNCHANGED even though this step now also
        # runs `ctest -L lint` (GitHub #162, below). This is one of the eight
        # pinned F44 sites in tools/gate/check_fast_checks_citations.py, and its
        # name is the identifier those controls key on -- the gate's own message
        # is "a rename must not drop a step out of this gate's scope". Renaming
        # it was tried and reverted: it broke G7 against the frozen pre-F44
        # fixture snapshot, which cannot be edited without destroying the
        # evidence that the gate reddens. A more descriptive name is not worth
        # weakening a masking control for.
        #
        # The other half of SEC-23: configuring PDFE_ENABLE_SECURITY_TESTS=ON
        # only REGISTERS the security-labelled CTest entries — this step is
        # what actually RUNS them. Without it the flag would be theatre.
        #
        # Placed AFTER "Install Python UI test dependencies" on purpose: three
        # of the five entries are `python -m pytest` invocations
        # (security_runner_decision_unit / _listener_unit / _firewall_log_unit)
        # and would fail if pytest were not yet installed.
        #
        # -C Debug is REQUIRED, not optional: the Visual Studio generator is
        # multi-config, and `ctest -L security` without -C fails while resolving
        # the per-config include file (reproduced locally 2026-08-01:
        # "include could not find requested file: pdfe_tests[1]_include-.cmake").
        #
        # This step GATES: no continue-on-error, no `|| true`. A failing
        # security entry fails the nightly, which is the entire point of the
        # gap. Skipped for a targeted UI subset dispatch, exactly like the
        # gtest step, because the build it needs is not produced then.
        #
        # F44 STEP-MASKING DECISION — GUARDED, TWO producers. It needs the Debug
        # build (the CTest registration lives in that build tree) AND pytest from
        # "Install Python UI test dependencies", so both are named explicitly.
        # It does NOT depend on the gtest, parity, coverage or perf steps, all of
        # which sit above it.
        #
        # F46 CORRECTION — this comment previously ended "...and all of which
        # used to be able to skip it", asserting a behavioural change that had
        # not happened. Against those four steps the F44 edit changed NOTHING:
        # `pydeps` sits BELOW all four and had no `if:` of its own, so any of the
        # four going red skipped PYDEPS, and this step's own
        # `steps.pydeps.outcome == 'success'` term then skipped the security
        # suite. SEC-23's lane was still deleted by an unrelated red. It is fixed
        # now only because pydeps carries its own `!cancelled()` (see that step's
        # F46 PRODUCER-GUARD DECISION note).
        #
        # WHAT THIS NOW GUARANTEES, exactly: a red gtest, parity, coverage or
        # perf step leaves this security suite running. WHAT IT DOES NOT: a
        # failed Debug build, a genuinely failed `pip install`, or a ui_only
        # dispatch still skip it.
        # Kept on ONE line like the other eight, deliberately. A `>-` folded
        # scalar looks tidier, but YAML does NOT fold lines that are MORE
        # indented than the first content line — it keeps their newlines — so
        # the folded form yields an expression string containing literal `\n`.
        # Actions' expression parser treats those as whitespace, but that is an
        # assumption this repo cannot test locally, and an untestable assumption
        # in the fix for a masking defect is how the masking comes back.
        if: ${{ !cancelled() && (needs.build.outputs.built == 'success' || needs.build.outputs.restored == 'success') && steps.pydeps.outcome == 'success' && !inputs.ui_only }}
        shell: pwsh
        run: |
          # gtest_discover_tests uses DISCOVERY_MODE PRE_TEST, so ctest launches
          # pdfe_tests.exe once to enumerate before running anything. That probe
          # needs the same DLL PATH prefix the "Run pdfe_tests" step documents.
          $buildBin = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $vcpkgDbg = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\debug\bin"
          $vcpkgRel = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$buildBin;$vcpkgDbg;$vcpkgRel;$env:PATH"

          $buildDir = "$env:GITHUB_WORKSPACE\build\vs2022"
          Push-Location $buildDir
          try {
            Write-Host "Security-labelled CTest entries selected by -L security:"
            ctest -C Debug -L security -N
            ctest -C Debug -L security --output-on-failure `
              --output-junit "$env:GITHUB_WORKSPACE\ctest-security-results.xml"
            $ctestExit = $LASTEXITCODE

            # GitHub #162. The four methodology linters are registered with
            # LABELS "lint;methodology", and until now EVERY ctest call in this
            # repo was `-L security` -- so they were registered and never
            # selected, which reads as enforced and executes nowhere. They are
            # also invoked directly from fast-checks.yml (the per-commit lane,
            # where recurrence prevention belongs); this second route closes the
            # label-selection gap #162 is literally about, so the CTest
            # registration stops being decoration.
            #
            # A ctest label filter that matches NOTHING exits 0, so the count is
            # asserted rather than assumed -- otherwise a renamed label would
            # silently restore exactly the gap this step closes.
            Write-Host "Lint-labelled CTest entries selected by -L lint:"
            ctest -C Debug -L lint -N
            $lintListing = (ctest -C Debug -L lint -N | Out-String)
            if ($lintListing -notmatch 'Total Tests:\s*(\d+)' -or [int]$Matches[1] -lt 4) {
              Write-Error "ctest -L lint selected $($Matches[1]) tests; expected the 4 methodology linters. The label filter matches nothing or the registrations were renamed (GitHub #162)."
              exit 1
            }
            foreach ($t in @('lint_save_without_verify','lint_oracle_standard','lint_qt_test_gaps','lint_python_ui_gaps')) {
              if ($lintListing -notmatch [regex]::Escape($t)) {
                Write-Error "ctest -L lint did not select '$t' (GitHub #162)."
                exit 1
              }
            }
            ctest -C Debug -L lint --output-on-failure `
              --output-junit "$env:GITHUB_WORKSPACE\ctest-lint-results.xml"
            $lintExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($ctestExit -ne 0) {
            Write-Error "ctest -L security reported failures (exit $ctestExit). See the output above and ctest-security-results.xml."
            exit 1
          }
          if ($lintExit -ne 0) {
            Write-Error "ctest -L lint reported failures (exit $lintExit). See the output above and ctest-lint-results.xml."
            exit 1
          }
          Write-Host "ctest -L security: clean. ctest -L lint: clean."

      - name: Verify WinAppDriver version (PDFE-LIMITATION-WINAPPDRIVER-V0)
        # F44 STEP-MASKING DECISION — UNCONDITIONAL (`!cancelled()`).
        # Purely informational and already `continue-on-error: true`, so it can
        # never fail the run; being skipped by an unrelated red only costs the
        # record of which WAD version the runner had — which is exactly the
        # datum you want when diagnosing why the UI lane behaved oddly on the
        # run that went red. Cheap, side-effect-free, so it always runs.
        if: ${{ !cancelled() }}
        # Phase 6 of pipeline f3c91a2e. WinAppDriver >= 1.2.1 is required;
        # the 2016 v0 beta answers /status but cannot create sessions.
        # WAD-driven tests self-skip when the service is absent, so this
        # step never fails the run — it records the detected version (or
        # its absence) in the step summary so the WAD test results are
        # interpretable. See tests/docs/winappdriver_setup.md.
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "C:\Program Files (x86)\Windows Application Driver\WinAppDriver.exe"
          $line = "## WinAppDriver"
          if (Test-Path $exe) {
            $ver = (Get-Item $exe).VersionInfo.ProductVersion
            $line += "`nInstalled WinAppDriver version: $ver"
            try {
              $parts = ($ver -split '\.') | ForEach-Object { [int]($_ -replace '\D','') }
              if ($parts.Count -ge 3 -and ($parts[0] -lt 1 -or ($parts[0] -eq 1 -and ($parts[1] -lt 2 -or ($parts[1] -eq 2 -and $parts[2] -lt 1))))) {
                $line += "`n:warning: Below the supported minimum 1.2.1 (PDFE-LIMITATION-WINAPPDRIVER-V0); WAD tests will skip."
              } else {
                $line += "`nMeets minimum 1.2.1 requirement."
              }
            } catch {
              $line += "`nCould not parse version string; relying on session-create probe."
            }
          } else {
            $line += "`nWinAppDriver not installed on this runner; WAD-driven UI tests self-skip."
          }
          $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build PDFE.exe (Release) — needed by Release-tagged UI + render tests
        # F44: `id:` added — "Run render-verification suite" names this step as
        # its producer, so a UI-E2E failure no longer skips the render suite.
        id: build_release
        # F46 PRODUCER-GUARD DECISION — UNCONDITIONAL (`!cancelled()`).
        # Without this, F44's claim that "a UI-E2E failure no longer skips the
        # render suite" was only half-true: the UI E2E step runs BELOW this one
        # so it never could skip it, but the installer build, the installer
        # smoke test, the WinAppDriver probe, the security suite, the perf gate
        # and every earlier red DID skip it via implicit success(), and that
        # skip propagated to the render suite.
        # WHY UNCONDITIONAL: same reasoning as build_debug — the only genuine
        # dependency is Configure, and with no build tree `cmake --build` fails
        # immediately and loudly. Note this is a Release build into the SAME
        # tree, so it does not depend on build_debug succeeding.
        # Same restore term as build_debug, and for the same reason: skipped
        # only when the Release binary has already been restored and verified.
        if: ${{ !cancelled() && needs.build.outputs.restored != 'success' }}
        # Pipeline c4a9e271 Phase 10 fix. The batch-action UI suites
        # (test_ui_batch1_actions / test_ui_batch3_actions / _scenarios / _flows)
        # AND the render-verification suite force PDFE_BUILD_CONFIG=Release
        # (matrix greens are recorded against the Release build), so they resolve
        # build/vs2022/bin/Release/pdfe.exe. Build it BEFORE the UI E2E sweep so
        # those tests find it — previously Release was built only AFTER the sweep,
        # so the batch suites errored "pdfe.exe not found" at setup (run
        # 28186683294: ~78 setup errors). The Release output dir carries its own
        # Qt/vcpkg DLLs (exe-dir wins the DLL search), so a Release pdfe.exe
        # launched from the Debug-PATH UI step still loads Release DLLs — no
        # debug/release mismatch. The Debug PDFE.exe (built above) continues to
        # drive the Debug-tagged test_ui_*.py tests; both configs now coexist.
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build\vs2022" --config Release --target pdfe --parallel 4
          "$env:GITHUB_SHA" | Out-File -FilePath "$env:GITHUB_WORKSPACE\build\vs2022\.pdfe-commit" -Encoding ascii

      - name: Configure the PACKAGING tree (PDFE_TESTING=OFF) — GitHub #182
        id: configure_package
        # WHY A SECOND CONFIGURE TREE, AND WHAT IT COSTS.
        #
        # PDFE_TESTING gates the test-only introspection seams (PDFE_TEST_PIPES:
        # activate a tool by objectName, read back a dialog's child inventory).
        # It is `option(... ON)`, and until GitHub #182 no build path in this
        # repository passed it OFF -- so the #55 mitigation had never reached a
        # shipped binary. The installer below was packaged straight out of
        # `build/vs2022`, the same tree pdfe_tests.exe is configured for.
        #
        # It cannot be fixed by adding a flag to an existing step, because the
        # flag is CONFIGURE-scoped: pdfe_ui is a static library linked into both
        # pdfe.exe and pdfe_tests.exe, and dialogs in several other libraries
        # include src/ui/TestDialogSeam.h, so one compilation cannot serve both
        # postures. Either the UI libraries get duplicated per-target, or the
        # packaged artifact comes from its own tree. This is the second option.
        #
        # HONEST COST: a full Release configure + build of `pdfe` in a tree that
        # shares nothing with build/vs2022 except the vcpkg binary cache. That
        # is real minutes on this job, every run. It buys the only thing that
        # makes #55 true of the artifact users download.
        #
        # F46 PRODUCER-GUARD DECISION — UNCONDITIONAL (`!cancelled()`).
        # This step is itself a producer: the installer step below names it.
        # NOT gated on build_release and NOT skipped on a restore, and the
        # reason is specific rather than inherited. The restore path
        # repopulates build/vs2022 only, so on a restored run the packaging
        # tree does not exist at all; gating on either `build_release` or
        # `needs.build.outputs.restored` would mean precisely the runs that
        # reuse a build silently package NOTHING, and the installer +
        # clean-machine smoke test — the release-blocking "app installs but
        # won't start" guard — would vanish on them. That is the F44/F46
        # masking class, in the step added to close a security gap. Its only
        # genuine dependency is the environment: with no toolchain
        # `cmake --preset` fails immediately and loudly, which is the correct
        # outcome, not a skip.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cmake --preset windows-vs2022-package
          if ($LASTEXITCODE -ne 0) { throw "configuring windows-vs2022-package failed with exit $LASTEXITCODE" }
          # Read the CACHE back. The preset is a claim; the cache is the tree.
          $cache = "$env:GITHUB_WORKSPACE\build\vs2022-package\CMakeCache.txt"
          $line = (Select-String -Path $cache -Pattern '^PDFE_TESTING:BOOL=' | Select-Object -First 1).Line
          if (-not $line) { throw "PDFE_TESTING is absent from $cache -- cannot show the packaging tree has it OFF" }
          if ($line.Trim() -ne 'PDFE_TESTING:BOOL=OFF') {
            throw "packaging tree is configured $($line.Trim()); refusing to package a binary that carries the PDFE_TEST_PIPES seam (GitHub #182)"
          }
          Write-Host "packaging tree verified: $($line.Trim())"

      - name: Build installer (CPack NSIS) from the PACKAGING tree
        # Package the PDFE_TESTING=OFF Release build into the NSIS installer so
        # the dependency smoke test below exercises the ACTUAL shipped bundle
        # (windeployqt Qt runtime deploy + the explicit non-Qt DLL list).
        # pdfe_preflight is part of the package, so build it too. Requires NSIS
        # on the self-hosted runner.
        id: installer
        # F46 PRODUCER-GUARD DECISION — GUARDED, producer = the Release build.
        # Found by the SECOND karen gate on this phase: this step and the smoke
        # test below were still bare, so implicit success() deleted the whole
        # installer-completeness check on any earlier red. That is the same
        # class F44 was opened for, surviving in the same file — which is
        # precisely why F46 exists. Not unconditional: cpack packages the
        # Release tree, so with no Release build there is nothing to package
        # and the smoke test's verdict would be meaningless rather than merely
        # absent.
        #
        # #182 CHANGE OF PRODUCER: the guard now names configure_package, not
        # build_release. build_release populates build/vs2022 for the UI and
        # render suites; this step builds and packages build/vs2022-package,
        # which is a different tree with a different PDFE_TESTING. Gating on the
        # old producer would have been a lie about what this step consumes.
        if: ${{ !cancelled() && steps.configure_package.outcome == 'success' }}
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build\vs2022-package" --config Release --target pdfe pdfe_preflight --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Release build of the packaging tree failed with exit $LASTEXITCODE" }

          # GitHub #199 / #272 -- post-build account-name scrub, INSIDE this step
          # and BETWEEN the build and cpack. The position is the whole point:
          #
          #   * AFTER the build, because the strings it removes are baked in by
          #     the compiler.
          #   * BEFORE cpack, because cpack runs the install() rules that copy
          #     these DLLs into the payload. Scrubbing afterwards would leave the
          #     packaged copies dirty while the source tree looked clean.
          #   * BEFORE any signing, because byte-patching a signed image
          #     invalidates its signature. Nothing in this workflow signs today
          #     (releases are hand-signed on a workstation -- SEC-94's own open
          #     finding), so the ordering is currently free; it is asserted here
          #     rather than left for whoever closes SEC-94 to remember. The tool
          #     also REFUSES any file carrying an Authenticode signature, read
          #     structurally from the PE security directory, so the constraint is
          #     enforced by the tool and not only by step order. Measured: it
          #     correctly identifies 11 signed binaries in a real install tree
          #     (the MSVC redistributables, ONNX Runtime, pdfe_preflight.exe).
          #
          # Rebuilding through a neutral build root is the BETTER fix and closes
          # four of the five affected third-party DLLs outright -- see
          # scripts/Set-NeutralBuildRoot.ps1. This is for what that cannot reach:
          # qtbase needs tens of GB of buildtree and a toolchain on the same
          # drive letter as the build root (#272). So: rebuild if you can, scrub
          # what is left.
          #
          # Verified locally end-to-end: scrubbing the installed tree (12 DLLs,
          # 205 occurrences) and then running the real install rules produced 63
          # binaries with 0 occurrences and an EMPTY allowlist. Every scrubbed
          # shipped DLL was confirmed to still LOAD, and Qt6Widgets.dll was
          # checked byte-for-byte: 12 bytes differ, in exactly 2 runs, each
          # exactly the account name, with an identical 8537-entry export table.
          $scrubRoot = "$env:GITHUB_WORKSPACE\build\vs2022-package\vcpkg_installed\x64-windows-repro\bin"
          if (Test-Path $scrubRoot) {
            python "$env:GITHUB_WORKSPACE\tools\gate\scrub_package_account_name.py" $scrubRoot
            if ($LASTEXITCODE -ne 0) { throw "post-build account-name scrub FAILED (GitHub #199); refusing to package" }
          } else {
            # Not a silent skip: if the path moves, the scrub must stop the
            # build rather than quietly do nothing and let a dirty payload ship.
            throw "scrub root not found: $scrubRoot -- the vcpkg installed tree moved, so the account-name scrub would silently cover nothing (GitHub #199)"
          }

          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsis) { $env:PATH = "$env:PATH;$nsis" }
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\build\vs2022-package\_CPack_Packages" -ErrorAction SilentlyContinue
          cpack -C Release -G NSIS --config "$env:GITHUB_WORKSPACE\build\vs2022-package\CPackConfig.cmake"
          if ($LASTEXITCODE -ne 0) { throw "cpack (NSIS installer) failed with exit $LASTEXITCODE" }

      - name: Verify installer is self-contained (clean-machine DLL smoke test)
        # Guards the "app installs but won't start -- Qt6*.dll was not found" class
        # of bug (v0.1.0 shipped without Qt6Network/Qt6Svg). Extracts the installer
        # and launches pdfe.exe with PATH stripped to the Windows system dirs only,
        # so the loader must resolve every dependency from inside the bundle -- the
        # build box's own vcpkg DLLs on PATH otherwise mask a missing bundled DLL.
        # Fails the job if pdfe.exe cannot reach its main window.
        #
        # F44 STEP-MASKING DECISION — GUARDED, producer = the installer build.
        # It extracts and launches the packaged bundle, so it genuinely cannot
        # run without one; `== 'success'` is the honest relation here, unlike
        # the `!= 'skipped'` cases above which adjudicate an artefact written
        # before their producer fails. What this removes is the OTHER path: a
        # red gtest, parity, coverage, perf, security or render step used to
        # skip this check silently, so the release-blocking "app installs but
        # won't start" guard vanished on exactly the runs most likely to ship
        # something broken.
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        shell: pwsh
        run: |
          pwsh -File "$env:GITHUB_WORKSPACE\scripts\verify-installer-deps.ps1"
          if ($LASTEXITCODE -ne 0) { throw "installer dependency smoke test FAILED -- bundle is missing a runtime DLL" }

      - name: Installer payload carries no build account name (GitHub #199 / #191)
        # #199 found 418 occurrences of the build account name across 6 SHIPPED
        # binaries. Nothing caught it, and the reason is a population gap rather
        # than a missing check: UiSuitePathHygiene and check_tracked_path_hygiene
        # both scan files under git control, and every one of these is build
        # output. #160 widened that population to untracked files via
        # `git ls-files --others --exclude-standard`, but --exclude-standard
        # honours .gitignore and .gitignore:8 is `build/`, so the widening could
        # not see them either. This step scans a different population: the bytes
        # that actually ship.
        #
        # It runs AFTER the installer step and scans the EXTRACTED PAYLOAD, not
        # the build directory. Measured: build/vs2022/bin/Release has nine
        # binaries carrying the name, three of which (pdfe_tests.exe, gtest.dll,
        # Qt6Test.dll) the installer never ships -- pdfe_tests.exe alone has 850
        # occurrences, correct and expected for a binary nobody distributes.
        # Scoped to the build directory this guard would fail permanently on a
        # non-defect, which is how a guard ends up switched off.
        #
        # It must also run BEFORE code signing: PDFE's release exe is signed,
        # and byte-patching a signed image invalidates the signature. This
        # workflow does not sign (releases are hand-signed on a workstation --
        # SEC-94's own open finding), so there is nothing to order against here;
        # the constraint is recorded for whoever closes SEC-94.
        #
        # F44 STEP-MASKING: GUARDED on the installer, producer = the thing it
        # extracts. It genuinely cannot run without an installer, so
        # `== 'success'` is the honest relation -- the same reasoning as the
        # dependency smoke test above.
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        shell: pwsh
        run: |
          pwsh -File "$env:GITHUB_WORKSPACE\scripts\verify-installer-no-account-name.ps1"
          if ($LASTEXITCODE -ne 0) { throw "the shipped installer payload carries the build account name (GitHub #199 / #191)" }

      - name: Generate release SBOM (SEC-95 / GitHub #71)
        id: release_sbom
        # GitHub #71 (SEC-95) asks to "attach tests/security/reports/deps/
        # sbom.spdx.json as a release asset in the same workflow as SEC-94".
        # SEC-94 (signing invoked by CI) does NOT exist: this repo has no
        # `gh release create`/`gh release upload` anywhere (verified: zero
        # hits for either in .github/workflows/) -- releases are hand-signed
        # on a workstation, which is SEC-94's own still-open finding. There is
        # therefore no GitHub Release object for this step to attach to.
        #
        # The closest present equivalent is THIS job's own installer package:
        # it is the release artifact CI already produces (built above, smoke-
        # tested above). This step generates the SBOM and the next uploads it
        # as an Actions artifact alongside that installer's build metadata --
        # not a GitHub Release asset, but the nearest thing that exists today.
        # If/when SEC-94 is closed with a real `gh release create` step, that
        # step should attach this job's SBOM output directly instead of
        # re-deriving one. See docs/audit/backlog-p82/phase-13/notes.md.
        #
        # SBOM-ONLY (-SkipOsv -SkipCargoAudit): a release build must not fail
        # on CVE-baseline noise unrelated to whether the binary itself built
        # and installed correctly -- that gating already happens on its own
        # cadence in dependency-audit.yml (#50/#63). This step's only job is
        # to record exactly what shipped.
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -File "$env:GITHUB_WORKSPACE\scripts\security\run_deps.ps1" -VcpkgRoot $env:VCPKG_ROOT -SkipOsv -SkipCargoAudit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::release SBOM generation reported exit $LASTEXITCODE -- see run_deps.ps1 output above. Not failing the release job on this (continue-on-error): a missing/partial SBOM should be visible, not block a build that otherwise installed and ran correctly."
          }

      - name: Publish the build for reuse by later shards
        id: publish_build
        # F46 PRODUCER-GUARD DECISION — DEPENDENT, on having actually built.
        # It became a producer when the artifact upload below started naming it,
        # so the decision has to be stated here rather than inferred.
        #
        # Dependent and not unconditional, because publishing a store from a run
        # that RESTORED one would rewrite the store from a copy of itself; and
        # both `built` and `build_release` must have succeeded or the closure is
        # incomplete — an incomplete store is exactly what the restore's
        # completeness check exists to reject, and writing one deliberately
        # would be manufacturing the failure downstream.
        #
        # `!cancelled()` rather than implicit success(): an unrelated red step
        # must not silently turn a publish into a skip, because the next run's
        # reuse would then find nothing and no one would know why.
        #
        # Runs when a build actually happened (not when this run itself was a
        # restore) and both configurations are present. Never fails the job:
        # publishing is an optimisation, and a validation lane must not go red
        # because a cache write did not work.
        if: ${{ !cancelled() && needs.build.outputs.restored != 'success' && needs.build.outputs.built == 'success' && steps.build_release.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $src   = "$env:GITHUB_WORKSPACE\build\vs2022"
          $store = "C:\pdfe-build-store\$env:GITHUB_SHA"
          try {
            # Publish the RUNTIME CLOSURE only — what the test steps consume.
            # Object files are ~3.2 GB of the 5.5 GB tree and no test reads
            # them; excluding them is most of the saving.
            $parts = @(
              @{ from = "$src\bin";                                   to = "$store\bin" },
              @{ from = "$src\vcpkg_installed\x64-windows\bin";       to = "$store\vcpkg_installed\x64-windows\bin" },
              @{ from = "$src\vcpkg_installed\x64-windows\debug\bin"; to = "$store\vcpkg_installed\x64-windows\debug\bin" }
            )
            Remove-Item $store -Recurse -Force -ErrorAction SilentlyContinue
            foreach ($p in $parts) {
              if (Test-Path $p.from) {
                New-Item -ItemType Directory -Path $p.to -Force | Out-Null
                Copy-Item "$($p.from)\*" $p.to -Recurse -Force
              }
            }
            # CTest manifests: `ctest -L security` needs them, and they are tiny.
            Get-ChildItem $src -Recurse -Filter 'CTestTestfile.cmake' -ErrorAction SilentlyContinue |
              ForEach-Object {
                $rel = $_.FullName.Substring($src.Length).TrimStart('\')
                $out = Join-Path $store $rel
                New-Item -ItemType Directory -Path (Split-Path $out) -Force | Out-Null
                Copy-Item $_.FullName $out -Force
              }

            # The marker is written LAST and is what the restore trusts. Written
            # last so an interrupted publish leaves a store the restore refuses,
            # rather than a half-copied one it accepts.
            "$env:GITHUB_SHA" | Out-File -FilePath (Join-Path $store 'published-sha.txt') -Encoding ascii

            $size = (Get-ChildItem $store -Recurse -File | Measure-Object -Property Length -Sum).Sum
            Write-Host ("Published {0:N1} GB to {1}" -f ($size / 1GB), $store)
            # PUBLISH TO R2, if this machine is configured for it. A restore leg
            # with nothing writing to it is INERT -- which is precisely the
            # defect a security-audit gate found in the artifact path, where the
            # download could never have found anything. Adding the consumer
            # without the producer would repeat it.
            #
            # Non-fatal like the rest of publishing, and for the same reason: a
            # validation lane must not go red because a cache write failed. The
            # consequence surfaces later as ensure-build-tree's loud refusal.
            #
            # Credentials are MACHINE-LEVEL env only -- never workflow secrets.
            $r2e = $env:PDFE_R2_ENDPOINT; $r2b = $env:PDFE_R2_BUCKET
            $r2k = $env:PDFE_R2_ACCESS_KEY_ID; $r2s = $env:PDFE_R2_SECRET_ACCESS_KEY
            if ($r2e -and $r2b -and $r2k -and $r2s) {
              if (Get-Command aws -ErrorAction SilentlyContinue) {
                try {
                  $zip = Join-Path $env:RUNNER_TEMP "r2-$env:GITHUB_SHA.zip"
                  Remove-Item $zip -Force -ErrorAction SilentlyContinue
                  Compress-Archive -Path "$store\*" -DestinationPath $zip -CompressionLevel Fastest
                  $env:AWS_ACCESS_KEY_ID = $r2k
                  $env:AWS_SECRET_ACCESS_KEY = $r2s
                  $env:AWS_DEFAULT_REGION = 'auto'
                  aws s3 cp $zip "s3://$r2b/pdfe-build/$env:GITHUB_SHA.zip" --endpoint-url $r2e --only-show-errors
                  if ($LASTEXITCODE -eq 0) {
                    Write-Host ("published to R2: pdfe-build/$env:GITHUB_SHA.zip ({0:N2} GB)" -f ((Get-Item $zip).Length / 1GB))
                  } else {
                    Write-Host "::warning::R2 upload failed (non-fatal); a cold machine will refuse loudly instead."
                  }
                  Remove-Item $zip -Force -ErrorAction SilentlyContinue
                } catch {
                  Write-Host "::warning::R2 publish threw (non-fatal): $($_.Exception.Message)"
                }
              } else {
                Write-Host "::warning::R2 configured but the aws CLI is absent; nothing published to R2."
              }
            } else {
              Write-Host "R2 not configured on this machine; local store only."
            }

            Write-Host "Reuse it with: reuse_published_build=<any value> on a shard dispatch of this same commit."

            # Keep only the most recent few commits' stores. 2.3 GB each on a
            # box that measured 41.8 GB free is worth bounding.
            #
            # -Skip 6, NOT 3. Each commit now occupies TWO directories --
            # `<sha>` (full closure, published here) and `<sha>-debug`
            # (published by the `build` job for core-tests). Leaving this at 3
            # would have kept one and a half commits and silently pruned the
            # debug store of the commit currently under test, turning a warm
            # machine cold mid-run.
            #
            # CRASH PINS ARE EXEMPT. A store holding `crash-pin.txt` is the
            # PDB that some uploaded crash dump needs in order to mean anything
            # (the report job writes the pin when a run produces dumps). Pruning
            # it turns a 25-50 MB dump into an address with no symbols -- which
            # is exactly what happened to the 2026-08-13 dumps and cost the only
            # diagnosis of a live use-after-free. A dump and its PDB have to
            # share a lifetime or the dump is storage without information.
            # EXPIRE PINS FIRST. A pin exempts a ~2.5 GB store from pruning, and
            # the first version of this never removed one -- so every commit
            # whose run crashed retained its store FOREVER, on a box measured at
            # 41.8 GB free. The phase-2 security-audit gate called that an
            # unbounded-growth risk and it is right: disk exhaustion on this
            # project has previously presented as an unrelated failure.
            #
            # A pin exists to outlive the DUMP ARTIFACT that references it, and
            # that artifact is retained 3 days. 14 days is that with a wide
            # margin for someone acting on a crash late; past it the dump is
            # gone from GitHub and the PDB is protecting nothing.
            $PIN_MAX_AGE_DAYS = 14
            Get-ChildItem "C:\pdfe-build-store" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {
                $p = Join-Path $_.FullName 'crash-pin.txt'
                if ((Test-Path $p) -and ((Get-Item $p).LastWriteTime -lt (Get-Date).AddDays(-$PIN_MAX_AGE_DAYS))) {
                  Write-Host "  expiring crash pin on $($_.Name) (older than $PIN_MAX_AGE_DAYS days; its dump artifact is long gone)"
                  Remove-Item $p -Force -ErrorAction SilentlyContinue
                }
              }

            Get-ChildItem "C:\pdfe-build-store" -Directory -ErrorAction SilentlyContinue |
              Where-Object { -not (Test-Path (Join-Path $_.FullName 'crash-pin.txt')) } |
              Sort-Object LastWriteTime -Descending | Select-Object -Skip 6 |
              ForEach-Object {
                Write-Host "  pruning old store $($_.Name)"
                Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
              }

            # Report the pinned set and shout if it is getting expensive. A
            # bound nobody can see is a bound nobody maintains.
            $pinned = @(Get-ChildItem "C:\pdfe-build-store" -Directory -ErrorAction SilentlyContinue |
                        Where-Object { Test-Path (Join-Path $_.FullName 'crash-pin.txt') })
            $pinnedGb = 0
            foreach ($d in $pinned) {
              $sz = (Get-ChildItem $d.FullName -Recurse -File -ErrorAction SilentlyContinue |
                     Measure-Object -Property Length -Sum).Sum
              $pinnedGb += ($sz / 1GB)
              Write-Host ("  KEPT (crash-pinned, holds a PDB some dump needs): {0}  {1:N1} GB" -f $d.Name, ($sz / 1GB))
            }
            if ($pinnedGb -gt 10) {
              Write-Host ("::warning::crash-pinned build stores now total {0:N1} GB across {1} commit(s). Crashes are pinning more disk than they are worth -- fix the crashes or lower PIN_MAX_AGE_DAYS." -f $pinnedGb, $pinned.Count)
            }
          } catch {
            Write-Host "publish failed (non-fatal): $($_.Exception.Message)"
          }
          exit 0

      - name: Upload the published build as an ARTIFACT (cross-machine reuse)
        # THE ONLY THING THAT MAKES REUSE WORK ACROSS MACHINES. The local store
        # is per-machine; with 2-4 runners the machine that builds is usually not
        # the machine that tests. This uploads the same closure the local publish
        # just wrote, under a SHA-keyed name the restore's download step looks up.
        #
        # OFF BY DEFAULT, and that is not timidity -- the account's artifact
        # storage quota is EXHAUSTED right now (the reporting job's upload fails
        # every run with "Artifact storage quota has been hit"). So the operator
        # turns it on once the quota is freed.
        #
        # CORRECTION: an earlier version of this comment said `continue-on-error`
        # "is not available -- this lane forbids it". That was wrong on both
        # counts. The lane already uses it once (the WinAppDriver version probe),
        # and G2, the rule that forbids it, only ever covered fast-checks.yml and
        # governance.yml -- windows-validation.yml was never in its scope. I
        # asserted an enforced rule that was not enforced. G2 now covers this
        # file with an explicit allowlist, so the claim is mechanical.
        #
        # WHY IT IS SAFE HERE, where it was catastrophic at R-32 and GAP-A15:
        # there it swallowed a TEST failure, turning a red suite green. This step
        # is an OPTIMISATION -- nothing in this run consumes its output. If the
        # upload silently fails, the next run's restore finds no artifact and
        # refuses LOUDLY ("no published build for this commit"). The failure
        # surfaces as a refusal later, never as a false green now. That
        # distinction, not the flag, is what matters.
        #
        # retention-days: 1 -- a build is only reusable for its own commit, and
        # the restore refuses any other, so nothing here has value past the run
        # that follows it. The shortest retention is also the smallest quota
        # footprint, which is the constraint that matters here.
        #
        # STATUS, stated plainly so nobody reads this as working: the LOCAL
        # publish/restore has run in CI (a store exists, verified on disk). The
        # ARTIFACT path -- this step and the download in `build` -- has NEVER
        # executed in CI, because the quota blocks it. What IS proven is that
        # the two ends agree on name and path and that the download feeds the
        # SAME verifier the local path uses, so the four refusal cases (no
        # marker, wrong commit, incomplete, nothing published) apply to it
        # unchanged: tools/gate/test_build_reuse_roundtrip.py, 14 checks.
        # Mechanism proven; live round-trip not. Do not conflate the two.
        if: ${{ !cancelled() && inputs.publish_build_artifact != '' && steps.publish_build.outcome == 'success' }}
        # Non-fatal: a validation lane must not go red because a cache write
        # did not work. Mirrors the local publish step, which wraps itself in
        # try/catch and exits 0 for the same reason.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pdfe-build-${{ github.sha }}
          path: C:\pdfe-build-store\${{ github.sha }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload release SBOM (SEC-95 / GitHub #71)
        # Independent of the quota-gated closure upload above -- this is a
        # few KB of JSON, not a 2.3 GB runtime closure, so it is not worth
        # tying to the same off-by-default flag. `if-no-files-found: warn`
        # rather than `error`: the generation step above is continue-on-error
        # by design (see its own comment), so a missing SBOM here is a
        # DOWNSTREAM symptom of something already reported, not a new failure
        # to invent.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pdfe-release-sbom-${{ github.sha }}
          path: |
            tests/security/reports/deps/sbom.spdx.json
            tests/security/reports/deps/summary.md
          if-no-files-found: warn
          retention-days: 90

  ui-e2e:
    name: ui-e2e ${{ matrix.shard }}/3
    # THE UI LEG, SPLIT ACROSS JOBS -- which is what the criterion asked for and
    # what the first chained run proved is necessary.
    #
    # WHY, measured rather than assumed. Run 32325290538 ran this leg UNSHARDED
    # and was killed at exactly 360 minutes having reached file 42 of 126. The
    # 360 came from run 32295095067's UI step taking 3 h 02 m -- but that run
    # logged `shard 1/3 -> 42 of 126 file(s)`, so the figure measured ONE THIRD
    # of the suite and was recorded as "unsharded". At the measured 4.35
    # min/file, all 126 files is ~548 min (9.1 h); no single-job budget under
    # the 720-minute cap was ever going to hold it.
    #
    # Three shards of ~183 min each, with a 300-minute budget apiece. On this
    # single runner they still execute one at a time -- the matrix buys each
    # shard its OWN timeout and lets one failed shard be re-run alone, not
    # wall-clock reduction.
    strategy:
      fail-fast: false      # one shard's failure must not cancel the others
      matrix:
        shard: [1, 2, 3]
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    needs: [build, release]
    # 300 -> 480, for the same reason as `build` above and found while fixing it:
    # this cap CONTRADICTS THE SHARD SIZING IN THIS FILE'S OWN `ui_shards` input,
    # which states the sweep is ~1163 min across 3 shards — ~388 min of UI per
    # shard. A 300-minute cap kills each shard at roughly 77% of its files, and
    # does it as `cancelled`, so a partition designed so that "nothing is skipped"
    # would in fact have skipped the tail of every shard while reporting a status
    # that alerts nobody.
    #
    # Not yet observed, because no shard has run to that point: both 2026-10-03
    # runs died in `build` first. Raised now rather than left as a second trip
    # over the same wire.
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # clean:false is LOAD-BEARING. actions/checkout defaults to
          # clean:true, which runs `git clean -ffdx`; the -x deletes
          # gitignored files, i.e. the entire build/ tree this job
          # depends on the `build` job having produced.
          clean: false

      - name: Ensure the build tree is present (same machine or restored)
        # See core-tests for the full rationale. This job needs BOTH configs:
        # the Debug PDFE.exe drives the Debug-tagged test_ui_*.py majority, and
        # the four Release-tagged batch suites resolve bin\Release\pdfe.exe. It
        # declares `needs: [build, release]`, so the FULL closure published by
        # `release` exists by the time this starts -- which is why this job uses
        # the unsuffixed store key and core-tests cannot.
        if: ${{ !cancelled() }}
        uses: ./.github/actions/ensure-build-tree
        with:
          store-key: ${{ github.sha }}
          artifact-name: pdfe-build-${{ github.sha }}
          github-token: ${{ github.token }}
          required-files: |
            bin/Debug/pdfe.exe
            bin/Release/pdfe.exe

      - name: Run UI E2E suite (pywinauto + pyautogui via pytest)
        # F44: `id:` added — "Matrix-health gate" names this step as its
        # producer, and must run when this step FAILED (see that step's note).
        id: ui_e2e
        # F46 PRODUCER-GUARD DECISION — GUARDED, WITH A REAL PRODUCER TERM.
        # This is the one producer of the four that is NOT unconditional, and
        # the difference is deliberate. With no `if:` at all, implicit success()
        # let the installer build, the installer DLL smoke test, the security
        # suite, the perf gate — anything red above — skip this sweep, and that
        # skip propagated to the Matrix-health gate, defeating the very
        # `!= 'skipped'` semantics F44 chose for it. `!cancelled()` fixes that.
        # BUT it must NOT be unconditional: this sweep drives the real native
        # PDFE.exe from build_debug (PDFE_EXE below points straight at it). If
        # that build failed there is no executable, every test in the sweep
        # errors at session setup — run 28186683294 recorded ~78 such setup
        # errors from a missing exe — and the run costs hours to produce pure
        # noise, plus a matrix aggregate of all-red rows that would make the
        # Matrix-health gate report a fake regression in every committed-green
        # row. So: run whenever the Debug build succeeded, whatever else failed.
        # NOT conditioned on build_release: only the four Release-tagged batch
        # suites need that exe, the Debug-tagged majority still yields real
        # signal, and those four erroring is a TRUE consequence of a broken
        # Release build rather than something to hide.
        # NOT conditioned on `!inputs.ui_only`: a ui_only dispatch exists in
        # order to run this sweep.
        if: ${{ !cancelled() && (needs.build.outputs.built == 'success' || needs.build.outputs.restored == 'success') }}
        # Pipeline f3c91a2e. Builds PDFE.exe, sets the DLL PATH, invokes all
        # tests/test_ui_*.py + tests/ui_automation/test_*.py through the real
        # native PDFE window via tests/scripts/run_ui_suite.py.
        #
        # GATING (phase-8, GAP-A15-style false-green fix): run_ui_suite.py
        # ALWAYS exits 0 by design (its result lives in ui-suite-summary.json,
        # because per-file pytest subprocesses + reruns mean the wrapper's own
        # exit code is meaningless). Trusting that exit code — as the prior
        # Phase-2 `continue-on-error: true` configuration did — let the job go
        # green regardless of UI failures, the same false-green the gtest layer
        # had. We therefore REMOVE continue-on-error and explicitly gate on the
        # summary JSON below: any unresolved failing test OR any file with a
        # crash/timeout after reruns fails this job.
        shell: pwsh
        env:
          # Surface the EXE path so tests/helpers/pdfe_session.py and
          # the test_ui_*.py modules can find it regardless of CWD.
          PDFE_EXE: ${{ github.workspace }}\build\vs2022\bin\Debug\PDFE.exe
          # Cumulative single-session journey soak (pipeline f4a82c1e P4 CI lane).
          # run_ui_suite.py's `test_ui_*.py` glob already collects
          # test_ui_journey_soak.py (the long-lived journey against the committed
          # CI-portable corpus; SpecimenA variant skip-if-absent) AND
          # test_ui_save_lock_rebind.py (the P3 onSaveFile drain/rebind check),
          # so no separate job is needed. Bound the journey op budget EXPLICITLY
          # here rather than relying on the harness default: JOURNEY_OP_BUDGET=120
          # is ~30 min wall-clock (P2 measured ~9.5 min / 40 ops), comfortably
          # inside this job's 720-min timeout (> the ~9h self-hosted budget) and
          # under the per-file cap in run_ui_suite.py FILE_TIMEOUT_OVERRIDES_S. An
          # extended/nightly run raises it via the repo/workflow variable
          # JOURNEY_OP_BUDGET (env-tunable; see the methodology doc §8).
          JOURNEY_OP_BUDGET: ${{ vars.JOURNEY_OP_BUDGET || '120' }}
        run: |
          # PURGE STALE CRASH DUMPS, EXACTLY ONCE PER RUN. The other half of the
          # phase-2 security-audit finding: clearing only the upload staging dir
          # still lets a PREVIOUS run's dumps sit in ui-out/crashdumps and be
          # re-copied into a fresh staging dir by a later crashy run, so the same
          # sensitive bytes get a new 3-day clock and the wrong provenance.
          #
          # WHY AN EPOCH MARKER AND NOT AN UNCONDITIONAL DELETE. This job is a
          # THREE-SHARD MATRIX on one machine. A per-shard delete would destroy
          # shard 1's dumps when shard 2 starts, and `report` runs after all
          # three -- so the evidence would be gone precisely when a crash
          # happened early. The marker records which run owns the directory:
          # the first shard of a new run purges, later shards of the SAME run
          # leave it alone and add to it.
          $dumpDir = "$env:GITHUB_WORKSPACE\ui-out\crashdumps"
          $epoch   = "$env:GITHUB_WORKSPACE\ui-out\.crashdump-epoch"
          $owner   = if (Test-Path $epoch) { (Get-Content $epoch -Raw).Trim() } else { "" }
          if ($owner -ne "$env:GITHUB_RUN_ID") {
            $stale = @(Get-ChildItem $dumpDir -Filter *.dmp -File -ErrorAction SilentlyContinue)
            if ($stale.Count -gt 0) {
              Write-Host "::warning::purging $($stale.Count) crash dump(s) left by run $owner before starting run $env:GITHUB_RUN_ID"
            }
            Remove-Item $dumpDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $dumpDir -Force | Out-Null
            "$env:GITHUB_RUN_ID" | Out-File -FilePath $epoch -Encoding ascii
          } else {
            Write-Host "crash dump dir already owned by this run ($env:GITHUB_RUN_ID); keeping earlier shards' dumps."
          }

          $buildBin = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug"
          $vcpkgDbg = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\debug\bin"
          $vcpkgRel = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$buildBin;$vcpkgDbg;$vcpkgRel;$env:PATH"

          if (-not (Test-Path "$buildBin\PDFE.exe")) {
            Write-Error "PDFE.exe not found at $buildBin\PDFE.exe"
            exit 1
          }

          $junitXml = "$env:GITHUB_WORKSPACE\ui-junit.xml"
          $logPath  = "$env:GITHUB_WORKSPACE\ui-suite.log"
          Write-Host "Launching pytest UI suite. PDFE_EXE=$env:PDFE_EXE"

          # Use the per-file isolation runner (tests/scripts/run_ui_suite.py)
          # rather than a single pytest invocation. Background: on the
          # prior run (27097560166), the UI suite collected 3015 tests
          # and only ~30 of them in test_ui_file_operations.py ran
          # before test_export_plain_text_opens_save_dialog hung
          # pywinauto inside a native COM call that pytest-timeout's
          # thread-method could not interrupt. pytest-timeout then
          # hard-killed the entire pytest process via os._exit(1),
          # aborting every remaining test in the session.
          #
          # The wrapper script gives each UI test file its own pytest
          # subprocess with a 20-min outer wall-clock timeout, so a
          # single hung test kills only its file's pytest — the rest
          # of the suite continues. Per-test 120s pytest-timeout is
          # still applied inside each pytest. After each file, the
          # wrapper taskkill's pdfe.exe to clean up any leaked window.
          #
          # Outputs land in $outDir/ui-junit-merged.xml (combined
          # JUnit XML for the publish step) and
          # $outDir/ui-suite-summary.json (per-file stats + failure
          # list — the Phase 3 input).
          $outDir = "$env:GITHUB_WORKSPACE\ui-out"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          # --file-timeout 5400 = 90-min hard wall-clock ceiling per test file
          # (pipeline c4a9e271 Phase 10). The per-test pytest-timeout=120 stays
          # the inner cap; the heavy all-pass-but-slow files have their own
          # FILE_TIMEOUT_OVERRIDES_S (all < 90 min). run_ui_suite.py taskkills
          # pdfe.exe between every file (the orphan watchdog before the next
          # file starts).
          # --only is empty on push/PR/full-dispatch (runs every file) and a
          # comma-separated filter on a targeted subset dispatch.
          python "$env:GITHUB_WORKSPACE\tests\scripts\run_ui_suite.py" `
              --repo-root "$env:GITHUB_WORKSPACE" `
              --output-dir $outDir `
              --pdfe-exe "$env:PDFE_EXE" `
              --file-timeout 5400 `
              --only "${{ inputs.ui_only }}" `
              --shard ${{ matrix.shard }} `
              --shards 3 `
              *>&1 | Tee-Object -FilePath $logPath
          # Stage merged junit at the location the publish step reads.
          Copy-Item "$outDir\ui-junit-merged.xml" $junitXml -Force -ErrorAction SilentlyContinue
          Write-Host "run_ui_suite.py exit code (always 0 by design): $LASTEXITCODE"

          # False-green backstop: gate on the summary JSON, not the exit code.
          $summaryPath = "$outDir\ui-suite-summary.json"
          if (-not (Test-Path $summaryPath)) {
            Write-Error "UI suite summary not found ($summaryPath) — the suite did not complete; failing the job."
            exit 1
          }
          $sum = Get-Content $summaryPath -Raw | ConvertFrom-Json
          $failingTests   = [int]$sum.failure_count
          $filesWithProbs = [int]$sum.files_with_problems_count
          Write-Host ("UI E2E: files_run={0} tests={1} failing_tests={2} files_with_problems={3}" -f `
            $sum.files_run, $sum.totals.tests, $failingTests, $filesWithProbs)
          $unresolved = $failingTests + $filesWithProbs
          if ($unresolved -gt 0) {
            # NAME THE EVIDENCE THAT SURVIVES. All three shards run sequentially
            # on ONE machine and write the SAME $GITHUB_WORKSPACE\ui-out, and
            # ui-suite-summary.json / ui-junit-merged.xml are unsuffixed -- so
            # each shard overwrites them and the uploaded pair reflects only the
            # LAST shard. Pointing shard 1 and 2 readers at those two files
            # sends them to the one place that cannot answer for their run:
            # measured on run 38198875534, where shard 1's 12 failures were not
            # recoverable from them. That is GitHub #278's defect showing up in
            # the failure message rather than in the file.
            #
            # ui-out/per-file/<slug>.{xml,log} DOES survive, because sharding
            # splits by FILE so the per-file names never collide, and `report`
            # uploads ui-out/** including it.
            Write-Error ("UI E2E suite FAILED (shard ${{ matrix.shard }}/3): $failingTests failing test(s) + $filesWithProbs file(s) with crash/timeout, unresolved after reruns. PER-SHARD evidence is ui-out/per-file/<test-file>.xml and .log in the windows-validation-logs artifact, and THIS shard's own summary is ui-out/ui-suite-summary.shard${{ matrix.shard }}of3.json. The run-wide aggregate over all three shards is ui-out/ui-suite-summary-merged.json, written by the matrix-health job (GitHub #278). NOTE the unsuffixed ui-suite-summary.json / ui-junit-merged.xml are shared across all three shards and reflect only the LAST one to run -- do not read them for this shard.")
            exit 1
          }
          Write-Host "UI E2E suite clean: 0 unresolved failures after reruns."
          exit 0

  crash-dumps:
    name: crash-dumps
    # GitHub #237. A run that crashed PDFE is not a passing run.
    #
    # This lane already purges, collects and uploads dumps -- and until now
    # nothing failed when one appeared, so the application could terminate any
    # number of times and the job stayed green. That is how 13 dumps from two
    # separate defects (#234, #235) went unnoticed on 2026-09-19.
    #
    # #235 is why this is a job and not a nice-to-have: fixing it changed NO
    # test result. Measured on the same file, 2 dumps -> 0 dumps with the same
    # two failing tests either way. The dumps were the only evidence it existed.
    #
    # Runs after ui-e2e (which produces them) and is NOT gated on ui-e2e's
    # success: a crash matters most when the suite went green anyway.
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    needs: [ui-e2e]
    if: ${{ !cancelled() }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          clean: false

      - name: No crash dumps belong to this run
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python tools/gate/check_crash_dumps.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "check_crash_dumps self-test failed" }
          # --run-id is what keeps a PREVIOUS run's dumps from failing this one:
          # the dump dir is shared across the three UI shards on one machine and
          # is deliberately not purged per shard, so `.crashdump-epoch` records
          # which run owns it.
          python tools/gate/check_crash_dumps.py `
            --dump-dir "$env:GITHUB_WORKSPACE\ui-out\crashdumps" `
            --epoch    "$env:GITHUB_WORKSPACE\ui-out\.crashdump-epoch" `
            --run-id   "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "PDFE crashed during this run -- see the dump list above and the private R2 bucket"
          }

  matrix-health:
    name: matrix-health
    # SPLIT OUT OF ui-e2e because the leg is now sharded. Judging ONE shard
    # against the whole closeout matrix fails every sharded run on a condition
    # that is the point of sharding -- every committed-green row owned by the
    # other shards "did not run". That is exactly why the old in-job step was
    # guarded off whenever ui_shards > 1, i.e. the gate silently stopped
    # existing the moment sharding was used.
    #
    # It runs here instead, once, over the MERGED per-shard aggregates:
    # check_matrix_health.py --runtime-shard-dir merges them, refusing to let a
    # shard's `no-run` overwrite another shard's real result and refusing to
    # guess when two shards disagree. So sharding no longer costs us the gate.
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    needs: [ui-e2e]
    if: ${{ !cancelled() && !inputs.ui_only }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          clean: false

      # GitHub #313. THIS JOB CONSUMES THE BUILD TREE AND DID NOT RESTORE IT.
      #
      # `clean: false` preserves a tree this machine produced; it can do
      # nothing for a job routed to a machine that never built, which is
      # exactly what a second runner carrying `pdfe-windows` makes possible.
      # On today's single-runner topology the omission is invisible; the moment
      # a second machine carries the label this job fails on a missing exe,
      # naming the symptom and not the cause.
      #
      # It matters more here than the label suggests: this is the job that
      # writes the merged cross-shard UI aggregate (GitHub #278), so a routing
      # change takes that fix down with it and blames a missing binary.
      #
      # `!cancelled()` rather than implicit success(), per this lane's
      # convention: a red step above must not turn the restore into a skip,
      # because a skipped restore leaves everything below failing on a missing
      # exe -- the cause-hiding cascade these guards exist to remove.
      - name: Ensure the build tree is present (GitHub #313)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/ensure-build-tree
        with:
          # The DEBUG closure, as the other consumers of this lane use. This
          # job needs the matrix/summary artefacts and the app binary, not the
          # full release closure.
          store-key: ${{ github.sha }}-debug
          artifact-name: pdfe-build-debug-${{ github.sha }}
          github-token: ${{ github.token }}
          # NON-EMPTY ON PURPOSE. `check_ensure_build_tree.py` rejects an empty
          # list, and it is right to: both the workspace probe and the
          # completeness check iterate it, so an empty list makes the action
          # report "restored" over an empty directory -- a restore step that
          # cannot fail. The guard caught exactly that in the first version of
          # this step.
          #
          # `bin/Debug/pdfe.exe` and nothing more: this job reads the merged
          # per-shard UI aggregates and runs `check_matrix_health.py`, which
          # needs the app binary present but not `pdfe_tests.exe` (that is the
          # gtest lane's requirement, and demanding it here would fail a
          # `ui_only` dispatch for a file it never uses).
          required-files: |
            bin/Debug/pdfe.exe

      - name: Aggregate the per-shard UI summaries (GitHub #278)
        if: ${{ !cancelled() }}
        shell: pwsh
        # GitHub #278. All UI shards run sequentially on ONE machine and write
        # the SAME $GITHUB_WORKSPACE\ui-out, and `ui-suite-summary.json` is
        # unsuffixed -- so each shard overwrites it and what survives the run
        # reflects only the LAST shard. Measured on run 38198875534: shard 1's
        # 12 failures were not recoverable from the uploaded pair.
        #
        # The per-shard gate inside ui-e2e is NOT wrong to read the unsuffixed
        # file: it reads it moments after its own shard wrote it, so it sees its
        # own run. The loss is everything AFTER the shards finish. So the fix
        # belongs here, in the job that already exists to reason over all
        # shards at once, rather than in a change to what each shard writes --
        # which would break that in-shard read.
        #
        # run_ui_suite.py already writes a shard-QUALIFIED summary beside the
        # unsuffixed one (ui-suite-summary.shard<N>of<M>.json), precisely so
        # they cannot collide. This merges them, and `--merge-summaries` prints
        # shards_missing so a partial merge cannot read as a sweep.
        run: |
          $uiOut = "$env:GITHUB_WORKSPACE\ui-out"
          if (-not (Test-Path $uiOut)) {
            Write-Host "no $uiOut -- the UI leg did not run (ui_only / skipped); nothing to aggregate."
            exit 0
          }
          $shardFiles = Get-ChildItem -Path $uiOut -Filter "ui-suite-summary.shard*of*.json" -ErrorAction SilentlyContinue
          if (-not $shardFiles) {
            Write-Error "no ui-suite-summary.shard*of*.json under $uiOut, so the per-shard summaries cannot be aggregated and GitHub #278's loss is unaddressed for this run. A single-shard run still writes one. This is a failure, not a skip."
            exit 1
          }
          python tests/scripts/run_ui_suite.py `
            --repo-root . `
            --output-dir $uiOut `
            --pdfe-exe "$env:GITHUB_WORKSPACE\build\vs2022\bin\Debug\pdfe.exe" `
            --merge-summaries $uiOut
          if ($LASTEXITCODE -ne 0) { throw "per-shard UI summary merge failed (exit $LASTEXITCODE)" }
          $merged = "$uiOut\ui-suite-summary-merged.json"
          if (-not (Test-Path $merged)) { throw "merge reported success but $merged is absent" }
          $m = Get-Content $merged -Raw | ConvertFrom-Json
          Write-Host ("UI run-wide (merged over shards {0}): files_run={1} tests={2} failing={3} files_with_problems={4} app_crashes={5} partial={6}" -f `
            ($m.shards_merged -join ','), $m.files_run, $m.totals.tests, $m.failure_count, $m.files_with_problems_count, $m.app_crash_count, $m.is_partial)
          if ($m.is_partial) {
            Write-Error ("the merged UI summary is PARTIAL: shards_missing=[{0}]. It describes part of a sweep and must not be read as one." -f ($m.shards_missing -join ','))
            exit 1
          }

      - name: Matrix-health gate over the MERGED per-shard aggregates
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $runtime = "$env:GITHUB_WORKSPACE\tests\_runtime"
          if (-not (Test-Path $runtime)) {
            Write-Error "no $runtime -- the UI shards produced no matrix CSVs at all, so there is nothing to score. That is a failure, not a skip."
            exit 1
          }
          # --floor-delta 0 --require-ran, NOT the defaults. When this step was
          # moved out of the UI job and onto the merged per-shard aggregates
          # (77e07ad), it was rewritten as `--floor-delta 5` with no
          # `--require-ran`, which silently gave back both A1-81 protections:
          # a five-row green drop became tolerated again, and a committed-green
          # row that never executed counted as "not red". This lane IS the full
          # sweep, so a drop is a real coverage loss to triage, not a tolerance
          # band. The shard merge is what makes --require-ran safe here: it
          # refuses to let one shard's `no-run` overwrite another shard's real
          # result, so "did not run" now means it genuinely ran nowhere.
          # ValidationLaneHygiene.MatrixHealthGateIsFullSweepStrict pins both.
          #
          # --max-planned / --fail-on-promotable are GitHub #142. Every check
          # above reads ONLY committed-green rows, so a `planned` row was
          # invisible to this gate rather than merely unsatisfied: it could
          # ratify finished work and say nothing at all about work not
          # started. The ceiling is the CURRENT count, so it is a ratchet --
          # a new scaffolded row without a driving test now has to be argued
          # for. It is deliberately a literal and not derived from the matrix:
          # a ceiling read out of the file it is checking compares the file
          # against itself and can never fail.
          # ValidationLaneHygiene.MatrixHealthGateRatchetsPlannedRows pins the
          # number here against the committed matrix, so the two cannot drift.
          python tests/scripts/check_matrix_health.py `
            --repo-root . `
            --runtime-shard-dir tests/_runtime `
            --floor-delta 0 `
            --require-ran `
            --max-planned 26 `
            --fail-on-promotable
          if ($LASTEXITCODE -ne 0) { throw "matrix-health gate failed (exit $LASTEXITCODE)" }

  render:
    name: render
    # Render-verification against the Release binary.
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    needs: [build, release]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # clean:false is LOAD-BEARING. actions/checkout defaults to
          # clean:true, which runs `git clean -ffdx`; the -x deletes
          # gitignored files, i.e. the entire build/ tree this job
          # depends on the `build` job having produced.
          clean: false

      - name: Ensure the build tree is present (same machine or restored)
        # See core-tests for the full rationale. The render suite consumes only
        # bin\Release\pdfe.exe, so that is all it declares -- a completeness
        # check scoped to what the caller actually reads, rather than a
        # one-size list that would fail this job on a Debug binary it never
        # opens.
        if: ${{ !cancelled() }}
        uses: ./.github/actions/ensure-build-tree
        with:
          store-key: ${{ github.sha }}
          artifact-name: pdfe-build-${{ github.sha }}
          github-token: ${{ github.token }}
          required-files: |
            bin/Release/pdfe.exe

      - name: Run render-verification suite (Release pdfe.exe)
        # Skipped for a targeted UI subset run (the subset is the validation
        # target; the render suite is a separate full-suite concern).
        #
        # F44 STEP-MASKING DECISION — GUARDED, producer = the RELEASE build.
        # This was the worst of the nine: the render suite sits below the UI E2E
        # sweep, the installer build and the installer smoke test, so under the
        # implicit success() ANY of those going red deleted the entire
        # oracle-backed render layer (systemic-defect proofs #1/#2/#4, DPI,
        # routing) from the run with no signal that it had gone. It consumes only
        # build/vs2022/bin/Release/pdfe.exe from "Build PDFE.exe (Release)".
        if: ${{ !cancelled() && (needs.release.outputs.release_built == 'success' || needs.build.outputs.restored == 'success') && !inputs.ui_only }}
        # Pipeline e7d3c2a1 Phase 6: oracle-backed render checks that assert
        # user-visible functions actually display/update on the canvas, plus the
        # systemic-defect proofs (#1/#2/#4 visibility, DPI, routing). The Release
        # pdfe.exe is built earlier (before the UI E2E sweep) so it is already
        # present here. FAILS THE JOB on any
        # UNEXPECTED failure — xfail stays xfail (exit 0), a real regression or a
        # strict xpass returns non-zero.
        shell: pwsh
        env:
          PDFE_BUILD_CONFIG: Release
        run: |
          $relBin   = "$env:GITHUB_WORKSPACE\build\vs2022\bin\Release"
          $vcpkgRel = "$env:GITHUB_WORKSPACE\build\vs2022\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$relBin;$vcpkgRel;$env:PATH"
          if (-not (Test-Path "$relBin\pdfe.exe")) {
            Write-Error "Release pdfe.exe not found at $relBin\pdfe.exe"
            exit 1
          }
          $renderTests = Get-ChildItem "$env:GITHUB_WORKSPACE\tests\ui_automation\test_render_*.py" |
            ForEach-Object { $_.FullName }
          if (-not $renderTests) {
            Write-Error "No test_render_*.py files found"
            exit 1
          }
          $junit = "$env:GITHUB_WORKSPACE\render-junit.xml"
          $log   = "$env:GITHUB_WORKSPACE\render-suite.log"
          # Run from the repo root so the `tests.ui_automation.harness` package
          # imports resolve (the suite uses absolute `from tests...` imports).
          Push-Location "$env:GITHUB_WORKSPACE"
          python -m pytest @renderTests --timeout=240 --junitxml=$junit -v `
            *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          # F48 / phase-65, found by the validator gate as the SIXTH emission
          # point. This step invokes pytest DIRECTLY, so it never passes through
          # run_ui_suite.py's scrub: $renderTests is built from .FullName, and
          # pytest's own `rootdir:` line names the runner account. Both files
          # below are uploaded as 14-day artifacts by "Upload test artifacts
          # (always)". Scrub BEFORE the exit check, so a red run's artifacts are
          # cleaned too -- they are uploaded either way.
          python "$env:GITHUB_WORKSPACE\tools\gate\scrub_artifacts.py" `
            "$env:GITHUB_WORKSPACE" $junit $log
          # GitHub #141 — THE ARTIFACT MUST ASSERT ITS OWN CONTENTS.
          #
          # known_issues.md §CI-LIMITATION-RENDER-JUNIT-EMPTY-ARTIFACT records a
          # run where THIS step went green, render-suite.log showed "46 passed,
          # 2 xfailed, 2 xpassed", and the uploaded render-junit.xml held zero
          # testcases. Nothing in this workflow would have noticed: the step's
          # exit code was the only evidence, and "parse the JUnit XML, never
          # trust the exit code" is this project's own standing rule (GAP-A15).
          #
          # p82 phase-9 measured every suspected link and refuted all of them,
          # and the symptom was re-measured clean on 2026-09-14 (62 testcases,
          # all 13 modules). But the originally cited run is 404 and past
          # retention, so it can never be re-examined — and a row of this class
          # is not closed by measuring it again, it is closed by making the
          # symptom impossible to hit unobserved.
          #
          # Runs AFTER the scrub so it validates the bytes actually uploaded,
          # and BEFORE the exit-code check so an empty artifact reddens the job
          # even when pytest itself exited 0 — which is precisely the reported
          # combination. --tests-dir makes the expectation come from the tree
          # (a module on disk that contributed no testcase fails), not from the
          # "48" in the issue title, which is already 62.
          # --backfill-root writes the child aggregate onto the root
          # <testsuites>, which pytest leaves bare: a consumer reading
          # testsuites/@tests saw nothing, and that is what "0 testcases" looked
          # like to whoever filed this.
          python "$env:GITHUB_WORKSPACE\tools\gate\check_render_junit.py" `
            $junit --tests-dir "$env:GITHUB_WORKSPACE\tests\ui_automation" `
            --backfill-root
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "render-junit.xml does not carry the render suite's tests (GitHub #141). The suite's own exit code is NOT evidence they ran."
          }
          Pop-Location
          if ($code -ne 0) {
            Write-Error "Render-verification suite reported unexpected failures (exit $code). See render-suite.log / render-junit.xml."
            exit 1
          }
          Write-Host "Render-verification suite clean (all pass / xfail as expected)."
          exit 0

  report:
    name: report
    # Summary, artifact upload, and the F49 step-level unmasking.
    runs-on: [self-hosted, Windows, X64, pdfe-windows]
    needs: [build, core-tests, release, ui-e2e, matrix-health, render]
    timeout-minutes: 30
    # always(): the F49 step-level unmasking must run even when an
    # upstream leg failed, or the control that reveals step-level red is
    # itself masked by the failure it exists to reveal.
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # clean:false is LOAD-BEARING. actions/checkout defaults to
          # clean:true, which runs `git clean -ffdx`; the -x deletes
          # gitignored files, i.e. the entire build/ tree this job
          # depends on the `build` job having produced.
          clean: false

      - name: Publish combined test summary (gtest + UI E2E)
        if: always()
        shell: pwsh
        run: |
          # --- gtest summary ---
          $gtestLog = "$env:GITHUB_WORKSPACE\pdfe_tests.log"
          if (Test-Path $gtestLog) {
            "## pdfe_tests (gtest)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Select-String -Path $gtestLog -Pattern 'tests from|PASSED|FAILED|SKIPPED' |
              ForEach-Object { $_.Line } |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "## pdfe_tests (gtest): no log produced" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # --- UI E2E summary ---
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $uiJunit = "$env:GITHUB_WORKSPACE\ui-junit.xml"
          $uiLog   = "$env:GITHUB_WORKSPACE\ui-suite.log"
          "## UI E2E (pytest + pywinauto)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path $uiJunit) {
            try {
              [xml]$xml = Get-Content $uiJunit
              $ts = $xml.testsuites.testsuite
              if ($ts -is [array]) { $ts = $ts[0] }
              "- tests=$($ts.tests) failures=$($ts.failures) errors=$($ts.errors) skipped=$($ts.skipped) time=$($ts.time)s" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              # List failure IDs
              $fails = $xml.SelectNodes("//testcase[failure or error]")
              if ($fails.Count -gt 0) {
                "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                "### Failing tests (Phase 2 input → Phase 3 to fix)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                $fails | ForEach-Object {
                  "$($_.classname)::$($_.name)"
                } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
            } catch {
              "Could not parse ui-junit.xml: $_" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          } elseif (Test-Path $uiLog) {
            "- ui-junit.xml missing; tail of ui-suite.log:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content $uiLog -Tail 30 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "- UI suite did not run (no ui-suite.log)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Bound the crash dumps and record what they need to be readable
        # WHY THIS STEP EXISTS, stated precisely because the obvious framing is
        # wrong. Crash dumps are ALREADY produced only on an actual crash:
        # CrashHandler::writeMinidump is reached only from the SEH handler, the
        # std::terminate handler, and an explicit request, and a clean run
        # leaves ui-out/crashdumps EMPTY so the glob below matches nothing. So
        # this is NOT a fix for "dumps upload unconditionally" -- they never
        # did. The 987 MB that filled the artifact quota means something worse:
        # CRASHES WERE HAPPENING ON MOST RUNS.
        #
        # NOT gated on run_ui_suite.py's files_with_problems_count, deliberately.
        # That is `timed_out or returncode != 0`, and tests/ui_harness/core/
        # launch.py:122 says these dumps exist to catch "an otherwise-invisible
        # teardown Access Violation". A crash that is otherwise invisible is
        # precisely one that may leave a ZERO exit code -- PDFE.exe dying at
        # teardown after pytest already passed. Gating on the problem count
        # would discard exactly the class the mechanism was built for.
        #
        # What this step actually does is BOUND the cost. One run that crashes
        # sixteen times would otherwise upload sixteen ~25-50 MB dumps.
        if: always()
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\ui-out\crashdumps"
          $out = "$env:GITHUB_WORKSPACE\crashdump-upload"
          $KEEP = 4

          # CLEAR THE STAGING DIR FIRST, AND UNCONDITIONALLY. Found by the
          # phase-2 security-audit gate, and it defeated the entire point of the
          # 3-day retention.
          #
          # `New-Item -Force` does NOT empty an existing directory, every
          # checkout in this lane uses `clean: false`, and the self-hosted
          # workspace persists between runs. So a run producing ZERO dumps used
          # to exit early -- before touching $out -- leaving a previous crashy
          # run's .dmp files sitting there. The upload step below is
          # `if: always()`, so it re-shipped those same sensitive bytes under
          # the NEW run's artifact name with a FRESH 3-day clock and stale
          # provenance. Retention was bounded per upload and unbounded in
          # effect: the same dump could be re-dated forever.
          #
          # The removal must happen BEFORE the early exit, which is why it is
          # here and not after the count check.
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $all = @(Get-ChildItem $src -Filter *.dmp -File -ErrorAction SilentlyContinue |
                   Sort-Object LastWriteTime -Descending)
          if ($all.Count -eq 0) {
            Write-Host "no crash dumps this run (staging dir cleared, so nothing stale can be re-uploaded)."
            exit 0
          }
          $keep = @($all | Select-Object -First $KEEP)
          $dropped = $all.Count - $keep.Count
          foreach ($d in $keep) { Copy-Item $d.FullName $out -Force }

          # NEVER SILENT. A truncated set that says nothing reads as "only this
          # many crashes happened", which is the opposite of the truth and
          # exactly the misreading this project has been bitten by before.
          if ($dropped -gt 0) {
            Write-Host "::warning::$($all.Count) crash dumps this run; uploading the $KEEP newest and DROPPING $dropped. The count, not the upload, is the signal."
          }
          $total = ($all | Measure-Object -Property Length -Sum).Sum

          # THE PROVENANCE SIDECAR. A dump without its matching PDB is an
          # address, not a diagnosis -- that is why the 2026-08-13 dumps could
          # not be symbolised. The PDB is 360 MB and cannot be an artifact, but
          # it already EXISTS in the SHA-keyed build store. What was missing was
          # anyone being told where.
          $pdb = "C:\pdfe-build-store\$env:GITHUB_SHA\bin\Debug\pdfe.pdb"
          $lines = @(
            "commit:            $env:GITHUB_SHA",
            "run:               $env:GITHUB_RUN_ID",
            "dumps produced:    $($all.Count)",
            "dumps uploaded:    $($keep.Count)   (cap $KEEP)",
            "dumps dropped:     $dropped",
            "total dump bytes:  $total",
            "",
            "TO SYMBOLISE THESE DUMPS you need the PDB for THIS commit:",
            "    $pdb",
            "present on the machine that ran this job: $(Test-Path $pdb)",
            "",
            "That store is PRUNED. The publish step keeps only the most recent",
            "few commits, so this PDB outlives these dumps only if the store is",
            "pinned (a crash-pin.txt is written below when the store is",
            "reachable from this job). If the PDB is gone, a dump yields",
            "addresses and offsets only -- see",
            "docs/audit/crash-evidence/2026-08-13-pdfe-uaf.md for what that",
            "does and does not allow you to conclude.",
            "",
            "WHERE THESE LIVE: the PRIVATE Cloudflare R2 bucket, under",
            "pdfe-crashdumps/<commit>/run-<run id>/. They are deliberately NOT a",
            "GitHub artifact -- artifacts of a public repository are",
            "downloadable by anyone, and these are sensitive:",
            "MiniDumpWithDataSegs + MiniDumpWithIndirectlyReferencedMemory",
            "capture heap, which can include document passwords, decrypted",
            "content from copy-restricted PDFs, OCSP/CRL tokens and absolute",
            "host paths. Do not move them anywhere public."
          )
          $lines | Out-File -FilePath "$out\DUMP-PROVENANCE.txt" -Encoding utf8

          # PIN THE STORE so a later run's pruning does not orphan the PDB this
          # dump needs. Best-effort: on a multi-runner lane this job may not be
          # on the machine that built, in which case there is nothing to pin
          # here and the sidecar above says so.
          $store = "C:\pdfe-build-store\$env:GITHUB_SHA"
          if (Test-Path $store) {
            "pinned by run $env:GITHUB_RUN_ID -- this commit produced $($all.Count) crash dump(s); its PDB must outlive them" |
              Out-File -FilePath (Join-Path $store 'crash-pin.txt') -Encoding utf8
            Write-Host "pinned $store against pruning (crash dumps reference its PDB)"
          } else {
            Write-Host "::warning::no local build store at $store, so the matching PDB cannot be pinned from this job. These dumps may become unsymbolisable."
          }

      - name: Ship crash dumps to R2 (PRIVATE) — never to a GitHub artifact
        # WHY THIS IS NOT AN ARTIFACT ANY MORE.
        #
        # These used to upload as `windows-validation-crashdumps`, a 3-day
        # artifact. That was already an improvement on riding inside the 14-day
        # logs artifact -- but it is unsafe the moment this repository becomes
        # PUBLIC, because Actions artifacts of a public repo are downloadable by
        # anyone with read access, which is then everyone.
        #
        # And a minidump of this application is sensitive. CrashHandler.cpp:558
        # requests MiniDumpWithDataSegs + MiniDumpWithIndirectlyReferencedMemory,
        # which capture writable data segments and heap reachable from pointers.
        # PasswordDialog.cpp states plainly that a PDF password's original bytes
        # "are freed unwiped and remain in the heap until reused", and
        # EncryptionManager.cpp's user/owner passwords are never wiped at all.
        # A dump can therefore contain document passwords, decrypted content from
        # copy-restricted PDFs, OCSP/CRL tokens and absolute host paths.
        #
        # So they go to the PRIVATE R2 bucket instead -- the same store the build
        # closure uses, which already exists, is not quota-bound, and is not
        # published by making the repository public.
        #
        # IF R2 IS NOT CONFIGURED, NOTHING IS PUBLISHED. Not to an artifact, not
        # anywhere. The dumps stay on the runner's own disk, and this step says
        # so loudly. That is the deliberate fail-SAFE direction: falling back to
        # an artifact would restore exactly the exposure this change removes, and
        # a fallback that reintroduces the hazard is not a fallback.
        #
        # continue-on-error is safe here for the same reason as the build
        # uploads and NOT for the R-32/GAP-A15 reason: nothing in this run
        # consumes these bytes, so a swallowed failure costs post-mortem
        # material on one run and cannot turn a red suite green. The crash
        # itself is reported by the job that crashed.
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\crashdump-upload"
          $files = @(Get-ChildItem $out -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            Write-Host "no crash dumps staged this run; nothing to ship."
            exit 0
          }

          $r2e = $env:PDFE_R2_ENDPOINT; $r2b = $env:PDFE_R2_BUCKET
          $r2k = $env:PDFE_R2_ACCESS_KEY_ID; $r2s = $env:PDFE_R2_SECRET_ACCESS_KEY
          if (-not ($r2e -and $r2b -and $r2k -and $r2s)) {
            Write-Host "::warning::$($files.Count) crash dump file(s) staged, but R2 is not configured on this machine, so they are NOT being published anywhere."
            Write-Host "  They remain on this runner at: $out"
            Write-Host "  They are deliberately NOT uploaded as a GitHub artifact: a minidump of this app can contain document passwords and decrypted content, and artifacts of a public repository are downloadable by anyone."
            Write-Host "  Configure PDFE_R2_* on this machine (docs/ci/r2-build-store.md) to ship them privately."
            exit 0
          }
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::R2 is configured but the aws CLI is absent; crash dumps stay on this runner at $out and are NOT published."
            exit 0
          }

          $env:AWS_ACCESS_KEY_ID     = $r2k
          $env:AWS_SECRET_ACCESS_KEY = $r2s
          $env:AWS_DEFAULT_REGION    = 'auto'
          # Keyed by commit AND run, so two runs of the same commit do not
          # overwrite each other's evidence -- the thing a SHA-only key would do
          # silently, and exactly when a crash is intermittent and you most want
          # both captures.
          $prefix = "pdfe-crashdumps/$env:GITHUB_SHA/run-$env:GITHUB_RUN_ID"
          $sent = 0
          foreach ($f in $files) {
            aws s3 cp $f.FullName "s3://$r2b/$prefix/$($f.Name)" --endpoint-url $r2e --only-show-errors
            if ($LASTEXITCODE -eq 0) { $sent++ }
            else { Write-Host "::warning::failed to ship $($f.Name) to R2" }
          }
          Write-Host "shipped $sent of $($files.Count) crash-dump file(s) to s3://$r2b/$prefix/"
          if ($sent -lt $files.Count) {
            Write-Host "::warning::some crash dumps did not reach R2; the unshipped ones remain only on this runner at $out"
          }

      - name: Upload test artifacts (always)
        # Promoted from on-failure to always: Phase 2 wants the UI
        # failure list available even when the gtest step is green.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-validation-logs
          path: |
            pdfe_tests.log
            gtest-results.xml
            gtest-security-subset-results.xml
            ctest-security-results.xml
            ctest-lint-results.xml
            parity-results.xml
            coverage-cobertura.xml
            ui-suite.log
            ui-junit.xml
            ui-out/**
            !ui-out/crashdumps/**
            render-suite.log
            render-junit.xml
            tests/_tmp/**
            tests/visual/_failure_artifacts/**
            build/vs2022/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Step-level conclusions — unmask red steps behind a run status (F49)
        # Deferred-backlog F49, follow-up phase-66. Runs LAST and ALWAYS.
        #
        # THE DEFECT THIS SURFACES, with the run that demonstrates it. Run
        # 31359621883 reported one thing at the run level:
        #
        #     conclusion: cancelled
        #
        # and contained three steps that had gone red on their own merits:
        #
        #     step 13  failure  Run + verify CROSS-PLATFORM CORE PARITY suite
        #     step 15  failure  Code coverage (OpenCppCoverage -> Cobertura)
        #     step 18  failure  Run ctest -L security
        #
        # `cancelled` "alerts nobody and is indistinguishable from a deliberate
        # cancellation" (audit-of-audits SS4.3), so all three were invisible.
        # This step reads the run's OWN job/step data and prints every red step
        # into the job summary, whatever the run-level conclusion later says.
        #
        # --enforce is deliberately NOT passed. Any step this finds has already
        # failed the job on its own; re-failing here would add a second red for
        # one cause and make the summary harder to read, not easier. The job is
        # to SURFACE, and the exit code is not the surface anybody reads.
        #
        # STATED LIMITATION, and it is the important one: this cannot report on
        # a run whose runner DIED, because then nothing here executes either --
        # and that is precisely how the eight no-green runs in the
        # audit-of-audits ended. For those, run it out of band against the run
        # id, which needs no runner at all:
        #
        #     python tools/gate/check_ci_readiness.py steps \
        #         --repo <owner/repo> --run-id <id> --enforce
        #
        # The in-run step covers "the job completed and something inside it was
        # red"; the out-of-band form covers "the job never got that far". Both
        # are needed, and neither substitutes for the other.
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$env:GITHUB_WORKSPACE\tools\gate\check_ci_readiness.py" steps `
            --repo "$env:GITHUB_REPOSITORY" --run-id "$env:GITHUB_RUN_ID"
          $rc = $LASTEXITCODE
          # The bare `exit 0` this replaces reported SUCCESS when the checker
          # had 403'd and surfaced nothing (dispatched run 32237974228): "the
          # unmasker could not run" was indistinguishable from "the unmasker
          # ran and found nothing". A step whose whole purpose is to stop a
          # silent failure must not fail silently itself.
          #
          # 3 = could not perform the check -> FAIL this step; it is the only
          #     signal that the mechanism is broken.
          # 1 = ran, found red steps -> stay green ON PURPOSE. --enforce is not
          #     passed: anything it finds already failed the job on its own, and
          #     a second red for one cause makes the summary harder to read.
          # 0 = ran, nothing red.
          if ($rc -eq 3) {
            Write-Error "The step-level unmasking check could not run (exit 3). This is NOT a clean result -- the F49 mechanism is broken, not quiet. Most likely the job lacks 'permissions: actions: read'."
            exit 1
          }
          exit 0
