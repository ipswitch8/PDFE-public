name: Linux Build Validation

# STATUS NOTE 2026-08-10 — READ THIS BEFORE FILING A BUG ABOUT A RED RUN.
# macOS and Linux builds are NOT actually being done yet. PDFE is developed and
# shipped on Windows; those two platforms are a FUTURE target. This lane and
# macos-validation.yml are ASPIRATIONAL: they attempt a genuine build and test
# run, they fail, and that failure is EXPECTED until the port is undertaken.
# A red run here is NOT a regression and NOT an "unnoticed red CI lane" finding
# (that mistake was actually made during phase-52). Judge CI health on the
# WINDOWS lanes: fast-checks, windows-validation, ci-liveness. The lane is kept
# rather than deleted because it is the scaffold the eventual port builds
# against — but while it is permanently red it can MASK a real Linux breakage,
# the same masking species as F44/F46, so the first task of any actual port is
# to establish a green baseline here.
#
# Iterates the Linux port — configures + builds PDFE + runs gtest
# on the self-hosted Hetzner runner (provisioned ephemerally via
# tests/scripts/hetzner_ephemeral_runner.ps1).
#
# No sanitizer instrumentation. No fuzz harnesses. The goal is to
# answer one question: does PDFE compile and pass the gtest suite
# on Linux? When this passes end-to-end, the Linux port is done
# and the (heavier) hetzner-sanitizer.yml workflow can be enabled.

on:
  # DISPATCH-ONLY BY DESIGN — do NOT add a schedule or push trigger.
  #
  # WHY (meta-audit follow-up F5, gaps SEC-109 + SEC-19-Linux-half). Two
  # independent reasons, either of which is sufficient:
  #
  #   1. NO RUNNER EXISTS ON A TIMER. This lane targets
  #      [self-hosted, linux, hetzner, sanitizer], which is an EPHEMERAL
  #      Hetzner VM provisioned on demand by
  #      tests/scripts/hetzner_ephemeral_runner.ps1 and ALWAYS destroyed
  #      afterwards (`hcloud server delete`) — the same constraint
  #      hetzner-sanitizer.yml documents. A `schedule:` here would fire with
  #      no runner online and queue forever, or, paired with
  #      auto-provisioning, would spin up a billed VM unattended on a cron.
  #
  #   2. THE PORT IS DEFERRED. Tracker #42 (macOS -ljpeg link failure and the
  #      Linux test failures) is deferred BY EXPLICIT USER DIRECTION — PDFE
  #      ships Windows-only today. Putting a known-red port on an automatic
  #      trigger manufactures a standing red that trains people to ignore CI.
  #      The deferral is recorded in docs/audit/older-threads-followup.md.
  #
  # CONSEQUENCE, STATED IN WRITING: gap SEC-17 (no MSan anywhere) and the
  # LINUX HALF of gap SEC-19 cannot be closed while #42 is deferred, because
  # MSan does not exist on Windows/MSVC. They are recorded BLOCKED-BY-#42,
  # not closed. Re-evaluate this trigger when #42 is picked up.
  #
  # DECISION RECORD:
  #   docs/audit/meta-audit-2026-07/followup/phase-5-dispositions.md
  #   docs/audit/meta-audit-2026-07/followup-pipeline-plan.md (WONT-FIX / DEFERRED)
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, hetzner, sanitizer]
    timeout-minutes: 360
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      # Hermetic mujs override for the codeberg 1.3.8 tarball hash drift
      # (see tools/vcpkg-overlays/mujs/portfile.cmake). Ephemeral runners
      # have a cold binary cache and rebuild mujs from source, hitting the
      # drifted download; this overlay repins to the current (byte-identical
      # source) bytes. Windows lane unaffected.
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/tools/vcpkg-overlays

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Use pre-installed vcpkg + rust
        run: |
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          echo "$HOME/vcpkg" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          cmake -B build-linux -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build build-linux -j$(nproc)

      - name: Run gtest suite
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          # vcpkg's Qt6 build only ships the xcb platform plugin
          # ("Available platform plugins are: xcb"). xvfb-run
          # provides a virtual X server so xcb can connect.
          #
          # R2-24: invoke the built pdfe_tests binary DIRECTLY rather than
          # `ctest`. The abandoned ctest discovery path is vacuously green:
          # if test registration is broken (zero tests discovered) ctest
          # reports "No tests were found!!!" but STILL exits 0, so a build
          # that silently stops running any tests would "pass". Running the
          # gtest binary directly and emitting a JUnit XML lets the next step
          # assert tests>0 / failures=0 / errors=0 — a real, non-vacuous gate.
          cd build-linux
          BIN="$(find . -type f -name pdfe_tests -perm -u+x | head -1)"
          if [ -z "$BIN" ]; then
            echo "::error::pdfe_tests binary not found under build-linux — build produced no test executable"
            exit 1
          fi
          echo "Running gtest binary: $BIN"
          # Do not let a non-zero test exit abort before the XML is written;
          # the parse step is the authoritative pass/fail oracle.
          set +e
          xvfb-run -a "$BIN" --gtest_output=xml:gtest-results.xml
          gtest_rc=$?
          set -e
          echo "pdfe_tests exit code: $gtest_rc"
          if [ ! -f gtest-results.xml ]; then
            echo "::error::gtest-results.xml was not produced — cannot verify a non-vacuous run"
            exit 1
          fi

      - name: Assert non-vacuous gtest results (no zero/partial green)
        run: |
          # R2-24 honesty gate (SKIP=FAIL): parse the JUnit XML and FAIL on a
          # vacuous exit-0. A pass requires tests>0 AND failures=0 AND errors=0.
          # gtest's exit code is known to mask failures (GAP-A15), so the XML —
          # not the process exit — is the source of truth.
          cd build-linux
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('gtest-results.xml').getroot()
          # Aggregate across <testsuites> (root) and/or nested <testsuite>.
          def geti(el, name):
              try: return int(el.get(name, '0'))
              except (TypeError, ValueError): return 0
          tests    = geti(root, 'tests')
          failures = geti(root, 'failures')
          errors   = geti(root, 'errors')
          disabled = geti(root, 'disabled')
          if tests == 0:  # root did not carry counts; sum the suites
              suites = root.findall('testsuite') or root.findall('.//testsuite')
              tests    = sum(geti(s, 'tests')    for s in suites)
              failures = sum(geti(s, 'failures') for s in suites)
              errors   = sum(geti(s, 'errors')   for s in suites)
              disabled = sum(geti(s, 'disabled') for s in suites)
          print(f"tests={tests} failures={failures} errors={errors} disabled={disabled}")
          problems = []
          if tests <= 0:
              problems.append("VACUOUS: zero tests ran (registration broken or binary skipped) — refusing to report green")
          if failures > 0:
              problems.append(f"{failures} test failure(s)")
          if errors > 0:
              problems.append(f"{errors} test error(s)")
          if problems:
              print("::error::Linux gtest gate FAILED: " + "; ".join(problems))
              sys.exit(1)
          print(f"Linux gtest gate PASSED: {tests} tests, 0 failures, 0 errors.")
          PY

      - name: Run + verify CROSS-PLATFORM CORE PARITY suite (C-10)
        # C-10: assert the platform-INDEPENDENT behavioral core explicitly, using
        # the SAME selection as the Windows and macOS lanes. tools/gate/parity_
        # filter.py generates the gtest_filter from tools/gate/parity_suite.txt --
        # one shared script + one shared source list -> a byte-identical filter on
        # every platform (no per-lane copy to drift). The full suite above already
        # runs a superset, but this step pins the CROSS-PLATFORM CONTRACT: the same
        # named core must pass here, on macOS, and on Windows. GAP-A15: the produced
        # XML (not the process exit code) is the pass/fail authority; --min-tests 200
        # guards against a silently-shrunk selection (local Windows run ~950).
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          cd build-linux
          BIN="$(find . -type f -name pdfe_tests -perm -u+x | head -1)"
          if [ -z "$BIN" ]; then
            echo "::error::pdfe_tests binary not found under build-linux"
            exit 1
          fi
          FILTER="$(python3 "$GITHUB_WORKSPACE/tools/gate/parity_filter.py")"
          echo "parity gtest_filter length: ${#FILTER}"
          set +e
          xvfb-run -a "$BIN" --gtest_filter="$FILTER" \
            --gtest_output=xml:parity-results.xml --gtest_brief=1
          echo "parity pdfe_tests exit code: $?"
          set -e
          if [ ! -f parity-results.xml ]; then
            echo "::error::parity-results.xml not produced -- cannot verify a non-vacuous run"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tools/gate/check_junit_xml.py" parity-results.xml --min-tests 200

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux-build-logs
          path: |
            build-linux/CMakeFiles/CMakeError.log
            build-linux/CMakeFiles/CMakeOutput.log
            build-linux/vcpkg-manifest-install.log
            build-linux/gtest-results.xml
            build-linux/parity-results.xml
          if-no-files-found: ignore
          retention-days: 14
