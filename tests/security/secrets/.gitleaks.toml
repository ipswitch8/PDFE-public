# gitleaks config for the PDFE repo, phase-8 secrets scan.
#
# We use the upstream default ruleset by extending it; this file
# customizes only the allowlists for paths and known false-positive
# patterns the PDFE codebase legitimately contains (test fixtures
# with deliberately-fake keys, vcpkg build artifacts, etc.).
#
# Reference: https://github.com/gitleaks/gitleaks#configuration

[extend]
# Pull every default rule (api keys, private keys, tokens, etc.)
useDefault = true

[allowlist]
description = "PDFE-specific allowlist"

# --- Path globs that legitimately contain key-like material ---
paths = [
    # Build trees and vcpkg installs are not committed; defensive.
    '''vcpkg_installed/.+''',
    '''build/.+''',
    '''build-.+/.+''',

    # Test fixtures: PDFs and PEMs intentionally contain weak / fake
    # cryptographic material so signature/encryption tests don't
    # depend on real CA infrastructure.
    '''tests/fixtures/.+\.pem''',
    '''tests/fixtures/.+\.crt''',
    '''tests/fixtures/.+\.key''',
    '''tests/fixtures/.+\.pdf''',
    '''tests/fixtures/.+\.p12''',

    # Generator scripts that emit the above fixtures inline. The
    # in-script literal keys are deliberate test inputs, not
    # production credentials.
    '''tests/fixtures/generate_ca_signed_pdf\.py''',
    '''tests/fixtures/generate_signed_pdf\.py''',
    '''tests/fixtures/generate_timestamped_pdf\.py''',

    # Phase-2 malicious-PDF corpus is regenerated via upstream tool
    # (gitignored); never committed.
    '''tests/security/corpus/malicious_pdf/.+''',

    # Auto-saved IDE files / build artifacts.
    '''.+\.user''',
    '''.+\.suo''',
    '''.+\.opensdf''',
]

# --- Specific commit hashes whose findings have been accepted ---
# (empty until the first real scan triages anything)
commits = []

# --- Specific stop-words to suppress ---
# Rationale: these are commonly-flagged strings that appear in
# documentation/comments referring to credential handling, not
# actual credentials.
stopwords = [
    "FAKE_KEY",
    "FAKE_CERT",
    "TEST_PASSWORD",
    "EXAMPLE_TOKEN",
    "your-api-key-here",
    "REPLACE_ME",
]
