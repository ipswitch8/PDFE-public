[pytest]
# GitHub #257.  --basetemp is NOT set here, deliberately.
#
# It used to read `--basetemp=tests/_tmp`, pinning every session to one shared
# directory.  pytest DELETES an explicitly-set basetemp at session start, so a
# second concurrent session -- or the nested pytest spawned by
# tools/gate/test_desktop_outage_hook_end_to_end.py -- wiped a running session's
# tmp_path out from under it.  The failure looks like random disappearing
# fixtures, which is the worst possible presentation.
#
# The REPO-ROOT conftest.py (not tests/conftest.py, which covers tests/ only)
# now roots it at tests/_tmp/s<pid>: still under tests/_tmp/ so the janitor and
# every guard that excludes that prefix keep working, but disjoint per process.
# An explicit --basetemp on the command line still wins.
#
# DO NOT reinstate --basetemp here. addopts populates config.option.basetemp
# BEFORE pytest_configure runs, so the root hook early-returns and the shared
# directory comes straight back -- silently. That is guarded by
# tests/scripts/test_basetemp_isolation.py, which fails if this line grows a
# --basetemp again.
addopts = -p no:capture

# tests/ contains both C++ GoogleTest sources (test_*.cpp) and Python
# E2E tests (test_ui_*.py / test_pdf_open_robustness.py).  Restrict
# pytest collection to Python test files so it does not try to import
# the .cpp source listings as modules.
python_files = test_*.py
testpaths = tests

# Pytest does not need to wander into the tests/_tmp/ working
# directory (it would just recurse over its own outputs) or into the
# build tree.
norecursedirs = _tmp _runtime fixtures/_runtime build out vcpkg_installed external

# Pipeline f2a8c3e1 phase-5b: register the timeout marker so pytest
# emits PytestUnknownMarkWarning (or, with --strict-markers, a hard
# error) instead of silently treating @pytest.mark.timeout(...) as a
# no-op when pytest-timeout is not installed.  pytest-timeout is
# declared in tests/ui_automation/requirements.txt; install via
# `pip install -r tests/ui_automation/requirements.txt`.
markers =
    timeout(seconds): hard wall-clock timeout for a single test; requires pytest-timeout package
    autosave: test exercises autosave / crash-recovery functionality; EXEMPT from the end-of-test recovery-sidecar cleanup (see tests/conftest.py::_clean_autosave_sidecars)
